</div><div class="controls" aria-label="播放控制"><button id="play" type="button" aria-pressed="false">播放</button><button id="replay" type="button">重播</button><input id="seek" type="range" min="0" max="16" value="0" step="0.01" aria-label="动画时间"><span id="clock" aria-live="off">0 / 16 秒</span><label>倍速 <select id="speed" aria-label="播放速度"><option value="0.5">0.5×</option><option value="1" selected>1×</option><option value="1.5">1.5×</option><option value="2">2×</option></select></label></div><p class="note">E我、E爱、E你是固定初始嵌入的符号。概念位置标签帮助解释词序，不是真实位置编码或模型预测。　单次播放后停止。<noscript>交互需启用 JavaScript；可打开同目录的 GIF 观看完整过程。</noscript></p></main><script>const LessonConfig={"id":"position-information","title":"相同的 Token，为什么词序还重要？","width":1440,"height":860,"subtitle":"我爱你 / 你爱我：token 身份不变，序列位置与句义不同。","duration":16,"caption":"E我、E爱、E你是固定初始嵌入的符号。概念位置标签帮助解释词序，不是真实位置编码或模型预测。","snapshots":[1,4,7,11,14]};</script><script>(function (root, factory) {

    const messages={compare:'① 两句话包含相同的 token；先看它们的排列。',lookup:'② 同一 token 查同一行初始嵌入；E我 在两句中不变。',positions:'③ 加上概念位置标签：同一个“我”，从第 1 位到第 3 位。',roles:'④ 对照人类读出的句义：表达爱意的人和对象换了。',summary:'⑤ 身份相同，位置不同；只查嵌入表还不能附上句子角色。'};
    return {time,stage,sentences,sameTokenInventory:true,sameSequence:false,message:messages[stage],

</script><script>'use strict';
function renderScene(s) {
  text('ps-step',s.message); text('ps-takeaway',s.takeaway);

}
</script><script>const svg=document.querySelector('svg'),$=id=>document.getElementById(id);

async function exportPNG(t){pause();renderFrame(t);await document.fonts.ready;const clone=svg.cloneNode(true);clone.setAttribute('xmlns','http://www.w3.org/2000/svg');clone.setAttribute('width',String(LessonConfig.width));clone.setAttribute('height',String(LessonConfig.height));const xml=new XMLSerializer().serializeToString(clone),url=URL.createObjectURL(new Blob([xml],{type:'image/svg+xml;charset=utf-8'}));try{const image=new Image();await new Promise((resolve,reject)=>{image.onload=resolve;image.onerror=reject;image.src=url});const canvas=document.createElement('canvas');canvas.width=LessonConfig.width;canvas.height=LessonConfig.height;const ctx=canvas.getContext('2d');ctx.fillStyle='#fafbf9';ctx.fillRect(0,0,canvas.width,canvas.height);ctx.drawImage(image,0,0,canvas.width,canvas.height);return canvas.toDataURL('image/png')}finally{URL.revokeObjectURL(url)}}
