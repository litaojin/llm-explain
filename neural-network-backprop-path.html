<script>(function(root){
 const DURATION=24,parameters={w1:.5,w2:1,b1:0,v:.5,b2:0},x=[2,1],target=3,clamp=(v,a=0,b=1)=>Math.max(a,Math.min(b,v));
 function forward(p=parameters){const z=p.w1*x[0]+p.w2*x[1]+p.b1,h=Math.max(0,z),prediction=p.v*h+p.b2;return {z,h,prediction,loss:(prediction-target)**2}}
 const f=forward(),dy=2*(f.prediction-target),dh=dy*parameters.v,dz=dh*(f.z>0?1:0),gradients={w1:dz*x[0],w2:dz*x[1],b1:dz,v:dy*f.h,b2:dy},derivatives={y:dy,h:dh,z:dz};
 const routes={loss:{start:5.8,end:7.5,value:dy},hidden:{start:8.8,end:10.2,value:dh},v:{start:10.8,end:12.5,value:gradients.v},b2:{start:10.8,end:12.5,value:gradients.b2},relu:{start:13.8,end:15.8,value:dz},w1:{start:16.8,end:19,value:dz},w2:{start:16.8,end:19,value:dz},b1:{start:16.8,end:19,value:dz}};
 function stateAt(input){const time=clamp(Number.isFinite(input)?input:0,0,DURATION),stage=time<2.5?'recall':time<5.5?'loss':time<8.5?'loss-gradient':time<10.5?'hidden-gradient':time<13.5?'output-parameters':time<16.5?'relu-gradient':time<20.5?'input-parameters':'complete',known=[];for(const [key,at]of [['y',7.5],['h',10.2],['v',12.5],['b2',12.5],['z',15.8],['w1',19],['w2',19],['b1',19]])if(time>=at)known.push(key);const pulses={};for(const [name,r]of Object.entries(routes))pulses[name]={progress:clamp((time-r.start)/(r.end-r.start)),visible:time>r.start&&time<r.end,arrived:time>=r.end,value:r.value,started:time>=r.start};return {time,stage,parameters:{...parameters},forward:{...f},gradients:{...gradients},derivatives:{...derivatives},known,pulses,lossOpacity:clamp((time-2.5)/.6),seedVisible:time>=5.5,parametersUpdated:false}}
 const api={DURATION,forward,stateAt};if(typeof module==='object'&&module.exports)module.exports=api;else root.BackpropPath=api;
})(typeof window==='object'?window:globalThis);
</script><script>const M=BackpropPath,svg=document.querySelector('svg'),$=id=>document.getElementById(id),renderMode=new URLSearchParams(location.search).has('render');if(renderMode)document.body.classList.add('render');let current=0,playing=false,last=null,speed=1,frameDiagnostics;const fmt=n=>String(n).replace('-','−');
function text(id,v){$(id).textContent=String(v)}function opacity(id,n){$(id).setAttribute('opacity',String(n));$(id).setAttribute('aria-hidden',String(n===0))}
function renderFrame(t){const s=M.stateAt(t),has=k=>s.known.includes(k);current=s.time;opacity('loss-part',s.lossOpacity);opacity('seed',s.seedVisible?1:0);opacity('dy-label',has('y')?1:0);opacity('relu-local',s.time>=13.5?1:0);for(const k of ['w1','w2','b1','v','b2']){opacity('grad-'+k,has(k)?1:0);text('grad-'+k,'∂L/∂'+({w1:'w₁',w2:'w₂',b1:'b₁',v:'v',b2:'b₂'}[k])+' = '+fmt(s.gradients[k]))}text('dy-label','∂L/∂ŷ = '+fmt(s.derivatives.y));text('sum-detail',has('z')?'∂L/∂z = '+fmt(s.derivatives.z):'1 + 1 + 0 = 2');$('sum-detail').setAttribute('class','center '+(has('z')?'gradient':'green'));const hLabel=svg.querySelector('#activation > text');hLabel.textContent=has('h')?'∂L/∂h = '+fmt(s.derivatives.h):'h = max(0, z)';hLabel.setAttribute('class','center '+(has('h')?'gradient':'green'));
const subtitles={recall:'01 / 07 · 先保留正向计算结果：输入与参数都不变',loss:'02 / 07 · 加上正确目标 y=3，用平方损失比较预测与目标', 'loss-gradient':'03 / 07 · 从 Loss 出发：先求 Loss 对预测 ŷ 的变化率','hidden-gradient':'04 / 07 · 回到隐藏输出 h：传来的梯度 × 本地导数 v','output-parameters':'05 / 07 · 同一输出节点，还能求出 v 与 b₂ 的梯度','relu-gradient':'06 / 07 · 穿过 ReLU：在本例 z=2 处，本地导数是 1','input-parameters':'07 / 07 · 回到加权求和：沿各支路求 w₁、w₂、b₁ 的梯度',complete:'07 / 07 · BP 完成：反向路径留下各参数的梯度，参数尚未更新'};text('step',subtitles[s.stage]);
let formula,explanation;switch(s.stage){case 'recall':formula='正向：z=2 → h=ReLU(2)=2 → ŷ=0.5×2+0=1';explanation='沿用上一张的网络；这次要问：每个参数怎样影响最后的 Loss？';break;case 'loss':formula='L = (ŷ − y)² = (1 − 3)² = 4';explanation='Loss 是一个数；接下来反向计算的是变化率，不是把数字 4 倒灌回网络。';break;case 'loss-gradient':formula='∂L/∂ŷ = 1 × 2(ŷ−y) = 2(1−3) = '+fmt(s.derivatives.y);explanation='−4 表示局部变化率：预测 ŷ 小幅增大时，这里的 Loss 会减小。';break;case 'hidden-gradient':formula='∂L/∂h = (∂L/∂ŷ) × (∂ŷ/∂h) = '+fmt(s.derivatives.y)+' × '+s.parameters.v+' = '+fmt(s.derivatives.h);explanation='本地导数是 v=0.5；把传来的梯度乘上它，再继续向左。';break;case 'output-parameters':formula='∂L/∂v = '+fmt(s.derivatives.y)+' × h = '+fmt(s.gradients.v)+'；∂L/∂b₂ = '+fmt(s.derivatives.y)+' × 1 = '+fmt(s.gradients.b2);explanation='对 v 求导时乘 h=2；对偏置 b₂ 求导时乘 1。';break;case 'relu-gradient':formula='∂L/∂z = (∂L/∂h) × ReLU′(2) = '+fmt(s.derivatives.h)+' × 1 = '+fmt(s.derivatives.z);explanation='本例 z 为正，ReLU 的导数为 1；这不是所有激活状态都成立的规则。';break;case 'input-parameters':formula='∂L/∂w₁ = −2×2 = −4；∂L/∂w₂ = −2×1 = −2；∂L/∂b₁ = −2×1 = −2';explanation='传来的梯度 −2 沿各支路继续求导；不是把 Loss=4 平分。';break;default:formula='参数梯度：w₁: −4   w₂: −2   b₁: −2   v: −8   b₂: −4';explanation='链式法则：传来的梯度 × 本地导数，逐段反向递推。'}text('formula',formula);text('explanation',explanation);text('scope-note','灰色箭头：原先的正向计算；蓝色箭头：梯度反向传播。∂L/∂a 表示 a 微变时 Loss 的局部变化率。');
const pulses=[];for(const [name,pulse]of Object.entries(s.pulses)){const route=$('reverse-'+name),g=$('pulse-'+name),p=route.getPointAtLength(route.getTotalLength()*pulse.progress);opacity('reverse-'+name,pulse.started?(pulse.arrived?.65:1):0);opacity('pulse-'+name,pulse.visible?1:0);g.setAttribute('transform',`translate(${p.x} ${p.y})`);g.querySelector('text').textContent=fmt(pulse.value);pulses.push({route:name,visible:pulse.visible,position:[p.x,p.y],value:pulse.value})}
for(const [id,key]of [['y-shape','y'],['h-shape','h'],['z-shape','z']]){$(id).style.stroke=has(key)?'#326a91':'#cad6ce';$(id).style.fill=has(key)?'#edf4f8':'#f0f7f2'}
$('seek').value=String(Math.round(current*100));text('clock',current.toFixed(1)+' / '+M.DURATION+'s');text('play',playing?'暂停':current===M.DURATION?'演示结束':'播放');const labels={};for(const k of ['w1','w2','b1','v','b2'])if(has(k))labels[k]=$('grad-'+k).textContent;frameDiagnostics={time:s.time,stage:s.stage,pulses,known:s.known,gradientLabels:labels,parameters:s.parameters,parametersUpdated:false,forwardValues:{z:$('z-value').textContent,h:$('h-value').textContent,y:$('y-value').textContent},originalPositions:{x1:[Number($('x1').querySelector('circle').getAttribute('cx')),Number($('x1').querySelector('circle').getAttribute('cy'))],z:[Number($('z-shape').getAttribute('cx')),Number($('z-shape').getAttribute('cy'))]},model:s};return frameDiagnostics;}
function textBoundaryFailures(){const r=svg.getBoundingClientRect();return [...svg.querySelectorAll('text')].filter(el=>{if(el.closest('.signal'))return false;const b=el.getBBox(),m=el.getScreenCTM();return [[b.x,b.y],[b.x+b.width,b.y],[b.x,b.y+b.height],[b.x+b.width,b.y+b.height]].some(([x,y])=>{const p=new DOMPoint(x,y).matrixTransform(m);return p.x<r.left-.5||p.x>r.right+.5||p.y<r.top-.5||p.y>r.bottom+.5})}).map(el=>el.textContent)}
async function exportPNG(t){renderFrame(t);const xml=new XMLSerializer().serializeToString(svg),url=URL.createObjectURL(new Blob([xml],{type:'image/svg+xml;charset=utf-8'})),im=new Image();try{im.src=url;await im.decode();const c=document.createElement('canvas');c.width=1680;c.height=960;c.getContext('2d').drawImage(im,0,0);return c.toDataURL('image/png').split(',')[1]}finally{URL.revokeObjectURL(url)}}
function seekTo(t){playing=false;last=null;renderFrame(t)}function playerState(){return {current,playing,speed,model:M.stateAt(current)}}
function tick(now){if(playing){if(last!==null)current=Math.min(M.DURATION,current+(now-last)/1000*speed);if(current>=M.DURATION)playing=false;renderFrame(current)}last=playing?now:null;requestAnimationFrame(tick)}
$('play').addEventListener('click',()=>{if(current===M.DURATION)current=0;playing=!playing;last=null;renderFrame(current)});$('replay').addEventListener('click',()=>{current=0;playing=true;last=null;renderFrame(current)});$('seek').addEventListener('input',e=>seekTo(Number(e.target.value)/100));$('speed').addEventListener('change',e=>{speed=Number(e.target.value);last=null});const ready=document.fonts.ready.then(()=>{playing=!renderMode&&!matchMedia('(prefers-reduced-motion: reduce)').matches;renderFrame(0);requestAnimationFrame(tick)});
