"8" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#63767b" /></marker></defs><style>text{font-family:"Noto Sans CJK SC","Microsoft YaHei",sans-serif}*{box-sizing:border-box}</style><rect width="1680" height="1080" fill="#fafbf9" id="el-3" data-at="-1" /><text x="80" y="42" font-size="17" fill="#137765" text-anchor="start" font-weight="400" id="el-4" data-at="-1">第三部分 · Transformer 内部计算 / 动画 05 / 11</text><text x="80" y="100" font-size="38" fill="#20313b" text-anchor="start" font-weight="650" id="el-5" data-at="-1">Q、K、V：匹配与内容为什么分开？</text><text x="80" y="148" font-size="24" fill="#63767b" text-anchor="start" font-weight="400" id="el-6" data-at="-1">不是把词分成三类，而是同一份当前表示经过三组不同的可学习投影。</text><line x1="80" y1="177" x2="1600" y2="177" stroke="#d3dfd6" stroke-width="2" id="el-7" data-at="-1" /><rect x="80" y="285" width="380" height="445" rx="10" fill="#edf5ef" stroke="#d3dfd6" stroke-width="1.8" id="el-8" data-at="-1" /><text x="270" y="448.5" font-size="28" fill="#20313b" text-anchor="middle" font-weight="650" id="el-9" data-at="-1">同一层当前表示 H</text><text x="270" y="482.5" font-size="28" fill="#20313b" text-anchor="middle" font-weight="400" id="el-10" data-at="-1">这  [1, 0]</text><text x="270" y="516.5" font-size="28" fill="#20313b" text-anchor="middle" font-weight="400" id="el-11" data-at="-1">朵  [0, 1]</text><text x="270" y="550.5" font-size="28" fill="#20313b" text-anchor="middle" font-weight="400" id="el-12" data-at="-1">花  [1, 1]  ← 目标</text><text x="270" y="584.5" font-size="28" fill="#20313b" text-anchor="middle" font-weight="400" id="el-13" data-at="-1">开  [2, 1]</text><path d="M460 508 L520 508 L520 315 L580 315" fill="none" stroke="#137765" stroke-width="3" marker-end="url(#ag)" id="el-14" data-at="2" opacity="0" /><text x="600" y="237" font-size="27" fill="#137765" text-anchor="start" font-weight="650" id="el-15" data-at="2" opacity="0">Q · 用什么去匹配？</text><rect x="590" y="255" width="420" height="130" rx="10" fill="white" stroke="#d3dfd6" stroke-width="1.8" id="el-16" data-at="2" opacity="0" /><text x="800" y="312" font-size="24" fill="#20313b" text-anchor="middle" font-weight="650" id="el-17" data-at="2" opacity="0">Q = H WQ</text><text x="800" y="346" font-size="24" fill="#20313b" text-anchor="middle" font-weight="400" id="el-18" data-at="2" opacity="0">WQ = [[1, 0], [0, 1]]</text><path d="M1010 320 L1100 320" fill="none" stroke="#137765" stroke-width="3" marker-end="url(#ag)" id="el-19" data-at="3" opacity="0" /><rect x="1110" y="255" width="490" height="130" rx="10" fill="#edf5ef" stroke="#d3dfd6" stroke-width="1.8" id="el-20" data-at="4" opacity="0" /><text x="1355" y="312" font-size="24" fill="#20313b" text-anchor="middle" font-weight="650" id="el-21" data-at="4" opacity="0">第 3 位置的 Q</text><text x="1355" y="346" font-size="24" fill="#20313b" text-anchor="middle" font-weight="400" id="el-22" data-at="4" opacity="0">[1, 1]</text><path d="M460 508 L520 508 L520 525 L580 525" fill="none" stroke="#137765" stroke-width="3" marker-end="url(#ag)" id="el-23" data-at="6" opacity="0" /><text x="600" y="447" font-size="27" fill="#137765" text-anchor="start" font-weight="650" id="el-24" data-at="6" opacity="0">K · 各来源怎样被匹配？</text><rect x="590" y="465" width="420" height="130" rx="10" fill="white" stroke="#d3dfd6" stroke-width="1.8" id="el-25" data-at="6" opacity="0" /><text x="800" y="522" font-size="24" fill="#20313b" text-anchor="middle" font-weight="650" id="el-26" data-at="6" opacity="0">K = H WK</text><text x="800" y="556" font-size="24" fill="#20313b" text-anchor="middle" font-weight="400" id="el-27" data-at="6" opacity="0">WK = [[1, 0], [0, 2]]</text><path d="M1010 530 L1100 530" fill="none" stroke="#137765" stroke-width="3" marker-end="url(#ag)" id="el-28" data-at="7" opacity="0" /><rect x="1110" y="465" width="490" height="130" rx="10" fill="#edf5ef" stroke="#d3dfd6" stroke-width="1.8" id="el-29" data-at="8" opacity="0" /><text x="1355" y="522" font-size="24" fill="#20313b" text-anchor="middle" font-weight="650" id="el-30" data-at="8" opacity="0">各位置的 K</text><text x="1355" y="556" font-size="24" fill="#20313b" text-anchor="middle" font-weight="400" id="el-31" data-at="8" opacity="0">[1,0]  [0,2]  [1,2]  [2,2]</text><path d="M460 508 L520 508 L520 735 L580 735" fill="none" stroke="#326a91" stroke-width="3" marker-end="url(#ab)" id="el-32" data-at="10" opacity="0" /><text x="600" y="657" font-size="27" fill="#326a91" text-anchor="start" font-weight="650" id="el-33" data-at="10" opacity="0">V · 实际汇入什么？</text><rect x="590" y="675" width="420" height="130" rx="10" fill="white" stroke="#d3dfd6" stroke-width="1.8" id="el-34" data-at="10" opacity="0" /><text x="800" y="732" font-size="24" fill="#20313b" text-anchor="middle" font-weight="650" id="el-35" data-at="10" opacity="0">V = H WV</text><text x="800" y="766" font-size="24" fill="#20313b" text-anchor="middle" font-weight="400" id="el-36" data-at="10" opacity="0">WV = [[1, 1], [0, 1]]</text><path d="M1010 740 L1100 740" fill="none" stroke="#326a91" stroke-width="3" marker-end="url(#ab)" id="el-37" data-at="11" opacity="0" /><rect x="1110" y="675" width="490" height="130" rx="10" fill="#edf5ef" stroke="#d3dfd6" stroke-width="1.8" id="el-38" data-at="12" opacity="0" /><text x="1355" y="732" font-size="24" fill="#20313b" text-anchor="middle" font-weight="650" id="el-39" data-at="12" opacity="0">各位置的 V</text><text x="1355" y="766" font-size="24" fill="#20313b" text-anchor="middle" font-weight="400" id="el-40" data-at="12" opacity="0">[1,1]  [0,1]  [1,2]  [2,3]</text><text x="100" y="864" font-size="24" fill="#63767b" text-anchor="start" font-weight="400" id="el-41" data-at="-1">每个位置都有 Q / K / V；计算第 3 位置时取它的 Q，读取允许来源的 K 和 V。</text><rect x="80" y="920" width="1520" height="60" rx="6" fill="#edf5ef" stroke="none" stroke-width="1.8" id="el-42" data-at="-1" /><text x="105" y="959" font-size="26" fill="#137765" text-anchor="start" font-weight="650" id="el-43" data-at="19" opacity="0">Q 与 K 用来形成匹配分数；V 是按权重真正汇集的向量内容。</text><text x="80" y="1014" font-size="18" fill="#63767b" text-anchor="start" font-weight="400" id="el-44" data-at="-1">采用行向量约定：Q=H WQ，K=H WK，V=H WV；所有二维数字与投影均为教学设定。</text><text x="80" y="1044" font-size="18" fill="#63767b" text-anchor="start" font-weight="400" id="el-45" data-at="-1">本图暂不展开位置变换与 softmax；未来位置即使有 K/V，也不代表当前位置可以读取。</text><text id="stage-status" x="80" y="205" font-size="20" fill="#137765" text-anchor="start" data-at="-1" opacity="1" /><text id="match-detail" x="100" y="822" font-size="22" fill="#137765" text-anchor="start" data-at="14" opacity="0" /><text id="gather-detail" x="100" y="899" font-size="22" fill="#326a91" text-anchor="start" data-at="17" opacity="0" /></svg></div><div class="controls" aria-label="播放控制"><button id="play" type="button" aria-pressed="false">播放</button><button id="replay" type="button">重播</button><input id="seek" type="range" min="0" max="22" value="0" step="0.01" aria-label="动画时间"><span id="clock" aria-live="off">0 / 22 秒</span><label>倍速 <select id="speed" aria-label="播放速度"><option value="0.5">0.5×</option><option value="1" selected>1×</option><option value="1.5">1.5×</option><option value="2">2×</option></select></label></div><p class="note">固定参数的教学算例；非真实模型实测。拖动时间可复现完整状态。　单次播放后停止。<noscript>交互需启用 JavaScript；可打开同目录的 GIF 观看完整过程。</noscript></p></main><script>const LessonConfig={"id":"qkv-roles","title":"Q、K、V：匹配与内容为什么分开？","width":1680,"height":1080,"duration":22,"caption":"固定参数的教学算例；非真实模型实测。拖动时间可复现完整状态。","snapshots":[0,4.8,8.8,12.8,15.8,21]};</script><script>const LessonModel=(()=>{
const DURATION=22,STAGES=[[0, "input"], [2, "query"], [6, "keys"], [10, "values"], [14, "match"], [17, "aggregate"], [20, "final"]];
// Approved fixed teaching data, row-vector convention. No network or runtime imports.
const H=[[1,0],[0,1],[1,1],[2,1]],tokens=['这','朵','花','开'];
const WQ=[[1,0],[0,1]],WK=[[1,0],[0,2]],WV=[[1,1],[0,1]],WO=[[1,.5],[-.5,1]];
const dot=(a,b)=>a.reduce((s,x,i)=>s+x*b[i],0);
const mul=(A,B)=>A.map(r=>B[0].map((_,j)=>r.reduce((s,x,k)=>s+x*B[k][j],0)));
const softmax=xs=>{const m=Math.max(...xs),e=xs.map(x=>Math.exp(x-m)),z=e.reduce((a,b)=>a+b,0);return e.map(x=>x/z)};
function mathState(){
 const Q=mul(H,WQ),K=mul(H,WK),V=mul(H,WV),rawDots=K.map(k=>dot(Q[2],k)),scaledScores=rawDots.map(x=>x/Math.sqrt(2));
 const weights=[...softmax(scaledScores.slice(0,3)),0],maskedScores=scaledScores.map((x,i)=>i<3?x:null),exponentials=scaledScores.map((x,i)=>i<3?Math.exp(x):0),denominator=exponentials.reduce((a,b)=>a+b,0);
 const weightedValues=V.map((r,i)=>r.map(x=>x*weights[i])),output=V[0].map((_,j)=>weightedValues.reduce((s,r)=>s+r[j],0));
 const head=(wq,wk,wv)=>{const q=dot(H[2],wq),k=H.slice(0,3).map(h=>dot(h,wk)),v=H.slice(0,3).map(h=>dot(h,wv)),scores=k.map(x=>q*x),weights=softmax(scores);return {wq,wk,wv,q,k,v,scores,weights,output:dot(weights,v),head_dim:1,maskedFutureWeight:0}};
 const heads=[head([1,0],[1,0],[1,0]),head([0,1],[0,2],[1,1])],concat=heads.map(h=>h.output),multiOutput=mul([concat],WO)[0];
 return {real_model:false,tokens:[...tokens],H:H.map(r=>[...r]),WQ,WK,WV,Q,K,V,rawDots,scaledScores,maskedScores,exponentials,denominator,weights,weightedValues,output,heads,concat,WO,multiOutput,target_position:3};
}
function stateAt(t){
 t=Number(t);const time=Number.isFinite(t)?Math.max(0,Math.min(DURATION,t)):0;
 let stageIndex=0;for(let i=0;i<STAGES.length;i++)if(time>=STAGES[i][0])stageIndex=i;
 const [start,stage]=STAGES[stageIndex],end=STAGES[stageIndex+1]?.[0]??DURATION;
 return {time,stage,stageIndex,stageProgress:Math.max(0,Math.min(1,(time-start)/(end-start))),progress:time/DURATION,math:mathState()};
}
return {DURATION,stateAt};})();
if(typeof module!=='undefined')module.exports=LessonModel;
</script><script>// Pure seek rendering: no timers, no retained animation state.
function renderScene(state){
 const t=state.time,m=state.math,clamp=x=>Math.max(0,Math.min(1,x));
 for(const e of document.querySelectorAll('svg [data-at]')){
  const at=Number(e.getAttribute('data-at')),p=clamp((t-at)/0.55);
  opacity(e.id,at<0?1:p);
  if(e.tagName.toLowerCase()==='path'&&e.hasAttribute('marker-end')){
   const length=e.getTotalLength();e.setAttribute('stroke-dasharray',`${length} ${length}`);e.setAttribute('stroke-dashoffset',String(length*(1-clamp((t-at)/1.2))));
  }
 }
 const labels={"input": "先固定同一份 H；三组参数都作用在这份输入上。", "query": "① H × WQ：形成目标位置用于匹配的 q花。", "keys": "② H × WK：各来源产生 K；H 和 Q 都保留。", "values": "③ H × WV：产生内容 V；它不是匹配分数。", "match": "④ q花 与各 K 做点积；因果遮挡仍限制可读取范围。", "aggregate": "⑤ Q/K 形成的权重，真正乘的是 V，而不是 K。", "final": "同一 H → 三组投影；Q/K 决定匹配，V 提供汇入内容。"};
 text('stage-status',labels[state.stage]);
 const f=(x,n=3)=>x.toFixed(n),vec=(xs,n=3)=>'['+xs.map(x=>Number.isInteger(x)?String(x):f(x,n)).join(', ')+']';
 text('match-detail','q花 · K → 点积 '+vec(m.rawDots,0)+'；位置 4 虽得分最高，仍被因果遮挡。');
 text('gather-detail','α = '+vec(m.weights,4)+'；按这些份额汇集 V → o花 = '+vec(m.output)+'.');
 document.querySelector('svg').setAttribute('data-stage',state.stage);
 return {stage:state.stage,maskedFutureWeight:m.weights[3],output:m.output,headDimensions:[2]};
}
</script><script>const svg=document.querySelector('svg'),$=id=>document.getElementById(id);
function text(id,value){const e=$(id);if(!e)throw Error('Missing SVG label '+id);e.textContent=String(value)}
function opacity(id,value){const e=$(id);if(!e)throw Error('Missing SVG group '+id);e.setAttribute('opacity',String(value))}
let currentTime=0,playing=false,rate=1,raf=0,lastTick=0;
function boundedTime(t){t=Number(t);return Number.isFinite(t)?Math.max(0,Math.min(LessonModel.DURATION,t)):0}
function renderFrame(t){currentTime=boundedTime(t);const state=LessonModel.stateAt(currentTime),scene=renderScene(state);$('seek').value=currentTime;$('clock').textContent=currentTime.toFixed(1)+' / '+LessonModel.DURATION+' 秒';window.frameDiagnostics={time:currentTime,model:state,scene};return window.frameDiagnostics}
function updateControls(){$('play').textContent=playing?'暂停':'播放';$('play').setAttribute('aria-pressed',String(playing))}
function pause(){playing=false;cancelAnimationFrame(raf);updateControls()}
function tick(now){if(!playing)return;const elapsed=Math.max(0,(now-lastTick)/1000);lastTick=now;renderFrame(currentTime+elapsed*rate);if(currentTime>=LessonModel.DURATION){pause();return}raf=requestAnimationFrame(tick)}
function play(){if(currentTime>=LessonModel.DURATION)renderFrame(0);if(playing)return;playing=true;lastTick=performance.now();updateControls();raf=requestAnimationFrame(tick)}
function seekTo(t){pause();return renderFrame(t)}
function playerState(){return {playing,current:currentTime,speed:rate,duration:LessonModel.DURATION,stage:window.frameDiagnostics?.model?.stage}}
function visibleTextBounds(){const r=svg.getBoundingClientRect();return [...svg.querySelectorAll('text')].filter(e=>{for(let n=e;n&&n!==svg.parentNode;n=n.parentElement){const c=getComputedStyle(n);if(c.display==='none'||c.visibility==='hidden'||Number(c.opacity)===0)return false}return !!e.textContent.trim()}).map(e=>{const b=e.getBBox(),m=e.getScreenCTM(),a=new DOMPoint(b.x,b.y).matrixTransform(m),z=new DOMPoint(b.x+b.width,b.y+b.height).matrixTransform(m);return {id:e.id,text:e.textContent,x:a.x-r.x,y:a.y-r.y,width:z.x-a.x,height:z.y-a.y,inside:a.x>=r.x-1&&a.y>=r.y-1&&z.x<=r.right+1&&z.y<=r.bottom+1}})}
async function exportPNG(t){pause();renderFrame(t);await document.fonts.ready;const clone=svg.cloneNode(true);clone.setAttribute('xmlns','http://www.w3.org/2000/svg');clone.setAttribute('width',String(LessonConfig.width));clone.setAttribute('height',String(LessonConfig.height));const xml=new XMLSerializer().serializeToString(clone),url=URL.createObjectURL(new Blob([xml],{type:'image/svg+xml;charset=utf-8'}));try{const image=new Image();await new Promise((resolve,reject)=>{image.onload=resolve;image.onerror=reject;image.src=url});const canvas=document.createElement('canvas');canvas.width=LessonConfig.width;canvas.height=LessonConfig.height;const ctx=canvas.getContext('2d');ctx.fillStyle='#fafbf9';ctx.fillRect(0,0,canvas.width,canvas.height);ctx.drawImage(image,0,0,canvas.width,canvas.height);return canvas.toDataURL('image/png')}finally{URL.revokeObjectURL(url)}}
$('play').onclick=()=>playing?pause():play();$('replay').onclick=()=>{pause();renderFrame(0);play()};$('seek').addEventListener('input',e=>seekTo(e.target.value));$('speed').onchange=e=>{rate=Number(e.target.value)};svg.addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();playing?pause():play()}if(e.code==='ArrowRight'){e.preventDefault();seekTo(currentTime+1)}if(e.code==='ArrowLeft'){e.preventDefault();seekTo(currentTime-1)}});document.addEventListener('visibilitychange',()=>{if(document.hidden)pause()});
const ready=(async()=>{await document.fonts.ready;renderFrame(0);updateControls();if(!new URLSearchParams(location.search).has('render')&&!matchMedia('(prefers-reduced-motion: reduce)').matches)play();return true})();
window.ready=ready;window.renderFrame=renderFrame;window.exportPNG=exportPNG;window.seekTo=seekTo;window.playerState=playerState;window.visibleTextBounds=visibleTextBounds;
</script></body></html>
