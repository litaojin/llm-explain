<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>归一化：调节表示尺度，不是生成概率 · LLM Explain</title><style>*{box-sizing:border-box}body{margin:0;background:#fafbf9;color:#20313b;font-family:"Noto Sans CJK SC","Microsoft YaHei",sans-serif}main{max-width:1680px;margin:auto}.canvas{width:100%;overflow:auto}svg{display:block;width:100%;height:auto;min-width:720px}button,select{font:inherit;min-height:44px;padding:8px 15px;border:1px solid #d5dfd7;border-radius:6px;background:#fff;color:#137765;cursor:pointer}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #326a91;outline-offset:3px}.controls{display:flex;align-items:center;flex-wrap:wrap;gap:12px;padding:12px 20px;border-top:1px solid #d5dfd7}#seek{flex:1;min-width:140px;min-height:44px;accent-color:#137765}.note{padding:0 20px;margin:5px 0 18px;color:#596b72;font-size:13px;line-height:1.7}.scroll-hint{display:none}@media(max-width:720px){.scroll-hint{display:block;padding:10px 20px;margin:0;font-size:13px;color:#596b72}.controls{gap:8px}.controls label{display:inline-flex;align-items:center;gap:5px;min-height:44px}#seek{flex-basis:100%}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto}}</style></head><body><main><p class="scroll-hint">小屏可左右滑动图解；下方控件可暂停、拖动与倍速回看。</p><div class="canvas" aria-label="归一化：调节表示尺度，不是生成概率"><svg xmlns="http://www.w3.org/2000/svg" width="1680" height="1080" viewBox="0 0 1680 1080" role="img" aria-labelledby="title"><title id="title">归一化：调节表示尺度，不是生成概率</title><defs><marker id="ag" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#137765" /></marker><marker id="ab" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#326a91" /></marker><marker id="am" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#63767b" /></marker></defs><style>text{font-family:"Noto Sans CJK SC","Microsoft YaHei",sans-serif}*{box-sizing:border-box}</style><rect width="1680" height="1080" fill="#fafbf9" /><text x="80" y="42" font-size="17" fill="#137765" text-anchor="start" font-weight="400" id="e-4">第三部分 · Transformer 内部计算 / 动画 10 / 11</text><text x="80" y="100" font-size="38" fill="#20313b" text-anchor="start" font-weight="650" id="e-5">归一化：调节表示尺度，不是生成概率</text><text x="80" y="148" font-size="24" fill="#63767b" text-anchor="start" font-weight="400" id="e-6">这里明确选择 RMSNorm：在同一个位置的特征维度上计算，不跨 token 做平均。</text><line x1="80" y1="177" x2="1600" y2="177" stroke="#d3dfd6" stroke-width="2" id="e-7" /><rect x="100" y="275" width="350" height="180" rx="10" fill="#edf5ef" stroke="#d3dfd6" stroke-width="1.8" id="e-8" /><text x="275" y="357" font-size="28" fill="#20313b" text-anchor="middle" font-weight="650" id="e-9">一个位置的特征向量</text><text x="275" y="391" font-size="28" fill="#20313b" text-anchor="middle" font-weight="400" id="e-10">x = [1.5, 1]</text><path d="M450 365 L540 365" fill="none" stroke="#137765" stroke-width="3" marker-end="url(#ag)" id="route-rms" data-reveal="squares" opacity="0" data-from="input-features" data-to="rms" /><rect x="550" y="245" width="570" height="240" rx="10" fill="white" stroke="#d3dfd6" stroke-width="1.8" id="e-12" data-reveal="squares" opacity="0" /><text x="835" y="340" font-size="28" fill="#20313b" text-anchor="middle" font-weight="650" id="e-13" data-reveal="squares" opacity="0">先计算均方根</text><text x="835" y="374" font-size="28" fill="#20313b" text-anchor="middle" font-weight="400" id="e-14" data-reveal="squares" opacity="0">r = √((1.5²+1²)/2 + ε)</text><text x="835" y="408" font-size="28" fill="#20313b" text-anchor="middle" font-weight="400" id="e-15" data-reveal="root" opacity="0">r ≈ 1.274755</text><path d="M1120 365 L1210 365" fill="none" stroke="#137765" stroke-width="3" marker-end="url(#ag)" id="route-scale" data-reveal="scale" opacity="0" data-from="rms" data-to="normalized-features" /><rect x="1220" y="265" width="380" height="200" rx="10" fill="#edf5ef" stroke="#d3dfd6" stroke-width="1.8" id="e-17" data-reveal="scale" opacity="0" /><text x="1410" y="357" font-size="26" fill="#137765" text-anchor="middle" font-weight="650" id="e-18" data-reveal="scale" opacity="0">各分量除以 r</text><text x="1410" y="391" font-size="26" fill="#137765" text-anchor="middle" font-weight="400" id="e-19" data-reveal="scale" opacity="0">y ≈ [1.1767, 0.7845]</text><text x="100" y="575" font-size="33" fill="#137765" text-anchor="start" font-weight="650" id="e-20" data-reveal="scale" opacity="0">RMSNorm： yj = (xj / r) × γj</text><text x="100" y="627" font-size="26" fill="#63767b" text-anchor="start" font-weight="400" id="e-21" data-reveal="squares" opacity="0">本例 γ = [1, 1]；ε = 0.000001，避免零输入除以零。</text><rect x="100" y="690" width="1500" height="165" rx="10" fill="white" stroke="#d3dfd6" stroke-width="1.8" id="e-22" data-reveal="compare" opacity="0" /><text x="130" y="735" font-size="28" fill="#20313b" text-anchor="start" font-weight="650" id="e-23" data-reveal="compare" opacity="0">不要与 softmax 混淆</text><text x="130" y="785" font-size="26" fill="#137765" text-anchor="start" font-weight="400" id="e-24" data-reveal="compare" opacity="0">RMSNorm 输出的分量和 ≈ 1.9612，不要求等于 1。</text><text x="130" y="828" font-size="24" fill="#63767b" text-anchor="start" font-weight="400" id="e-25" data-reveal="compare" opacity="0">同一输入若做 softmax，才得到 [0.6225, 0.3775]，两项之和为 1。</text><rect x="80" y="920" width="1520" height="60" rx="6" fill="#edf5ef" stroke="none" stroke-width="1.8" id="e-26" data-reveal="final" opacity="0" /><text x="105" y="959" font-size="26" fill="#137765" text-anchor="start" font-weight="650" id="e-27" data-reveal="final" opacity="0">RMSNorm 不要求均值为 0，也不把向量变成概率分布。</text><text x="80" y="1014" font-size="18" fill="#63767b" text-anchor="start" font-weight="400" id="e-28">γ 是可学习缩放参数，本例固定为 1；ε 用于数值稳定。输出的均方值近似 1，不宣称精确等于 1。</text><text x="80" y="1044" font-size="18" fill="#63767b" text-anchor="start" font-weight="400" id="e-29">归一化种类与放置位置依模型而异；第 11 图选择 Pre-RMSNorm，而不是代表所有 Transformer。</text><text id="stage-status" x="80" y="204" font-size="19" fill="#137765">只看一个位置的特征向量 [1.5, 1]；不跨 token。</text><circle id="signal-0" r="7" fill="#137765" stroke="#fafbf9" stroke-width="2" opacity="0" data-signal="route-rms" cx="0" cy="0" /><circle id="signal-1" r="7" fill="#137765" stroke="#fafbf9" stroke-width="2" opacity="0" data-signal="route-scale" cx="0" cy="0" /></svg></div><div class="controls" aria-label="播放控制"><button id="play" type="button" aria-pressed="false">播放</button><button id="replay" type="button">重播</button><input id="seek" type="range" min="0" max="22" value="0" step="0.01" aria-label="动画时间"><span id="clock" aria-live="off">0 / 22 秒</span><label>倍速 <select id="speed" aria-label="播放速度"><option value="0.5">0.5×</option><option value="1" selected>1×</option><option value="1.5">1.5×</option><option value="2">2×</option></select></label></div><p class="note">固定教学参数与示意数据；路径信号只解释数据流，不代表真实张量执行时间。可暂停、拖动与重播。　单次播放后停止。<noscript>交互需启用 JavaScript；可打开同目录的 GIF 观看完整过程。</noscript></p></main><script>const LessonConfig={"id":"rms-normalization","title":"归一化：调节表示尺度，不是生成概率","width":1680,"height":1080,"duration":22,"caption":"固定教学参数与示意数据；路径信号只解释数据流，不代表真实张量执行时间。可暂停、拖动与重播。","snapshots":[0,4,8,12,16,22]};</script><script>(function(root,factory){if(typeof module==='object'&&module.exports)module.exports=factory();else root.LessonModel=factory();})(typeof window!=='undefined'?window:globalThis,function(){
'use strict';
const DURATION=22;

MLP(RMSNorm(u))"]}};

const STEPS=[[0, "input", "只看一个位置的特征向量 [1.5, 1]；不跨 token。"], [3, "squares", "沿特征维度平方并取平均：(2.25+1)/2 = 1.625。"], [7, "root", "加 ε 后开方，r = √1.625001 ≈ 1.274755。"], [11, "scale", "每个特征除以同一个 r，再乘对应 γ；本例 γ 都为 1。"], [15, "compare", "对照 softmax：RMSNorm 不要求分量和为 1，也不做均值中心化。"], [19, "final", "完成：按位置调节特征尺度，不是输出概率。"]];

</script><script>function renderScene(state){

 text('e-10','x = '+vector(state.math.input));text('e-15','r ≈ '+state.math.rms.toFixed(6));text('e-19','y ≈ '+vector(state.math.output.map(v=>Number(v.toFixed(4)))));text('e-24','RMSNorm 输出的分量和 ≈ '+state.math.sum.toFixed(4)+'，不要求等于 1。');

</script><script>const svg=document.querySelector('svg'),$=id=>document.getElementById(id);

function visibleTextBounds(){const r=svg.getBoundingClientRect();return [...svg.querySelectorAll('text')].filter(e=>{for(let n=e;n&&n!==svg.parentNode;n=n.parentElement){const c=getComputedStyle(n);if(c.display==='none'||c.visibility==='hidden'||Number(c.opacity)===0)return false}return !!e.textContent.trim()}).map(e=>{const b=e.getBBox(),m=e.getScreenCTM(),a=new DOMPoint(b.x,b.y).matrixTransform(m),z=new DOMPoint(b.x+b.width,b.y+b.height).matrixTransform(m);return {id:e.id,text:e.textContent,x:a.x-r.x,y:a.y-r.y,width:z.x-a.x,height:z.y-a.y,inside:a.x>=r.x-1&&a.y>=r.y-1&&z.x<=r.right+1&&z.y<=r.bottom+1}})}
async function exportPNG(t){pause();renderFrame(t);await document.fonts.ready;const clone=svg.cloneNode(true);clone.setAttribute('xmlns','http://www.w3.org/2000/svg');clone.setAttribute('width',String(LessonConfig.width));clone.setAttribute('height',String(LessonConfig.height));const xml=new XMLSerializer().serializeToString(clone),url=URL.createObjectURL(new Blob([xml],{type:'image/svg+xml;charset=utf-8'}));try{const image=new Image();await new Promise((resolve,reject)=>{image.onload=resolve;image.onerror=reject;image.src=url});const canvas=document.createElement('canvas');canvas.width=LessonConfig.width;canvas.height=LessonConfig.height;const ctx=canvas.getContext('2d');ctx.fillStyle='#fafbf9';ctx.fillRect(0,0,canvas.width,canvas.height);ctx.drawImage(image,0,0,canvas.width,canvas.height);return canvas.toDataURL('image/png')}finally{URL.revokeObjectURL(url)}}
$('play').onclick=()=>playing?pause():play();$('replay').onclick=()=>{pause();renderFrame(0);play()};$('seek').addEventListener('input',e=>seekTo(e.target.value));$('speed').onchange=e=>{rate=Number(e.target.value)};svg.addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();playing?pause():play()}if(e.code==='ArrowRight'){e.preventDefault();seekTo(currentTime+1)}if(e.code==='ArrowLeft'){e.preventDefault();seekTo(currentTime-1)}});document.addEventListener('visibilitychange',()=>{if(document.hidden)pause()});
