><marker id="am" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#63767b" /></marker></defs><style id="e2">text{font-family:"Noto Sans CJK SC","Microsoft YaHei",sans-serif}*{box-sizing:border-box}</style><rect width="1680" height="1080" fill="#fafbf9" id="e3" /><text x="80" y="42" font-size="17" fill="#137765" text-anchor="start" font-weight="400" id="e4">第三部分 · Transformer 内部计算 / 动画 02 / 11</text><text x="80" y="100" font-size="38" fill="#20313b" text-anchor="start" font-weight="650" id="e5">Attention 在做什么？匹配，再按份额汇集</text><text x="80" y="148" font-size="24" fill="#63767b" text-anchor="start" font-weight="400" id="e6">沿用“盛开的花”：先看完整机制，不急着引入投影矩阵与计算公式。</text><line x1="80" y1="177" x2="1600" y2="177" stroke="#d3dfd6" stroke-width="2" id="e7" /><rect x="100" y="230" width="400" height="110" rx="10" fill="#edf5ef" stroke="#d3dfd6" stroke-width="1.8" id="e8" opacity="0" /><text x="300" y="277" font-size="25" fill="#20313b" text-anchor="middle" font-weight="650" id="e9" opacity="0">① 取当前位置的表示</text><text x="300" y="311" font-size="25" fill="#20313b" text-anchor="middle" font-weight="400" id="e10" opacity="0">本例：输入末尾的“花”</text><path d="M500 285 L590 285" fill="none" stroke="#326a91" stroke-width="3" marker-end="url(#ab)" id="e11" opacity="0" /><rect x="600" y="230" width="450" height="110" rx="10" fill="white" stroke="#d3dfd6" stroke-width="1.8" id="e12" opacity="0" /><text x="825" y="277" font-size="25" fill="#20313b" text-anchor="middle" font-weight="650" id="e13" opacity="0">② 与各位置表示匹配</text><text x="825" y="311" font-size="25" fill="#20313b" text-anchor="middle" font-weight="400" id="e14" opacity="0">决定不同来源的相关程度</text><path d="M1050 285 L1140 285" fill="none" stroke="#326a91" stroke-width="3" marker-end="url(#ab)" id="e15" opacity="0" /><rect x="1150" y="230" width="450" height="110" rx="10" fill="white" stroke="#d3dfd6" stroke-width="1.8" id="e16" opacity="0" /><text x="1375" y="277" font-size="25" fill="#20313b" text-anchor="middle" font-weight="650" id="e17" opacity="0">③ 得到各来源的汇入份额</text><text x="1375" y="311" font-size="25" fill="#20313b" text-anchor="middle" font-weight="400" id="e18" opacity="0">不是对每个位置取同样多</text><text x="100" y="409" font-size="28" fill="#137765" text-anchor="start" font-weight="650" id="e19" opacity="0">④ 按份额汇集各位置的向量内容（本例包含当前位置自身）</text><rect x="100" y="445" width="260" height="110" rx="10" fill="#edf5ef" stroke="#d3dfd6" stroke-width="1.8" id="e20" opacity="0" /><text x="230" y="492" font-size="27" fill="#20313b" text-anchor="middle" font-weight="650" id="e21" opacity="0">盛</text><text x="230" y="526" font-size="27" fill="#20313b" text-anchor="middle" font-weight="400" id="e22" opacity="0">此前位置的内容</text><path d="M230 555 C230 650 680 650 680 735" fill="none" stroke="#137765" stroke-width="6" marker-end="url(#ag)" id="e23" opacity="0" /><rect x="480" y="445" width="260" height="110" rx="10" fill="#edf5ef" stroke="#d3dfd6" stroke-width="1.8" id="e24" opacity="0" /><text x="610" y="492" font-size="27" fill="#20313b" text-anchor="middle" font-weight="650" id="e25" opacity="0">开</text><text x="610" y="526" font-size="27" fill="#20313b" text-anchor="middle" font-weight="400" id="e26" opacity="0">此前位置的内容</text><path d="M610 555 C610 650 790 650 790 735" fill="none" stroke="#137765" stroke-width="5" marker-end="url(#ag)" id="e27" opacity="0" /><rect x="860" y="445" width="260" height="110" rx="10" fill="#edf5ef" stroke="#d3dfd6" stroke-width="1.8" id="e28" opacity="0" /><text x="990" y="492" font-size="27" fill="#20313b" text-anchor="middle" font-weight="650" id="e29" opacity="0">的</text><text x="990" y="526" font-size="27" fill="#20313b" text-anchor="middle" font-weight="400" id="e30" opacity="0">此前位置的内容</text><path d="M990 555 C990 650 900 650 900 735" fill="none" stroke="#137765" stroke-width="2" marker-end="url(#ag)" id="e31" opacity="0" /><rect x="1240" y="445" width="260" height="110" rx="10" fill="#edf5ef" stroke="#d3dfd6" stroke-width="1.8" id="e32" opacity="0" /><text x="1370" y="492" font-size="27" fill="#20313b" text-anchor="middle" font-weight="650" id="e33" opacity="0">花</text><text x="1370" y="526" font-size="27" fill="#20313b" text-anchor="middle" font-weight="400" id="e34" opacity="0">当前位置的内容</text><path d="M1370 555 C1370 650 1010 650 1010 735" fill="none" stroke="#137765" stroke-width="3" marker-end="url(#ag)" id="e35" opacity="0" /><rect x="560" y="745" width="600" height="105" rx="10" fill="#edf5ef" stroke="#d3dfd6" stroke-width="1.8" id="e36" opacity="0" /><text x="860" y="789.5" font-size="27" fill="#137765" text-anchor="middle" font-weight="650" id="e37" opacity="0">⑤ 得到加权汇集的向量内容</text><text x="860" y="823.5" font-size="27" fill="#137765" text-anchor="middle" font-weight="400" id="e38" opacity="0">参与后续的表示计算</text><text x="100" y="890" font-size="25" fill="#63767b" text-anchor="start" font-weight="400" id="e39" opacity="0">线的粗细只示意份额不同；字符留在原位，汇集的是向量信息。</text><rect x="80" y="920" width="1520" height="60" rx="6" fill="#edf5ef" stroke="none" stroke-width="1.8" id="e40" opacity="0" /><text x="105" y="959" font-size="26" fill="#137765" text-anchor="start" font-weight="650" id="e41" opacity="0">Attention 根据匹配结果，按不同份额汇集向量内容；它不是直接选择下一个词。</text><text x="80" y="1014" font-size="18" fill="#63767b" text-anchor="start" font-weight="400" id="e42" opacity="1">所有连线粗细均为人工教学示意，不是实测注意力，也不代表词有固定的重要性或人类语义标签。</text><text x="80" y="1044" font-size="18" fill="#63767b" text-anchor="start" font-weight="400" id="e43" opacity="1">各来源内容保持原位；匹配、份额计算与可见范围将在后续课程展开。汇集结果不等于模型最终表示。</text><circle id="signal23" r="8" fill="#137765" stroke="#fafbf9" stroke-width="2" opacity="0" data-source-path="e23" data-kind="vector-information" /><circle id="signal27" r="8" fill="#137765" stroke="#fafbf9" stroke-width="2" opacity="0" data-source-path="e27" data-kind="vector-information" /><circle id="signal31" r="8" fill="#137765" stroke="#fafbf9" stroke-width="2" opacity="0" data-source-path="e31" data-kind="vector-information" /><circle id="signal35" r="8" fill="#137765" stroke="#fafbf9" stroke-width="2" opacity="0" data-source-path="e35" data-kind="vector-information" /></svg></div><div class="controls" aria-label="播放控制"><button id="play" type="button" aria-pressed="false">播放</button><button id="replay" type="button">重播</button><input id="seek" type="range" min="0" max="20" value="0" step="0.01" aria-label="动画时间"><span id="clock" aria-live="off">0 / 20 秒</span><label>倍速 <select id="speed" aria-label="播放速度"><option value="0.5">0.5×</option><option value="1" selected>1×</option><option value="1.5">1.5×</option><option value="2">2×</option></select></label></div><p class="note">人工教学示意；信号沿来源→目标传递，字符与参数不移动。分步显露仅为教学节奏，并非真实张量执行调度。　单次播放后停止。<noscript>交互需启用 JavaScript；可打开同目录的 GIF 观看完整过程。</noscript></p></main><script>const LessonConfig={"id":"attention-mechanism-intro","title":"Attention 在做什么？匹配，再按份额汇集","width":1680,"height":1080,"duration":20,"caption":"人工教学示意；信号沿来源→目标传递，字符与参数不移动。分步显露仅为教学节奏，并非真实张量执行调度。","snapshots":[2,5,8,12,18]};</script><script>const DURATION=20;
const clamp=x=>Math.max(0,Math.min(1,x));
const bound=t=>Number.isFinite(Number(t))?Math.max(0,Math.min(DURATION,Number(t))):0;
const times={"e8": 0, "e9": 0, "e10": 0, "e11": 4, "e12": 4, "e13": 4, "e14": 4, "e15": 7, "e16": 7, "e17": 7, "e18": 7, "e19": 9, "e20": 1, "e21": 1, "e22": 1, "e23": 9, "e24": 1, "e25": 1, "e26": 1, "e27": 9, "e28": 1, "e29": 1, "e30": 1, "e31": 9, "e32": 1, "e33": 1, "e34": 1, "e35": 9, "e36": 9, "e37": 14, "e38": 14, "e39": 14, "e40": 16, "e41": 16, "e42": -1, "e43": -1};
function stateAt(input){const time=bound(input),reveals={};for(const [id,start] of Object.entries(times))reveals[id]=clamp((time-start)/.7);
stage=time<4?'target':time<7?'matching':time<10?'proportions':time<14?'gathering':'result';const extra={signalProgress:clamp((time-10)/4),signalsVisible:time>=10&&time<14,sourceTokens:['盛','开','的','花'],includesSelf:true,resultVisible:time>=14.7};
return {time,progress:time/DURATION,stage:time>=DURATION-2?'hold':stage,reveals,...extra};}
const LessonModel={DURATION,stateAt};if(typeof module!=='undefined'&&module.exports)module.exports=LessonModel;
</script><script>function renderScene(s){
 for(const [id,value] of Object.entries(s.reveals))opacity(id,value);
 for(const i of [23,27,31,35])moveSignal('e'+i,'signal'+i,s.signalProgress,s.signalsVisible);
 return {stage:s.stage,progress:s.progress};
}
function moveSignal(pathId,signalId,p,visible){const path=$(pathId),point=path.getPointAtLength(path.getTotalLength()*Math.max(0,Math.min(1,p))),signal=$(signalId);signal.setAttribute('cx',point.x);signal.setAttribute('cy',point.y);opacity(signalId,visible?1:0);}
</script><script>const svg=document.querySelector('svg'),$=id=>document.getElementById(id);
function text(id,value){const e=$(id);if(!e)throw Error('Missing SVG label '+id);e.textContent=String(value)}
function opacity(id,value){const e=$(id);if(!e)throw Error('Missing SVG group '+id);e.setAttribute('opacity',String(value))}
let currentTime=0,playing=false,rate=1,raf=0,lastTick=0;
function boundedTime(t){t=Number(t);return Number.isFinite(t)?Math.max(0,Math.min(LessonModel.DURATION,t)):0}
function renderFrame(t){currentTime=boundedTime(t);const state=LessonModel.stateAt(currentTime),scene=renderScene(state);$('seek').value=currentTime;$('clock').textContent=currentTime.toFixed(1)+' / '+LessonModel.DURATION+' 秒';window.frameDiagnostics={time:currentTime,model:state,scene};return window.frameDiagnostics}
function updateControls(){$('play').textContent=playing?'暂停':'播放';$('play').setAttribute('aria-pressed',String(playing))}
function pause(){playing=false;cancelAnimationFrame(raf);updateControls()}
function tick(now){if(!playing)return;const elapsed=Math.max(0,(now-lastTick)/1000);lastTick=now;renderFrame(currentTime+elapsed*rate);if(currentTime>=LessonModel.DURATION){pause();return}raf=requestAnimationFrame(tick)}
function play(){if(currentTime>=LessonModel.DURATION)renderFrame(0);if(playing)return;playing=true;lastTick=performance.now();updateControls();raf=requestAnimationFrame(tick)}
function seekTo(t){pause();return renderFrame(t)}
function playerState(){return {playing,current:currentTime,speed:rate,duration:LessonModel.DURATION,stage:window.frameDiagnostics?.model?.stage}}
function visibleTextBounds(){const r=svg.getBoundingClientRect();return [...svg.querySelectorAll('text')].filter(e=>{for(let n=e;n&&n!==svg.parentNode;n=n.parentElement){const c=getComputedStyle(n);if(c.display==='none'||c.visibility==='hidden'||Number(c.opacity)===0)return false}return !!e.textContent.trim()}).map(e=>{const b=e.getBBox(),m=e.getScreenCTM(),a=new DOMPoint(b.x,b.y).matrixTransform(m),z=new DOMPoint(b.x+b.width,b.y+b.height).matrixTransform(m);return {id:e.id,text:e.textContent,x:a.x-r.x,y:a.y-r.y,width:z.x-a.x,height:z.y-a.y,inside:a.x>=r.x-1&&a.y>=r.y-1&&z.x<=r.right+1&&z.y<=r.bottom+1}})}
async function exportPNG(t){pause();renderFrame(t);await document.fonts.ready;const clone=svg.cloneNode(true);clone.setAttribute('xmlns','http://www.w3.org/2000/svg');clone.setAttribute('width',String(LessonConfig.width));clone.setAttribute('height',String(LessonConfig.height));const xml=new XMLSerializer().serializeToString(clone),url=URL.createObjectURL(new Blob([xml],{type:'image/svg+xml;charset=utf-8'}));try{const image=new Image();await new Promise((resolve,reject)=>{image.onload=resolve;image.onerror=reject;image.src=url});const canvas=document.createElement('canvas');canvas.width=LessonConfig.width;canvas.height=LessonConfig.height;const ctx=canvas.getContext('2d');ctx.fillStyle='#fafbf9';ctx.fillRect(0,0,canvas.width,canvas.height);ctx.drawImage(image,0,0,canvas.width,canvas.height);return canvas.toDataURL('image/png')}finally{URL.revokeObjectURL(url)}}
$('play').onclick=()=>playing?pause():play();$('replay').onclick=()=>{pause();renderFrame(0);play()};$('seek').addEventListener('input',e=>seekTo(e.target.value));$('speed').onchange=e=>{rate=Number(e.target.value)};svg.addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();playing?pause():play()}if(e.code==='ArrowRight'){e.preventDefault();seekTo(currentTime+1)}if(e.code==='ArrowLeft'){e.preventDefault();seekTo(currentTime-1)}});document.addEventListener('visibilitychange',()=>{if(document.hidden)pause()});
const ready=(async()=>{await document.fonts.ready;renderFrame(0);updateControls();if(!new URLSearchParams(location.search).has('render')&&!matchMedia('(prefers-reduced-motion: reduce)').matches)play();return true})();
window.ready=ready;window.renderFrame=renderFrame;window.exportPNG=exportPNG;window.seekTo=seekTo;window.playerState=playerState;window.visibleTextBounds=visibleTextBounds;
</script></body></html>
