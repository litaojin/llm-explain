<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Attention：按权重汇集信息</title><style>*{box-sizing:border-box}body{margin:0;background:#fafbf9;color:#20313b;font-family:"Noto Sans CJK SC","Microsoft YaHei",sans-serif}main{max-width:1440px;margin:12px auto 0}svg{display:block;width:100%;height:auto}nav{display:flex;gap:12px;align-items:center;flex-wrap:wrap;max-width:1050px;margin:8px auto;padding:0 22px}button,select{min-height:44px;border:1px solid #b7c9c0;background:white;border-radius:8px;padding:8px 14px;font:inherit;cursor:pointer;color:#175d50}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #137765;outline-offset:3px}#play{background:#137765;color:white;border-color:#137765;min-width:105px}input{flex:1;min-width:140px;height:44px;accent-color:#137765}#clock{min-width:80px;font:16px monospace}p{font-size:14px;color:#64737c;text-align:center;padding:0 16px}body.render main{margin:0;max-width:none}body.render nav,body.render p{display:none}</style></head><body><main><svg xmlns="http://www.w3.org/2000/svg" width="1440" height="820" viewBox="0 0 1440 820" role="img" aria-labelledby="title desc">
<title id="title">Attention：当前 token 按权重汇集上下文信息</title>
<desc id="desc">两行对照盛开的花与这钱随便花。末尾的花位于相同视觉位置，从已经出现的左侧上下文汇集向量信息；较粗的开与钱连线仅为教学构图，不是模型实测权重。汇集的信息参与更新花的表示，分别示意花朵与花费用法。箭头表示信息汇入方向，不是查询发出方向。为简化省略自身连接和 Transformer 的其余计算。</desc>

<text x="100" y="718" font-size="24" style="fill:#137765">Attention 按权重汇集信息，参与形成当前 token 的上下文表示。</text>
<text x="100" y="765" class="note" font-size="16">传递的是向量信息，不是字符；线宽是人为示意，不是模型实测权重，也不等同于词的固定重要性。</text>
<text x="100" y="795" class="note" font-size="16">只画“花”可见的左侧上下文；自身连接、Q/K/V 与其余层省略。Attention 只是表示更新的一步，切分为示意。</text>

</main><nav aria-label="播放控制"><button id="play">暂停</button><button id="replay">重新播放</button><input id="seek" type="range" min="0" max="1200" value="0" aria-label="动画进度"><select id="speed" aria-label="播放速度"><option value=".75">0.75×</option><option value="1" selected>1×</option><option value="1.5">1.5×</option><option value="2">2×</option></select><span id="clock"></span></nav><p>连线与信号表示向量信息流；切分及注意力权重均为教学示意，并非真实模型输出。可暂停、拖动、重播和调速；手机建议横屏。</p><script>(function(root){const DURATION=12,clamp=p=>Math.max(0,Math.min(1,p));function getState(seconds){const t=Math.max(0,Math.min(DURATION,Number.isFinite(seconds)?seconds:0));return {stage:t<1?'initial':t<3.5?'gatherA':t<4.5?'updateA':t<5.5?'holdA':t<8?'gatherB':t<9?'updateB':'compare',aGather:clamp((t-1)/2.5),aUpdate:clamp(t-3.5),bGather:clamp((t-5.5)/2.5),bUpdate:clamp(t-8),completedOutputs:Number(t>=4.5)+Number(t>=9),finished:t>=DURATION,charactersMove:false,parametersUpdated:false};}const api={DURATION,getState};if(typeof module==='object'&&module.exports)module.exports=api;else root.AttentionModel=api;})(typeof window==='object'?window:globalThis);
</script><script>const M=AttentionModel,svg=document.querySelector('svg'),NS='http://www.w3.org/2000/svg';const text=s=>[...svg.querySelectorAll('text')].find(e=>e.textContent===s);
const paths=[...svg.querySelectorAll('path.attention')],widths=paths.map(e=>Number(e.getAttribute('stroke-width'))),baseOpacity=paths.map(e=>Number(e.getAttribute('opacity')||1));
function signal(color,r){const el=document.createElementNS(NS,'circle');el.setAttribute('r',r);el.setAttribute('fill',color);svg.appendChild(el);return el;}
const pulses=paths.map((p,i)=>signal(i<3?'#137765':'#58778e',2+widths[i]*.6)),outPulses=['#137765','#58778e'].map(c=>signal(c,6));
const outputPaths=[svg.querySelector('path[d="M904 335 H1156"]'),svg.querySelector('path[d="M904 555 H1156"]')];
const outputGroups=[[svg.querySelector('circle[cx="1180"][cy="335"]'),text('h花(A)'),text('花朵用法')],[svg.querySelector('circle[cx="1180"][cy="555"]'),text('h花(B)'),text('花费用法')]];
const caption=text('Attention 按权重汇集信息，参与形成当前 token 的上下文表示。');
const captions={initial:'观察“花”这个位置：它会怎样汇集左侧上下文的信息？',gatherA:'“盛开的花”：各位置的信息按示意权重汇入“花”，不是把字符搬过去。',updateA:'汇集的信息参与更新“花”的表示，得到偏向花朵用法的表示。',holdA:'保留第一种结果，再看不同上下文如何汇入不同信息。',gatherB:'“这钱随便花”：换一组上下文，按新的示意权重汇集信息。',updateB:'结合汇集的信息，形成偏向花费用法的表示。',compare:'同一个“花”，汇集的上下文信息不同，形成的表示也不同。'};
window.renderFrame=function(t){const s=M.getState(t),pulsePoints=[];
 paths.forEach((path,i)=>{const first=i<3,p=first?s.aGather:s.bGather,active=first?s.stage==='gatherA':s.stage==='gatherB',started=first?t>=1:t>=5.5;path.style.opacity=String(baseOpacity[i]*(started?1:.1));const pos=path.getPointAtLength(path.getTotalLength()*p);pulses[i].setAttribute('cx',pos.x);pulses[i].setAttribute('cy',pos.y);pulses[i].style.display=active?'':'none';pulsePoints.push({source:path.dataset.source,target:path.dataset.target,position:[pos.x,pos.y],visible:active,radius:Number(pulses[i].getAttribute('r'))});});
 outputPaths.forEach((path,i)=>{const p=i===0?s.aUpdate:s.bUpdate,length=path.getTotalLength(),active=i===0?s.stage==='updateA':s.stage==='updateB';path.style.opacity=p>0?'1':'.08';path.style.strokeDasharray=length+' '+length;path.style.strokeDashoffset=String(length*(1-p));path.style.markerEnd=p>=1?'url(#grayArrow)':'none';const y=i===0?335:555;outPulses[i].setAttribute('cx',904+(1180-904)*p);outPulses[i].setAttribute('cy',y);outPulses[i].style.display=active?'':'none';outputGroups[i].forEach(el=>el.style.opacity=p>=1?'1':'0');});
 caption.textContent=captions[s.stage];
 const rect=svg.getBoundingClientRect(),clipped=[...svg.querySelectorAll('text')].filter(e=>{const b=e.getBBox(),m=e.getScreenCTM();return [[b.x,b.y],[b.x+b.width,b.y],[b.x,b.y+b.height],[b.x+b.width,b.y+b.height]].some(([x,y])=>{const p=new DOMPoint(x,y).matrixTransform(m);return p.x<rect.left-.1||p.x>rect.right+.1||p.y<rect.top-.1||p.y>rect.bottom+.1})}).map(e=>e.textContent);
 window.frameDiagnostics={clipped_text:clipped,tokenPositions:[...svg.querySelectorAll('text[font-size="32"],text[font-size="36"]')].map(e=>[e.textContent,Number(e.getAttribute('x')),Number(e.getAttribute('y'))]),pulsePoints,completedOutputs:s.completedOutputs,weightsAreIllustrative:true,parametersUpdated:false,visibleOutputGroups:outputGroups.map(g=>g.every(el=>el.style.opacity==='1'))};return s;
};
window.exportPNG=async t=>{renderFrame(t);if(frameDiagnostics.clipped_text.length)throw Error(JSON.stringify(frameDiagnostics));const img=new Image();img.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(new XMLSerializer().serializeToString(svg));await img.decode();const c=document.createElement('canvas');c.width=1440;c.height=820;c.getContext('2d').drawImage(img,0,0);return c.toDataURL('image/png').split(',')[1];};
const renderMode=new URLSearchParams(location.search).has('render');if(renderMode)document.body.classList.add('render');let current=0,playing=!renderMode&&!matchMedia('(prefers-reduced-motion: reduce)').matches,last=0;
const btn=document.getElementById('play'),seek=document.getElementById('seek'),clock=document.getElementById('clock');function show(){renderFrame(current);seek.value=Math.round(current*100);clock.textContent=current.toFixed(1)+' / '+M.DURATION+'s';btn.textContent=playing?'暂停':current>=M.DURATION?'演示结束':'播放';}function replay(){current=0;playing=true;last=performance.now();show();}
btn.onclick=()=>{if(current>=M.DURATION)replay();else{playing=!playing;last=performance.now();show();}};document.getElementById('replay').onclick=replay;seek.oninput=()=>{current=Number(seek.value)/100;playing=false;show();};window.playerState=()=>({current,playing,model:M.getState(current)});window.seekTo=t=>{current=Math.max(0,Math.min(M.DURATION,t));playing=false;show();};
function tick(now){if(playing){current=Math.min(M.DURATION,current+(now-last)/1000*Number(document.getElementById('speed').value));if(current>=M.DURATION)playing=false;show();}last=now;requestAnimationFrame(tick);}window.ready=document.fonts.ready.then(()=>{show();last=performance.now();if(!renderMode)requestAnimationFrame(tick);return true;});
</script></body></html>
