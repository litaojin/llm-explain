<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>上下文造成的表示偏移</title><style>*{box-sizing:border-box}body{margin:0;background:#fafbf9;color:#20313b;font-family:"Noto Sans CJK SC","Microsoft YaHei",sans-serif}main{max-width:1440px;margin:12px auto 0}svg{display:block;width:100%;height:auto}nav{display:flex;gap:12px;align-items:center;flex-wrap:wrap;max-width:1050px;margin:8px auto;padding:0 22px}button,select{min-height:44px;border:1px solid #b7c9c0;background:white;border-radius:8px;padding:8px 14px;font:inherit;cursor:pointer;color:#175d50}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #137765;outline-offset:3px}#play{background:#137765;color:white;border-color:#137765;min-width:105px}input{flex:1;min-width:140px;height:44px;accent-color:#137765}#clock{min-width:80px;font:16px monospace}p{font-size:14px;color:#64737c;text-align:center;padding:0 16px}body.render main{margin:0;max-width:none}body.render nav,body.render p{display:none}</style></head><body><main><svg xmlns="http://www.w3.org/2000/svg" width="1440" height="790" viewBox="0 0 1440 790" role="img" aria-labelledby="title desc">
<title id="title">上下文引起的表示偏移：原始嵌入与上下文向量</title>
<desc id="desc">在同一张二维概念空间中，用相同原点O画出原始嵌入e花与两个上下文向量h花A、h花B。原始嵌入的端点是共同起点，粗绿色箭头从e花指向花开了语境下的h花A，对应花朵名词用法；粗蓝色箭头从e花指向花了十元语境下的h花B，对应花费动词用法。粗箭头表示计算前后的表示差异，而非推理时更新嵌入参数。位置、方向与位移长度均为概念构图，不是模型测量，不对真实跨层空间距离作语义度量。</desc>
<defs>
<marker id="grayArrow" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M1 1 L7.5 4.5 L1 8" fill="none" stroke="#82928b" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker>
<marker id="greenArrow" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M1 1 L7.5 4.5 L1 8" fill="none" stroke="#137765" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker>
<marker id="blueArrow" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M1 1 L7.5 4.5 L1 8" fill="none" stroke="#58778e" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>
<style>text{font-family:"Noto Sans CJK SC","WenQuanYi Zen Hei","Microsoft YaHei",sans-serif}.center{text-anchor:middle;dominant-baseline:middle}.axis{fill:none;stroke:#d5ddd7;stroke-width:1.5;marker-end:url(#grayArrow)}.shift{fill:none;stroke-width:3.2;stroke-linecap:round;stroke-linejoin:round}</style>
<rect width="1440" height="790" fill="#fafbf9"/>
<g fill="#20313b">
<text x="100" y="78" font-size="35" font-weight="650">同一个“花”：上下文让表示在空间中发生偏移</text>
<text x="100" y="124" font-size="21" fill="#64737c">从相同的原始嵌入出发，不同上下文，得到不同的上下文向量。</text>
<rect x="100" y="170" width="1240" height="445" rx="15" fill="#fff" stroke="#cad6ce" stroke-width="1.5"/>
<text x="130" y="205" font-size="18" fill="#89949a">同一张空间示意图：对照计算前后的表示，不是真实模型投影</text>
<ellipse cx="1120" cy="265" rx="125" ry="65" fill="#edf7f2"/>
<ellipse cx="1120" cy="500" rx="125" ry="65" fill="#eef3f7"/>
<path d="M330 560 H1280" class="axis"/>
<path d="M330 560 V240" class="axis"/>
<text x="1195" y="591" font-size="15" fill="#9aa69f">投影方向 1</text>
<text x="240" y="242" font-size="15" fill="#9aa69f">投影方向 2</text>
<circle cx="330" cy="560" r="4" fill="#98a79f"/>
<text x="302" y="585" font-size="18" fill="#89949a">O</text>
<path d="M330 560 L746 357" fill="none" stroke="#7c8d94" stroke-width="2.1" marker-end="url(#grayArrow)"/>
<path d="M330 560 L1103 271" fill="none" stroke="#137765" stroke-width="1.6" opacity=".32" marker-end="url(#greenArrow)"/>
<path d="M330 560 L1102 501" fill="none" stroke="#58778e" stroke-width="1.6" opacity=".35" marker-end="url(#blueArrow)"/>
<path d="M130 274 H176" stroke="#82928b" stroke-width="1.8"/>
<text x="195" y="280" font-size="17" fill="#64737c">细箭头：向量</text>
<path d="M130 309 H176" fill="none" stroke="#137765" stroke-width="3.2" marker-end="url(#greenArrow)"/>
<text x="195" y="315" font-size="17" fill="#64737c">粗箭头：偏移</text>
<path d="M778 345 Q940 240 1097 264" class="shift" stroke="#137765" marker-end="url(#greenArrow)"/>
<path d="M778 357 Q947 405 1098 493" class="shift" stroke="#58778e" marker-end="url(#blueArrow)"/>
<text x="920" y="241" class="center" font-size="22" fill="#137765">“花开了”</text>
<text x="910" y="447" class="center" font-size="22" fill="#58778e">“花了十元”</text>
<circle cx="760" cy="350" r="11" fill="#596e78"/>
<text x="640" y="287" class="center" font-size="24" font-weight="550">原始嵌入 e花</text>
<text x="640" y="318" class="center" font-size="17" fill="#64737c">尚未结合当前句子 · 共同起点</text>
<circle cx="1120" cy="265" r="11" fill="#137765"/>
<text x="1120" y="222" class="center" font-size="21" fill="#137765">上下文向量 h花(A)</text>
<text x="1120" y="309" class="center" font-size="24" fill="#137765">花朵 · 名词</text>
<circle cx="1120" cy="500" r="11" fill="#58778e"/>
<text x="1120" y="421" class="center" font-size="21" fill="#58778e">上下文向量 h花(B)</text>
<text x="1120" y="544" class="center" font-size="24" fill="#58778e">花费 · 动词</text>
<text x="100" y="670" font-size="24" fill="#137765">同一个初始表示，经不同上下文计算，朝各自句义对应的表示发生变化。</text>
<text x="100" y="719" font-size="16" fill="#89949a">偏移是表示变化的几何类比：不表示推理时改写原始嵌入，也不是训练轨迹；模型参数保持不变。</text>
<text x="100" y="750" font-size="16" fill="#89949a">同字同 token 为示意假设；点位、方向、位移长度均为概念构图，不能据此衡量真实高维或跨层的语义距离。</text>
</g></svg>
</main><nav aria-label="播放控制"><button id="play">暂停</button><button id="replay">重新播放</button><input id="seek" type="range" min="0" max="1200" value="0" aria-label="动画进度"><select id="speed" aria-label="播放速度"><option value=".75">0.75×</option><option value="1" selected>1×</option><option value="1.5">1.5×</option><option value="2">2×</option></select><span id="clock"></span></nav><p>表示变化的概念示意，不是真实模型投影或训练过程。可暂停、拖动、重播及调速；手机建议横屏观看。</p><script>(function(root){
 const DURATION=12,INITIAL=[760,350],A=[1120,265],B=[1120,500];const clamp=p=>Math.max(0,Math.min(1,p));
 function getState(seconds){
  const t=Math.max(0,Math.min(DURATION,Number.isFinite(seconds)?seconds:0));
  return {stage:t<1.5?'initial':t<5?'contextA':t<6?'holdA':t<9.5?'contextB':'compare',aProgress:clamp((t-1.5)/3.5),bProgress:clamp((t-6)/3.5),aVisible:t>=1.5,bVisible:t>=6,aComplete:t>=5,bComplete:t>=9.5,initialPoint:INITIAL.slice(),aPoint:A.slice(),bPoint:B.slice(),parametersUpdated:false,finished:t>=DURATION};
 }
 const api={DURATION,getState};if(typeof module==='object'&&module.exports)module.exports=api;else root.ContextModel=api;
})(typeof window==='object'?window:globalThis);
</script><script>
const M=ContextModel,svg=document.querySelector('svg'),NS='http://www.w3.org/2000/svg';
const findText=s=>[...svg.querySelectorAll('text')].find(e=>e.textContent===s);
const original=svg.querySelector('circle[cx="760"][cy="350"]'),shifts=[...svg.querySelectorAll('path.shift')];
const aVector=svg.querySelector('path[d="M330 560 L1103 271"]'),bVector=svg.querySelector('path[d="M330 560 L1102 501"]');
const aGroup=[svg.querySelector('ellipse[cy="265"]'),svg.querySelector('circle[cx="1120"][cy="265"]'),findText('上下文向量 h花(A)'),findText('花朵 · 名词')];
const bGroup=[svg.querySelector('ellipse[cy="500"]'),svg.querySelector('circle[cx="1120"][cy="500"]'),findText('上下文向量 h花(B)'),findText('花费 · 动词')];
const aContext=findText('“花开了”'),bContext=findText('“花了十元”'),caption=findText('同一个初始表示，经不同上下文计算，朝各自句义对应的表示发生变化。');
const pulses=['#137765','#58778e'].map(color=>{const e=document.createElementNS(NS,'circle');e.setAttribute('r','7');e.setAttribute('fill',color);svg.appendChild(e);return e;});
function opacity(elements,value){elements.forEach(el=>el.style.opacity=String(value));}
function interpolate(a,b,p){return {x:a.x+(b.x-a.x)*p,y:a.y+(b.y-a.y)*p};}
function trackPoint(path,p,end){const start={x:760,y:350},last={x:end[0],y:end[1]},length=path.getTotalLength(),first=path.getPointAtLength(0),tail=path.getPointAtLength(length),prefix=Math.hypot(first.x-start.x,first.y-start.y),suffix=Math.hypot(last.x-tail.x,last.y-tail.y),total=prefix+length+suffix,d=total*Math.max(0,Math.min(1,p));if(p<=0)return start;if(p>=1)return last;if(d<prefix)return interpolate(start,first,d/prefix);if(d<=prefix+length)return path.getPointAtLength(d-prefix);return interpolate(tail,last,(d-prefix-length)/suffix);}
function showShift(path,progress,visible,marker){const length=path.getTotalLength();path.style.opacity=visible?'1':'0';path.style.strokeDasharray=length+' '+length;path.style.strokeDashoffset=String(length*(1-progress));path.style.markerEnd=progress>=1?'url(#'+marker+')':'none';}
window.renderFrame=function(t){
 const s=M.getState(t);showShift(shifts[0],s.aProgress,s.aVisible,'greenArrow');showShift(shifts[1],s.bProgress,s.bVisible,'blueArrow');
 aContext.style.opacity=s.aVisible?'1':'0';bContext.style.opacity=s.bVisible?'1':'0';
 opacity(aGroup,s.aComplete?1:0);opacity(bGroup,s.bComplete?1:0);
 aVector.style.opacity=String(.32*Math.max(0,Math.min(1,(s.aProgress-.6)/.4)));bVector.style.opacity=String(.35*Math.max(0,Math.min(1,(s.bProgress-.6)/.4)));
 const positions=[trackPoint(shifts[0],s.aProgress,s.aPoint),trackPoint(shifts[1],s.bProgress,s.bPoint)];
 pulses.forEach((el,i)=>{const visible=i===0?s.stage==='contextA':s.stage==='contextB';el.style.display=visible?'':'none';el.setAttribute('cx',positions[i].x);el.setAttribute('cy',positions[i].y);});
 caption.textContent=s.stage==='initial'?'同一个“花”，先查出同一个原始嵌入 e花。':s.stage==='contextA'?'“花开了”：从 e花 计算出偏向花朵用法的上下文表示。':s.stage==='holdA'?'e花 仍在原位；新增的是这个语境中的上下文向量。':s.stage==='contextB'?'回到同一 e花：“花了十元”得到偏向花费用法的表示。':'同一个起点，不同上下文、不同表示；模型参数和原始嵌入不变。';
 const rect=svg.getBoundingClientRect(),clipped=[...svg.querySelectorAll('text')].filter(e=>{const b=e.getBBox(),m=e.getScreenCTM();return [[b.x,b.y],[b.x+b.width,b.y],[b.x,b.y+b.height],[b.x+b.width,b.y+b.height]].some(([x,y])=>{const p=new DOMPoint(x,y).matrixTransform(m);return p.x<rect.left-.1||p.x>rect.right+.1||p.y<rect.top-.1||p.y>rect.bottom+.1})}).map(e=>e.textContent);
 window.frameDiagnostics={clipped_text:clipped,initialPoint:[Number(original.getAttribute('cx')),Number(original.getAttribute('cy'))],aPulse:[positions[0].x,positions[0].y],bPulse:[positions[1].x,positions[1].y],completedOutputs:Number(s.aComplete)+Number(s.bComplete),parametersUpdated:false};return s;
};
window.exportPNG=async(t)=>{renderFrame(t);if(frameDiagnostics.clipped_text.length)throw Error(JSON.stringify(frameDiagnostics));const source=new XMLSerializer().serializeToString(svg),img=new Image();img.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(source);await img.decode();const c=document.createElement('canvas');c.width=1440;c.height=790;c.getContext('2d').drawImage(img,0,0);return c.toDataURL('image/png').split(',')[1];};
const renderMode=new URLSearchParams(location.search).has('render');if(renderMode)document.body.classList.add('render');let current=0,playing=!renderMode&&!matchMedia('(prefers-reduced-motion: reduce)').matches,last=0;
const btn=document.getElementById('play'),seek=document.getElementById('seek'),clock=document.getElementById('clock');
function show(){renderFrame(current);seek.value=Math.round(current*100);clock.textContent=current.toFixed(1)+' / '+M.DURATION+'s';btn.textContent=playing?'暂停':current>=M.DURATION?'演示结束':'播放';}
function replay(){current=0;playing=true;last=performance.now();show();}
btn.onclick=()=>{if(current>=M.DURATION)replay();else{playing=!playing;last=performance.now();show();}};document.getElementById('replay').onclick=replay;seek.oninput=()=>{current=Number(seek.value)/100;playing=false;show();};
window.playerState=()=>({current,playing,model:M.getState(current)});window.seekTo=t=>{current=Math.max(0,Math.min(M.DURATION,t));playing=false;show();};
function tick(now){if(playing){current=Math.min(M.DURATION,current+(now-last)/1000*Number(document.getElementById('speed').value));if(current>=M.DURATION)playing=false;show();}last=now;requestAnimationFrame(tick);}
window.ready=document.fonts.ready.then(()=>{show();last=performance.now();if(!renderMode)requestAnimationFrame(tick);return true;});
</script></body></html>
