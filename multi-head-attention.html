<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>多头 Attention：同一输入，多种汇集方式 · LLM Explain</title><style>*{box-sizing:border-box}body{margin:0;background:#fafbf9;color:#20313b;font-family:"Noto Sans CJK SC","Microsoft YaHei",sans-serif}main{max-width:1680px;margin:auto}.canvas{width:100%;overflow:auto}svg{display:block;width:100%;height:auto;min-width:720px}button,select{font:inherit;min-height:44px;padding:8px 15px;border:1px solid #d5dfd7;border-radius:6px;background:#fff;color:#137765;cursor:pointer}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #326a91;outline-offset:3px}.controls{display:flex;align-items:center;flex-wrap:wrap;gap:12px;padding:12px 20px;border-top:1px solid #d5dfd7}#seek{flex:1;min-width:140px;min-height:44px;accent-color:#137765}.note{padding:0 20px;margin:5px 0 18px;color:#596b72;font-size:13px;line-height:1.7}.scroll-hint{display:none}@media(max-width:720px){.scroll-hint{display:block;padding:10px 20px;margin:0;font-size:13px;color:#596b72}.controls{gap:8px}.controls label{display:inline-flex;align-items:center;gap:5px;min-height:44px}#seek{flex-basis:100%}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto}}</style></head><body><main><p class="scroll-hint">小屏可左右滑动图解；下方控件可暂停、拖动与倍速回看。</p><div class="canvas" aria-label="多头 Attention：同一输入，多种汇集方式"><svg xmlns="http://www.w3.org/2000/svg" width="1680" height="1080" viewBox="0 0 1680 1080" role="img" aria-labelledby="title"><title id="title">多头 Attention：同一输入，多种汇集方式</title><defs><marker id="ag" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#137765" /></marker><marker id="ab" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#326a91" /></marker><marker id="am" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#63767b" /></marker></defs><style>text{font-family:"Noto Sans CJK SC","Microsoft YaHei",sans-serif}*{box-sizing:border-box}</style><rect width="1680" height="1080" fill="#fafbf9" id="el-3" data-at="-1" /><text x="80" y="42" font-size="17" fill="#137765" text-anchor="start" font-weight="400" id="el-4" data-at="-1">第三部分 · Transformer 内部计算 / 动画 07 / 11</text><text x="80" y="100" font-size="38" fill="#20313b" text-anchor="start" font-weight="650" id="el-5" data-at="-1">多头 Attention：同一输入，多种汇集方式</text><text x="80" y="148" font-size="24" fill="#63767b" text-anchor="start" font-weight="400" id="el-6" data-at="-1">不同头使用不同的可学习投影；拼接后的结果还要经过输出投影。</text><line x1="80" y1="177" x2="1600" y2="177" stroke="#d3dfd6" stroke-width="2" id="el-7" data-at="-1" /><rect x="80" y="380" width="325" height="230" rx="10" fill="#edf5ef" stroke="#d3dfd6" stroke-width="1.8" id="el-8" data-at="-1" /><text x="242.5" y="453" font-size="26" fill="#20313b" text-anchor="middle" font-weight="650" id="el-9" data-at="-1">同一组可见输入</text><text x="242.5" y="487" font-size="26" fill="#20313b" text-anchor="middle" font-weight="400" id="el-10" data-at="-1">H1 = [1, 0]</text><text x="242.5" y="521" font-size="26" fill="#20313b" text-anchor="middle" font-weight="400" id="el-11" data-at="-1">H2 = [0, 1]</text><text x="242.5" y="555" font-size="26" fill="#20313b" text-anchor="middle" font-weight="400" id="el-12" data-at="-1">H3 = [1, 1]</text><path d="M405 495 L455 495 L455 325 L500 325" fill="none" stroke="#137765" stroke-width="3" marker-end="url(#ag)" id="el-13" data-at="2" opacity="0" /><rect x="510" y="225" width="655" height="230" rx="10" fill="white" stroke="#d3dfd6" stroke-width="1.8" id="el-14" data-at="-1" /><text x="540" y="267" font-size="28" fill="#137765" text-anchor="start" font-weight="650" id="el-15" data-at="2" opacity="0">头 1 · 独立的一组投影</text><text x="540" y="313" font-size="22" fill="#20313b" text-anchor="start" font-weight="400" id="el-16" data-at="2.5" opacity="0">wq=[1, 0]   wk=[1, 0]   wv=[1, 0]</text><text x="540" y="357" font-size="24" fill="#20313b" text-anchor="start" font-weight="400" id="el-17" data-at="4" opacity="0">q=1；k=[1, 0, 1]；v=[1, 0, 1]</text><text x="540" y="401" font-size="26" fill="#137765" text-anchor="start" font-weight="400" id="head-weights-0" data-at="9" opacity="0">α=[0.422, 0.155, 0.422] → o1=0.8446</text><text x="540" y="435" font-size="19" fill="#63767b" text-anchor="start" font-weight="400" id="el-19" data-at="-1">头内维度为 1；同样只读取前三个位置。</text><path d="M1165 340 L1200 340 L1200 470 L1250 470" fill="none" stroke="#326a91" stroke-width="3" marker-end="url(#ab)" id="el-20" data-at="14" opacity="0" /><path d="M405 495 L455 495 L455 645 L500 645" fill="none" stroke="#137765" stroke-width="3" marker-end="url(#ag)" id="el-21" data-at="2" opacity="0" /><rect x="510" y="545" width="655" height="230" rx="10" fill="white" stroke="#d3dfd6" stroke-width="1.8" id="el-22" data-at="-1" /><text x="540" y="587" font-size="28" fill="#137765" text-anchor="start" font-weight="650" id="el-23" data-at="2" opacity="0">头 2 · 独立的一组投影</text><text x="540" y="633" font-size="22" fill="#20313b" text-anchor="start" font-weight="400" id="el-24" data-at="2.5" opacity="0">wq=[0, 1]   wk=[0, 2]   wv=[1, 1]</text><text x="540" y="677" font-size="24" fill="#20313b" text-anchor="start" font-weight="400" id="el-25" data-at="4" opacity="0">q=1；k=[0, 2, 2]；v=[1, 1, 2]</text><text x="540" y="721" font-size="26" fill="#137765" text-anchor="start" font-weight="400" id="head-weights-1" data-at="9" opacity="0">α=[0.063, 0.468, 0.468] → o2=1.4683</text><text x="540" y="755" font-size="19" fill="#63767b" text-anchor="start" font-weight="400" id="el-27" data-at="-1">头内维度为 1；同样只读取前三个位置。</text><path d="M1165 660 L1200 660 L1200 470 L1250 470" fill="none" stroke="#326a91" stroke-width="3" marker-end="url(#ab)" id="el-28" data-at="14" opacity="0" /><rect x="1260" y="390" width="340" height="145" rx="10" fill="#edf5ef" stroke="#d3dfd6" stroke-width="1.8" id="el-29" data-at="16" opacity="0" /><text x="1430" y="454.5" font-size="24" fill="#326a91" text-anchor="middle" font-weight="650" id="el-30" data-at="16" opacity="0">拼接两个头的输出</text><text x="1430" y="488.5" font-size="24" fill="#326a91" text-anchor="middle" font-weight="400" id="concat-result" data-at="16" opacity="0">[0.8446, 1.4683]</text><path d="M1430 535 L1430 605" fill="none" stroke="#326a91" stroke-width="3" marker-end="url(#ab)" id="el-32" data-at="18" opacity="0" /><rect x="1210" y="620" width="390" height="190" rx="10" fill="white" stroke="#d3dfd6" stroke-width="1.8" id="el-33" data-at="18" opacity="0" /><text x="1405" y="690" font-size="24" fill="#326a91" text-anchor="middle" font-weight="650" id="el-34" data-at="18" opacity="0">再乘输出投影 WO</text><text x="1405" y="724" font-size="24" fill="#326a91" text-anchor="middle" font-weight="400" id="el-35" data-at="18" opacity="0">[[1, 0.5], [−0.5, 1]]</text><text x="1405" y="758" font-size="24" fill="#326a91" text-anchor="middle" font-weight="400" id="multi-output" data-at="18.8" opacity="0">[0.1105, 1.8906]</text><text x="100" y="870" font-size="24" fill="#63767b" text-anchor="start" font-weight="400" id="el-37" data-at="-1">先并行汇集，再拼接与混合；不是多个头投票挑一个词，也不预先指定“语法头”。</text><rect x="80" y="920" width="1520" height="60" rx="6" fill="#edf5ef" stroke="none" stroke-width="1.8" id="el-38" data-at="-1" /><text x="105" y="959" font-size="26" fill="#137765" text-anchor="start" font-weight="650" id="el-39" data-at="19" opacity="0">多头输出仍是当前位置的表示；它不是多个词，也不是多个词表概率。</text><text x="80" y="1014" font-size="18" fill="#63767b" text-anchor="start" font-weight="400" id="el-40" data-at="-1">本图改用两个一维头，投影与上一张二维单头不同；沿用同一输入，不强接上一张的输出数值。</text><text x="80" y="1044" font-size="18" fill="#63767b" text-anchor="start" font-weight="400" id="el-41" data-at="-1">忽略位置变换等细节；WO 的示例数字与各头投影均为固定教学参数，不是模型实测值。</text><text id="stage-status" x="80" y="205" font-size="20" fill="#137765" text-anchor="start" data-at="-1" opacity="1" /><text id="head-scores-0" x="540" y="481" font-size="20" fill="#63767b" text-anchor="start" data-at="6" opacity="0" /><text id="head-scores-1" x="540" y="801" font-size="20" fill="#63767b" text-anchor="start" data-at="6" opacity="0" /><text id="head-output-0" x="540" y="510" font-size="21" fill="#137765" text-anchor="start" data-at="12" opacity="0" /><text id="head-output-1" x="540" y="830" font-size="21" fill="#137765" text-anchor="start" data-at="12" opacity="0" /></svg></div><div class="controls" aria-label="播放控制"><button id="play" type="button" aria-pressed="false">播放</button><button id="replay" type="button">重播</button><input id="seek" type="range" min="0" max="22" value="0" step="0.01" aria-label="动画时间"><span id="clock" aria-live="off">0 / 22 秒</span><label>倍速 <select id="speed" aria-label="播放速度"><option value="0.5">0.5×</option><option value="1" selected>1×</option><option value="1.5">1.5×</option><option value="2">2×</option></select></label></div><p class="note">固定参数的教学算例；非真实模型实测。拖动时间可复现完整状态。　单次播放后停止。<noscript>交互需启用 JavaScript；可打开同目录的 GIF 观看完整过程。</noscript></p></main><script>const LessonConfig={"id":"multi-head-attention","title":"多头 Attention：同一输入，多种汇集方式","width":1680,"height":1080,"duration":22,"caption":"固定参数的教学算例；非真实模型实测。拖动时间可复现完整状态。","snapshots":[0,5,8,13.5,17,21]};</script><script>const LessonModel=(()=>{
const DURATION=22,STAGES=[[0, "input"], [2, "project"], [6, "score"], [9, "normalize"], [12, "aggregate"], [16, "concat"], [18, "output"], [20, "final"]];
// Approved fixed teaching data, row-vector convention. No network or runtime imports.
const H=[[1,0],[0,1],[1,1],[2,1]],tokens=['这','朵','花','开'];
const WQ=[[1,0],[0,1]],WK=[[1,0],[0,2]],WV=[[1,1],[0,1]],WO=[[1,.5],[-.5,1]];
const dot=(a,b)=>a.reduce((s,x,i)=>s+x*b[i],0);
const mul=(A,B)=>A.map(r=>B[0].map((_,j)=>r.reduce((s,x,k)=>s+x*B[k][j],0)));
const softmax=xs=>{const m=Math.max(...xs),e=xs.map(x=>Math.exp(x-m)),z=e.reduce((a,b)=>a+b,0);return e.map(x=>x/z)};
function mathState(){
 const Q=mul(H,WQ),K=mul(H,WK),V=mul(H,WV),rawDots=K.map(k=>dot(Q[2],k)),scaledScores=rawDots.map(x=>x/Math.sqrt(2));
 const weights=[...softmax(scaledScores.slice(0,3)),0],maskedScores=scaledScores.map((x,i)=>i<3?x:null),exponentials=scaledScores.map((x,i)=>i<3?Math.exp(x):0),denominator=exponentials.reduce((a,b)=>a+b,0);
 const weightedValues=V.map((r,i)=>r.map(x=>x*weights[i])),output=V[0].map((_,j)=>weightedValues.reduce((s,r)=>s+r[j],0));
 const head=(wq,wk,wv)=>{const q=dot(H[2],wq),k=H.slice(0,3).map(h=>dot(h,wk)),v=H.slice(0,3).map(h=>dot(h,wv)),scores=k.map(x=>q*x),weights=softmax(scores);return {wq,wk,wv,q,k,v,scores,weights,output:dot(weights,v),head_dim:1,maskedFutureWeight:0}};
 const heads=[head([1,0],[1,0],[1,0]),head([0,1],[0,2],[1,1])],concat=heads.map(h=>h.output),multiOutput=mul([concat],WO)[0];
 return {real_model:false,tokens:[...tokens],H:H.map(r=>[...r]),WQ,WK,WV,Q,K,V,rawDots,scaledScores,maskedScores,exponentials,denominator,weights,weightedValues,output,heads,concat,WO,multiOutput,target_position:3};
}
function stateAt(t){
 t=Number(t);const time=Number.isFinite(t)?Math.max(0,Math.min(DURATION,t)):0;
 let stageIndex=0;for(let i=0;i<STAGES.length;i++)if(time>=STAGES[i][0])stageIndex=i;
 const [start,stage]=STAGES[stageIndex],end=STAGES[stageIndex+1]?.[0]??DURATION;
 return {time,stage,stageIndex,stageProgress:Math.max(0,Math.min(1,(time-start)/(end-start))),progress:time/DURATION,math:mathState()};
}
return {DURATION,stateAt};})();
if(typeof module!=='undefined')module.exports=LessonModel;
</script><script>// Pure seek rendering: no timers, no retained animation state.
function renderScene(state){
 const t=state.time,m=state.math,clamp=x=>Math.max(0,Math.min(1,x));
 for(const e of document.querySelectorAll('svg [data-at]')){
  const at=Number(e.getAttribute('data-at')),p=clamp((t-at)/0.55);
  opacity(e.id,at<0?1:p);
  if(e.tagName.toLowerCase()==='path'&&e.hasAttribute('marker-end')){
   const length=e.getTotalLength();e.setAttribute('stroke-dasharray',`${length} ${length}`);e.setAttribute('stroke-dashoffset',String(length*(1-clamp((t-at)/1.2))));
  }
 }
 const labels={"input": "同一组可见输入 H；两个头都只读取前三个位置。", "project": "① 两个头并行投影：各有独立 wq / wk / wv，头维度都是 1。", "score": "② 两个流并行计算 q × k / √1；各自得到自己的分数。", "normalize": "③ 每个头分别做共同 softmax；不是跨头归一化。", "aggregate": "④ 各头用自己的权重乘自己的 v，并各自求和。", "concat": "⑤ 拼接保留两个头的输出：[o1, o2]，不是投票。", "output": "⑥ 拼接向量再右乘 WO；两个分量在这里混合。", "final": "同一输入 → 独立的一维头 → 拼接 → WO → 当前位置的表示。"};
 text('stage-status',labels[state.stage]);
 const f=(x,n=3)=>x.toFixed(n),vec=(xs,n=3)=>'['+xs.map(x=>Number.isInteger(x)?String(x):f(x,n)).join(', ')+']';
 m.heads.forEach((h,i)=>{text('head-weights-'+i,'α = '+vec(h.weights));text('head-scores-'+i,'qk / √1 = '+vec(h.scores,0)+'；第 4 位置已遮挡。');text('head-output-'+i,'Σ α × v → o'+(i+1)+' = '+f(h.output,4));});
 text('concat-result',vec(m.concat,4));text('multi-output',vec(m.multiOutput,4));
 document.querySelector('svg').setAttribute('data-stage',state.stage);
 return {stage:state.stage,maskedFutureWeight:m.weights[3],output:m.multiOutput,headDimensions:[1,1]};
}
</script><script>const svg=document.querySelector('svg'),$=id=>document.getElementById(id);
function text(id,value){const e=$(id);if(!e)throw Error('Missing SVG label '+id);e.textContent=String(value)}
function opacity(id,value){const e=$(id);if(!e)throw Error('Missing SVG group '+id);e.setAttribute('opacity',String(value))}
let currentTime=0,playing=false,rate=1,raf=0,lastTick=0;
function boundedTime(t){t=Number(t);return Number.isFinite(t)?Math.max(0,Math.min(LessonModel.DURATION,t)):0}
function renderFrame(t){currentTime=boundedTime(t);const state=LessonModel.stateAt(currentTime),scene=renderScene(state);$('seek').value=currentTime;$('clock').textContent=currentTime.toFixed(1)+' / '+LessonModel.DURATION+' 秒';window.frameDiagnostics={time:currentTime,model:state,scene};return window.frameDiagnostics}
function updateControls(){$('play').textContent=playing?'暂停':'播放';$('play').setAttribute('aria-pressed',String(playing))}
function pause(){playing=false;cancelAnimationFrame(raf);updateControls()}
function tick(now){if(!playing)return;const elapsed=Math.max(0,(now-lastTick)/1000);lastTick=now;renderFrame(currentTime+elapsed*rate);if(currentTime>=LessonModel.DURATION){pause();return}raf=requestAnimationFrame(tick)}
function play(){if(currentTime>=LessonModel.DURATION)renderFrame(0);if(playing)return;playing=true;lastTick=performance.now();updateControls();raf=requestAnimationFrame(tick)}
function seekTo(t){pause();return renderFrame(t)}
function playerState(){return {playing,current:currentTime,speed:rate,duration:LessonModel.DURATION,stage:window.frameDiagnostics?.model?.stage}}
function visibleTextBounds(){const r=svg.getBoundingClientRect();return [...svg.querySelectorAll('text')].filter(e=>{for(let n=e;n&&n!==svg.parentNode;n=n.parentElement){const c=getComputedStyle(n);if(c.display==='none'||c.visibility==='hidden'||Number(c.opacity)===0)return false}return !!e.textContent.trim()}).map(e=>{const b=e.getBBox(),m=e.getScreenCTM(),a=new DOMPoint(b.x,b.y).matrixTransform(m),z=new DOMPoint(b.x+b.width,b.y+b.height).matrixTransform(m);return {id:e.id,text:e.textContent,x:a.x-r.x,y:a.y-r.y,width:z.x-a.x,height:z.y-a.y,inside:a.x>=r.x-1&&a.y>=r.y-1&&z.x<=r.right+1&&z.y<=r.bottom+1}})}
async function exportPNG(t){pause();renderFrame(t);await document.fonts.ready;const clone=svg.cloneNode(true);clone.setAttribute('xmlns','http://www.w3.org/2000/svg');clone.setAttribute('width',String(LessonConfig.width));clone.setAttribute('height',String(LessonConfig.height));const xml=new XMLSerializer().serializeToString(clone),url=URL.createObjectURL(new Blob([xml],{type:'image/svg+xml;charset=utf-8'}));try{const image=new Image();await new Promise((resolve,reject)=>{image.onload=resolve;image.onerror=reject;image.src=url});const canvas=document.createElement('canvas');canvas.width=LessonConfig.width;canvas.height=LessonConfig.height;const ctx=canvas.getContext('2d');ctx.fillStyle='#fafbf9';ctx.fillRect(0,0,canvas.width,canvas.height);ctx.drawImage(image,0,0,canvas.width,canvas.height);return canvas.toDataURL('image/png')}finally{URL.revokeObjectURL(url)}}
$('play').onclick=()=>playing?pause():play();$('replay').onclick=()=>{pause();renderFrame(0);play()};$('seek').addEventListener('input',e=>seekTo(e.target.value));$('speed').onchange=e=>{rate=Number(e.target.value)};svg.addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();playing?pause():play()}if(e.code==='ArrowRight'){e.preventDefault();seekTo(currentTime+1)}if(e.code==='ArrowLeft'){e.preventDefault();seekTo(currentTime-1)}});document.addEventListener('visibilitychange',()=>{if(document.hidden)pause()});
const ready=(async()=>{await document.fonts.ready;renderFrame(0);updateControls();if(!new URLSearchParams(location.search).has('render')&&!matchMedia('(prefers-reduced-motion: reduce)').matches)play();return true})();
window.ready=ready;window.renderFrame=renderFrame;window.exportPNG=exportPNG;window.seekTo=seekTo;window.playerState=playerState;window.visibleTextBounds=visibleTextBounds;
</script></body></html>
