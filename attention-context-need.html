ker><marker id="am" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#63767b" /></marker></defs><style id="e2">text{font-family:"Noto Sans CJK SC","Microsoft YaHei",sans-serif}*{box-sizing:border-box}</style><rect width="1680" height="1080" fill="#fafbf9" id="e3" /><text x="80" y="42" font-size="17" fill="#137765" text-anchor="start" font-weight="400" id="e4">第三部分 · Transformer 内部计算 / 动画 01 / 11</text><text x="80" y="100" font-size="38" fill="#20313b" text-anchor="start" font-weight="650" id="e5">为什么需要 Attention？先从一个“花”说起</text><text x="80" y="148" font-size="24" fill="#63767b" text-anchor="start" font-weight="400" id="e6">先认识问题：初始嵌入告诉模型当前是哪个 token，但它本身不随这段前文改变。</text><line x1="80" y1="177" x2="1600" y2="177" stroke="#d3dfd6" stroke-width="2" id="e7" /><text x="100" y="230" font-size="28" fill="#137765" text-anchor="start" font-weight="650" id="e8" opacity="0">先比较两段前文：当前 token 都是“花”，但表达的意思不同。</text><rect x="100" y="290" width="590" height="150" rx="10" fill="white" stroke="#d3dfd6" stroke-width="1.8" id="e9" opacity="0" /><text x="130" y="335" font-size="21" fill="#63767b" text-anchor="start" font-weight="400" id="e10" opacity="0">教学切分 · 谈论花朵</text><text x="145" y="397" font-size="34" fill="#20313b" text-anchor="start" font-weight="400" id="e11" opacity="0">盛 开 的</text><rect x="525" y="355" width="125" height="65" rx="10" fill="#edf5ef" stroke="#d3dfd6" stroke-width="1.8" id="e12" opacity="0" /><text x="587.5" y="396.5" font-size="34" fill="#137765" text-anchor="middle" font-weight="650" id="e13" opacity="0">花</text><path d="M690 380 L790 380" fill="none" stroke="#137765" stroke-width="3" marker-end="url(#ag)" id="e14" opacity="0" /><rect x="800" y="320" width="360" height="120" rx="10" fill="#edf5ef" stroke="#d3dfd6" stroke-width="1.8" id="e15" opacity="0" /><text x="980" y="372" font-size="25" fill="#20313b" text-anchor="middle" font-weight="650" id="e16" opacity="0">查同一个 token 的嵌入</text><text x="980" y="406" font-size="25" fill="#20313b" text-anchor="middle" font-weight="400" id="e17" opacity="0">同一个初始向量 e花</text><rect x="100" y="510" width="590" height="150" rx="10" fill="white" stroke="#d3dfd6" stroke-width="1.8" id="e18" opacity="0" /><text x="130" y="555" font-size="21" fill="#63767b" text-anchor="start" font-weight="400" id="e19" opacity="0">教学切分 · 谈论花钱</text><text x="145" y="617" font-size="34" fill="#20313b" text-anchor="start" font-weight="400" id="e20" opacity="0">这 钱 随 便</text><rect x="525" y="575" width="125" height="65" rx="10" fill="#edf5ef" stroke="#d3dfd6" stroke-width="1.8" id="e21" opacity="0" /><text x="587.5" y="616.5" font-size="34" fill="#137765" text-anchor="middle" font-weight="650" id="e22" opacity="0">花</text><path d="M690 600 L790 600" fill="none" stroke="#137765" stroke-width="3" marker-end="url(#ag)" id="e23" opacity="0" /><rect x="800" y="540" width="360" height="120" rx="10" fill="#edf5ef" stroke="#d3dfd6" stroke-width="1.8" id="e24" opacity="0" /><text x="980" y="592" font-size="25" fill="#20313b" text-anchor="middle" font-weight="650" id="e25" opacity="0">查同一个 token 的嵌入</text><text x="980" y="626" font-size="25" fill="#20313b" text-anchor="middle" font-weight="400" id="e26" opacity="0">同一个初始向量 e花</text><line x1="1195" y1="360" x2="1220" y2="360" stroke="#326a91" stroke-width="3" id="e27" opacity="0" /><line x1="1195" y1="580" x2="1220" y2="580" stroke="#326a91" stroke-width="3" id="e28" opacity="0" /><line x1="1220" y1="360" x2="1220" y2="580" stroke="#326a91" stroke-width="3" id="e29" opacity="0" /><path d="M1220 470 L1270 470" fill="none" stroke="#326a91" stroke-width="3" marker-end="url(#ab)" id="e30" opacity="0" /><rect x="1280" y="350" width="310" height="245" rx="10" fill="white" stroke="#d3dfd6" stroke-width="1.8" id="e31" opacity="0" /><text x="1435" y="447.5" font-size="26" fill="#326a91" text-anchor="middle" font-weight="650" id="e32" opacity="0">仅查“花”还不够</text><text x="1435" y="481.5" font-size="26" fill="#326a91" text-anchor="middle" font-weight="400" id="e33" opacity="0">两段前文的信息</text><text x="1435" y="515.5" font-size="26" fill="#326a91" text-anchor="middle" font-weight="400" id="e34" opacity="0">还没有读进来</text><text x="100" y="765" font-size="28" fill="#137765" text-anchor="start" font-weight="650" id="e35" opacity="0">需要解决的问题</text><text x="100" y="825" font-size="33" fill="#20313b" text-anchor="start" font-weight="650" id="e36" opacity="0">怎样把前文的信息读进来，让当前位置的表示适合当前上下文？</text><rect x="80" y="920" width="1520" height="60" rx="6" fill="#edf5ef" stroke="none" stroke-width="1.8" id="e37" opacity="0" /><text x="105" y="959" font-size="26" fill="#137765" text-anchor="start" font-weight="650" id="e38" opacity="0">同一 token 的初始嵌入相同；适合当前上下文的表示，还需要前文信息。</text><text x="80" y="1014" font-size="18" fill="#63767b" text-anchor="start" font-weight="400" id="e39" opacity="1">切分与含义对照是教学示意；固定参数下，同一 token ID 查同一嵌入行，不是在推理时修改嵌入表。</text><text x="80" y="1044" font-size="18" fill="#63767b" text-anchor="start" font-weight="400" id="e40" opacity="1">Attention 是读取与组合上下文信息的一种方法，并非唯一方法；此图不声称进行了真实模型推理。</text></svg></div><div class="controls" aria-label="播放控制"><button id="play" type="button" aria-pressed="false">播放</button><button id="replay" type="button">重播</button><input id="seek" type="range" min="0" max="20" value="0" step="0.01" aria-label="动画时间"><span id="clock" aria-live="off">0 / 20 秒</span><label>倍速 <select id="speed" aria-label="播放速度"><option value="0.5">0.5×</option><option value="1" selected>1×</option><option value="1.5">1.5×</option><option value="2">2×</option></select></label></div><p class="note">人工教学示意；信号沿来源→目标传递，字符与参数不移动。分步显露仅为教学节奏，并非真实张量执行调度。　单次播放后停止。<noscript>交互需启用 JavaScript；可打开同目录的 GIF 观看完整过程。</noscript></p></main><script>const LessonConfig={"id":"attention-context-need","title":"为什么需要 Attention？先从一个“花”说起","width":1680,"height":1080,"duration":20,"caption":"人工教学示意；信号沿来源→目标传递，字符与参数不移动。分步显露仅为教学节奏，并非真实张量执行调度。","snapshots":[2,5,10,14.8,18]};</script><script>const DURATION=20;
const clamp=x=>Math.max(0,Math.min(1,x));
const bound=t=>Number.isFinite(Number(t))?Math.max(0,Math.min(DURATION,Number(t))):0;
const times={"e8": 0, "e9": 0, "e10": 0, "e11": 0, "e12": 0, "e13": 0, "e14": 6, "e15": 6, "e16": 6, "e17": 6, "e18": 3, "e19": 3, "e20": 3, "e21": 3, "e22": 3, "e23": 8, "e24": 8, "e25": 8, "e26": 8, "e27": 11, "e28": 11, "e29": 11, "e30": 11, "e31": 11, "e32": 11, "e33": 11, "e34": 11, "e35": 14, "e36": 14, "e37": 16, "e38": 16, "e39": -1, "e40": -1};
function stateAt(input){const time=bound(input),reveals={};for(const [id,start] of Object.entries(times))reveals[id]=clamp((time-start)/.7);
stage=time<6?'same-token':time<11?'same-embedding':time<14?'missing-context':'question';const extra={sameToken:true,sameEmbedding:time>=8.7,contextRead:false,questionVisible:time>=14.7};
return {time,progress:time/DURATION,stage:time>=DURATION-2?'hold':stage,reveals,...extra};}
const LessonModel={DURATION,stateAt};if(typeof module!=='undefined'&&module.exports)module.exports=LessonModel;
</script><script>function renderScene(s){
 for(const [id,value] of Object.entries(s.reveals))opacity(id,value);
 
 return {stage:s.stage,progress:s.progress};
}
function moveSignal(pathId,signalId,p,visible){const path=$(pathId),point=path.getPointAtLength(path.getTotalLength()*Math.max(0,Math.min(1,p))),signal=$(signalId);signal.setAttribute('cx',point.x);signal.setAttribute('cy',point.y);opacity(signalId,visible?1:0);}
</script><script>const svg=document.querySelector('svg'),$=id=>document.getElementById(id);
function text(id,value){const e=$(id);if(!e)throw Error('Missing SVG label '+id);e.textContent=String(value)}
function opacity(id,value){const e=$(id);if(!e)throw Error('Missing SVG group '+id);e.setAttribute('opacity',String(value))}
let currentTime=0,playing=false,rate=1,raf=0,lastTick=0;
function boundedTime(t){t=Number(t);return Number.isFinite(t)?Math.max(0,Math.min(LessonModel.DURATION,t)):0}
function renderFrame(t){currentTime=boundedTime(t);const state=LessonModel.stateAt(currentTime),scene=renderScene(state);$('seek').value=currentTime;$('clock').textContent=currentTime.toFixed(1)+' / '+LessonModel.DURATION+' 秒';window.frameDiagnostics={time:currentTime,model:state,scene};return window.frameDiagnostics}
function updateControls(){$('play').textContent=playing?'暂停':'播放';$('play').setAttribute('aria-pressed',String(playing))}
function pause(){playing=false;cancelAnimationFrame(raf);updateControls()}
function tick(now){if(!playing)return;const elapsed=Math.max(0,(now-lastTick)/1000);lastTick=now;renderFrame(currentTime+elapsed*rate);if(currentTime>=LessonModel.DURATION){pause();return}raf=requestAnimationFrame(tick)}
function play(){if(currentTime>=LessonModel.DURATION)renderFrame(0);if(playing)return;playing=true;lastTick=performance.now();updateControls();raf=requestAnimationFrame(tick)}
function seekTo(t){pause();return renderFrame(t)}
function playerState(){return {playing,current:currentTime,speed:rate,duration:LessonModel.DURATION,stage:window.frameDiagnostics?.model?.stage}}
function visibleTextBounds(){const r=svg.getBoundingClientRect();return [...svg.querySelectorAll('text')].filter(e=>{for(let n=e;n&&n!==svg.parentNode;n=n.parentElement){const c=getComputedStyle(n);if(c.display==='none'||c.visibility==='hidden'||Number(c.opacity)===0)return false}return !!e.textContent.trim()}).map(e=>{const b=e.getBBox(),m=e.getScreenCTM(),a=new DOMPoint(b.x,b.y).matrixTransform(m),z=new DOMPoint(b.x+b.width,b.y+b.height).matrixTransform(m);return {id:e.id,text:e.textContent,x:a.x-r.x,y:a.y-r.y,width:z.x-a.x,height:z.y-a.y,inside:a.x>=r.x-1&&a.y>=r.y-1&&z.x<=r.right+1&&z.y<=r.bottom+1}})}
async function exportPNG(t){pause();renderFrame(t);await document.fonts.ready;const clone=svg.cloneNode(true);clone.setAttribute('xmlns','http://www.w3.org/2000/svg');clone.setAttribute('width',String(LessonConfig.width));clone.setAttribute('height',String(LessonConfig.height));const xml=new XMLSerializer().serializeToString(clone),url=URL.createObjectURL(new Blob([xml],{type:'image/svg+xml;charset=utf-8'}));try{const image=new Image();await new Promise((resolve,reject)=>{image.onload=resolve;image.onerror=reject;image.src=url});const canvas=document.createElement('canvas');canvas.width=LessonConfig.width;canvas.height=LessonConfig.height;const ctx=canvas.getContext('2d');ctx.fillStyle='#fafbf9';ctx.fillRect(0,0,canvas.width,canvas.height);ctx.drawImage(image,0,0,canvas.width,canvas.height);return canvas.toDataURL('image/png')}finally{URL.revokeObjectURL(url)}}
$('play').onclick=()=>playing?pause():play();$('replay').onclick=()=>{pause();renderFrame(0);play()};$('seek').addEventListener('input',e=>seekTo(e.target.value));$('speed').onchange=e=>{rate=Number(e.target.value)};svg.addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();playing?pause():play()}if(e.code==='ArrowRight'){e.preventDefault();seekTo(currentTime+1)}if(e.code==='ArrowLeft'){e.preventDefault();seekTo(currentTime-1)}});document.addEventListener('visibilitychange',()=>{if(document.hidden)pause()});
const ready=(async()=>{await document.fonts.ready;renderFrame(0);updateControls();if(!new URLSearchParams(location.search).has('render')&&!matchMedia('(prefers-reduced-motion: reduce)').matches)play();return true})();
window.ready=ready;window.renderFrame=renderFrame;window.exportPNG=exportPNG;window.seekTo=seekTo;window.playerState=playerState;window.visibleTextBounds=visibleTextBounds;
