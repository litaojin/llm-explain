width="1680" height="1080" fill="#fafbf9"/><text x="80" y="42" font-size="18" fill="#137765" font-weight="400">第四部分 · Agent Loop / 动图 01 · 软件部件循环</text><text x="80" y="100" font-size="38" fill="#20313b" font-weight="650">Agent Loop：部件不动，消息在部件间循环</text><text x="80" y="148" font-size="24" fill="#63767b" font-weight="400">Context 保存历史，模型生成输出，运行程序选择继续调用工具还是返回回答。</text><rect x="350" y="210" width="1250" height="690" rx="10" fill="none" stroke="#d3dfd6" stroke-width="2"/><text x="380" y="255" font-size="23" fill="#137765" font-weight="650">Agent 系统 · 软件部件协作</text><rect id="component-user" x="60" y="430" width="240" height="155" rx="10" fill="#edf5ef" stroke="#d3dfd6" stroke-width="2"/><text x="82" y="470" font-size="27" fill="#20313b" font-weight="650">用户</text><text id="user-line1" x="82" y="507" font-size="23" fill="#20313b" font-weight="400">提出问题</text><text id="user-line2" x="82" y="544" font-size="23" fill="#20313b" font-weight="400">接收最终回答</text><rect id="component-context" x="420" y="300" width="440" height="145" rx="10" fill="#edf5ef" stroke="#d3dfd6" stroke-width="2"/><text x="442" y="340" font-size="27" fill="#20313b" font-weight="650">Context · 消息历史</text><text id="context-count" x="442" y="377" font-size="23" fill="#20313b" font-weight="400">用户消息、助手输出、工具结果</text><text id="context-last" x="442" y="414" font-size="23" fill="#20313b" font-weight="400">由运行程序保存与组装。</text><rect id="component-model" x="1040" y="300" width="440" height="145" rx="10" fill="white" stroke="#d3dfd6" stroke-width="2"/><text x="1062" y="340" font-size="27" fill="#20313b" font-weight="650">模型 · LLM</text><text id="model-round" x="1062" y="377" font-size="23" fill="#20313b" font-weight="400">接收当前 context</text><text id="model-action" x="1062" y="414" font-size="23" fill="#20313b" font-weight="400">生成工具请求，或最终回答。</text><rect id="component-runtime" x="1040" y="650" width="440" height="145" rx="10" fill="#edf5ef" stroke="#d3dfd6" stroke-width="2"/><text x="1062" y="690" font-size="27" fill="#2031 加到历史</text><text x="855" y="520" font-size="33" fill="#137765" font-weight="650">Agent Loop</text><text id="loop-count" x="805" y="567" font-size="23" fill="#63767b" font-weight="400">每轮使用更新后的 context</text><path id="route-answer" d="M1260 795 V862 H180 V600" fill="none" stroke="#137765" stroke-width="3" stroke-linejoin="round" marker-end="url(#green)"/><text x="420" y="847" font-size="23" fill="#137765" font-weight="650">输出为最终回答：返回用户，结束本次循环</text><rect x="80" y="920" width="1520" height="60" rx="10" fill="#edf5ef" stroke="none" stroke-width="2"/><text id="step-caption" x="105" y="960" font-size="26" fill="#137765" font-weight="650">循环由运行程序驱动；模型、消息历史与工具是协作部件，不是同一个东西。</text><text x="80" y="1015" font-size="18" fill="#63767b" font-weight="400">箭头表示调用或消息传递，不是业务步骤编号；用户追问会再次加入历史，必要时启动新一轮循环。</text><text x="80" y="1044" font-size="18" fill="#63767b" font-weight="400">这是预设教学流程，未调用真实模型或文件工具；context 有长度限制，工具细节在后续展开。</text><circle id="message-signal" cx="0" cy="0" r="10" fill="#137765" stroke="white" stroke-width="3" opacity="0"/></svg></div><div class="controls" aria-label="播放控制"><button id="play" type="button" aria-pressed="false">播放</button><button id="replay" type="button">重播</button><input id="seek" type="range" min="0" max="28" value="0" step="0.01" aria-label="动画时间"><span id="clock" aria-live="off">0 / 28 秒</span><label>倍速 <select id="speed" aria-label="播放速度"><option value="0.5">0.5×</option><option value="1" selected>1×</option><option value="1.5">1.5×</option><option value="2">2×</option></select></label></div><p class="note">教学示意：同一组部件完成两次工具循环，再将最终回答交给用户。模型和文件工具均未真实调用。　单次播放后停止。<noscript>交互需启用 JavaScript；可打开同目录的 GIF 观看完整过程。</noscript></p></main><script>const LessonConfig={"id":"agent-loop-overview","title":"Agent Loop：部件不动，消息在部件间循环","width":1680,"height":1080,"duration":28,"snapshots":[1.8,7.5,10.4,12.7,17,19,23.7,26],"caption":"教学示意：同一组部件完成两次工具循环，再将最终回答交给用户。模型和文件工具均未真实调用。"};</script><script>(function(root){const DURATION=28;const events=[{at:1.8,role:'user',content:'课程目录里的两份笔记分别讲什么？'},{at:6,role:'assistant',callId:'call-1',tool:'list_files',content:'查询课程目录'},{at:10.4,role:'tool',callId:'call-1',content:'预测.md、学习.md'},{at:14.8,role:'assistant',callId:'call-2',tool:'read_files',content:'读取两份笔记'},{at:19,role:'tool',callId:'call-2',content:'预测：固定参数下计算输出；学习：用 Loss 更新参数。'},{at:23.7,role:'assistant',content:'预测是在固定参数下计算输出；学习是根据目标与 Loss 更新参数。'}];
const steps=[
[0,.8,'question','user',null,'用户提出问题：课程目录里的两份笔记分别讲什么？'],
[.8,1.8,'question','context','question','用户问题沿输入路径加入 Context。'],
[1.8,2.8,'context','context',null,'Context 现在保留 1 条用户消息；程序准备调用模型。'],
[2.8,3.8,'model-input','model','input','第 1 次模型调用：程序把当前 Context 提供给模型。'],
[3.8,5.2,'model-decides','model',null,'模型尚不知道文件内容，先提出 list_files 工具请求。'],

[6,6.7,'record-request','runtime',null,'Runtime 记录助手工具请求：Context 由 1 条增加为 2 条。'],
[6.7,7.7,'dispatch','tools','request','Runtime 将工具名称与参数交给工具执行层。'],
[7.7,9.2,'execute','tools',null,'工具执行层查询目录；模型并不直接执行文件操作。'],
[9.2,10.4,'tool-result','context','result','目录结果返回：预测.md、学习.md；追加到 Context。'],

[14,14.8,'model-output','runtime','output','第二个工具请求返回 Runtime，不把文件名当成文件内容。'],

function stateAt(value){let t=Number(value);t=Number.isFinite(t)?Math.max(0,Math.min(DURATION,t)):0;const row=steps.find(s=>t>=s[0]&&t<s[1])||steps.at(-1);const history=events.filter(e=>e.at<=t).map(e=>({...e}));return {time:t,stage:row[2],active:row[3],caption:row[5],signal:row[4]?{route:row[4],progress:(t-row[0])/(row[1]-row[0])}:null,history,historyCount:history.length,modelCalls:[3.8,12.7,21.3].filter(x=>x<=t).length,toolCalls:[7.7,16].filter(x=>x<=t).length,done:t>=26,modelRound:t>=20.4?3:t>=11.8?2:t>=2.8?1:0};}
const model={DURATION,stateAt,events,steps};if(typeof module==='object'&&module.exports)module.exports=model;else root.LessonModel=model;})(typeof window==='object'?window:globalThis);
</script><script>const routes={question:'route-question',input:'route-input',output:'route-output',request:'route-request',result:'route-result',answer:'route-answer'};
function renderScene(s){const active={user:'component-user',context:'component-context',model:'component-model',runtime:'component-runtime',tools:'component-tools'};for(const id of Object.values(active)){$(id).setAttribute('stroke',id===active[s.active]?'#137765':'#d3dfd6');$(id).setAttribute('stroke-width',id===active[s.active]?'4':'2')}
text('context-count','历史共 '+s.historyCount+' 条 · 保留已有消息');const last=s.history.at(-1);text('context-last',!last?'等待用户问题':last.role==='tool'?(last.callId==='call-1'?'新增：目录查询结果':'新增：两份笔记内容'):last.role==='user'?'新增：用户问题':last.callId?'新增：助手工具请求':'新增：助手最终回答');
text('model-round',s.modelRound?'第 '+s.modelRound+' 次调用 · 读取更新的历史':'接收当前 context');text('model-action',s.modelRound===1?'需要信息：先查询目录':s.modelRound===2?'需要内容：再读取笔记':s.modelRound===3?'信息足够：生成最终回答':'生成工具请求，或最终回答。');
text('runtime-state',s.time>=23.7?'收到：最终回答':s.time>=14.8?'收到：read_files 请求':s.time>=6?'收到：list_files 请求':'接收并记录模型输出');text('tools-state',s.time>=19?'已返回：两份笔记内容':s.time>=16?'正在读取两份笔记':s.time>=10.4?'已返回：两个文件名':s.time>=7.7?'正在查询课程目录':'等待 Runtime 分派请求');
text('user-line1',s.done?'预测：参数固定':'提出问题');text('user-line2',s.done?'学习：更新参数':'总结两份笔记');text('step-caption',s.caption);text('loop-count','模型调用 '+s.modelCalls+' 次 · 工具执行 '+s.toolCalls+' 次');
for(const [name,id] of Object.entries(routes)){$(id).setAttribute('stroke-width',s.signal?.route===name?'5':'3');$(id).setAttribute('opacity',s.signal?.route===name?'1':'.4')}
const dot=$('message-signal');if(s.signal){const p=$(routes[s.signal.route]),q=p.getPointAtLength(p.getTotalLength()*s.signal.progress);dot.setAttribute('cx',q.x);dot.setAttribute('cy',q.y);dot.setAttribute('fill',s.signal.route==='result'?'#326a91':'#137765');dot.setAttribute('opacity','1')}else dot.setAttribute('opacity','0');return {active:s.active,route:s.signal?.route||null,historyCount:s.historyCount,componentCoordinates:[['context',420,300],['model',1040,300],['runtime',1040,650],['tools',420,650]]};}
</script><script>const svg=document.querySelector('svg'),$=id=>document.getElementById(id);
function text(id,value){const e=$(id);if(!e)throw Error('Missing SVG label '+id);e.textContent=String(value)}
function opacity(id,value){const e=$(id);if(!e)throw Error('Missing SVG group '+id);e.setAttribute('opacity',String(value))}
let currentTime=0,playing=false,rate=1,raf=0,lastTick=0;
function boundedTime(t){t=Number(t);return Number.isFinite(t)?Math.max(0,Math.min(LessonModel.DURATION,t)):0}
function renderFrame(t){currentTime=boundedTime(t);const state=LessonModel.stateAt(currentTime),scene=renderScene(state);$('seek').value=currentTime;$('clock').textContent=currentTime.toFixed(1)+' / '+LessonModel.DURATION+' 秒';window.frameDiagnostics={time:currentTime,model:state,scene};return window.frameDiagnostics}
function updateControls(){$('play').textContent=playing?'暂停':'播放';$('play').setAttribute('aria-pressed',String(playing))}
function pause(){playing=false;cancelAnimationFrame(raf);updateControls()}
function tick(now){if(!playing)return;const elapsed=Math.max(0,(now-lastTick)/1000);lastTick=now;renderFrame(currentTime+elapsed*rate);if(currentTime>=LessonModel.DURATION){pause();return}raf=requestAnimationFrame(tick)}

function seekTo(t){pause();return renderFrame(t)}

function visibleTextBounds(){const r=svg.getBoundingClientRect();return [...svg.querySelectorAll('text')].filter(e=>{for(let n=e;n&&n!==svg.parentNode;n=n.parentElement){const c=getComputedStyle(n);if(c.display==='none'||c.visibility==='hidden'||Number(c.opacity)===0)return false}return !!e.textContent.trim()}).map(e=>{const b=e.getBBox(),m=e.getScreenCTM(),a=new DOMPoint(b.x,b.y).matrixTransform(m),z=new DOMPoint(b.x+b.width,b.y+b.height).matrixTransform(m);return {id:e.id,text:e.textContent,x:a.x-r.x,y:a.y-r.y,width:z.x-a.x,height:z.y-a.y,inside:a.x>=r.x-1&&a.y>=r.y-1&&z.x<=r.right+1&&z.y<=r.bottom+1}})}
async function exportPNG(t){pause();renderFrame(t);await document.fonts.ready;const clone=svg.cloneNode(true);clone.setAttribute('xmlns','http://www.w3.org/2000/svg');clone.setAttribute('width',String(LessonConfig.width));clone.setAttribute('height',String(LessonConfig.height));const xml=new XMLSerializer().serializeToString(clone),url=URL.createObjectURL(new Blob([xml],{type:'image/svg+xml;charset=utf-8'}));try{const image=new Image();await new Promise((resolve,reject)=>{image.onload=resolve;image.onerror=reject;image.src=url});const canvas=document.createElement('canvas');canvas.width=LessonConfig.width;canvas.height=LessonConfig.height;const ctx=canvas.getContext('2d');ctx.fillStyle='#fafbf9';ctx.fillRect(0,0,canvas.width,canvas.height);ctx.drawImage(image,0,0,canvas.width,canvas.height);return canvas.toDataURL('image/png')}finally{URL.revokeObjectURL(url)}}
$('play').onclick=()=>playing?pause():play();$('replay').onclick=()=>{pause();renderFrame(0);play()};$('seek').addEventListener('input',e=>seekTo(e.target.value));$('speed').onchange=e=>{rate=Number(e.target.value)};svg.addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();playing?pause():play()}if(e.code==='ArrowRight'){e.preventDefault();seekTo(currentTime+1)}if(e.code==='ArrowLeft'){e.preventDefault();seekTo(currentTime-1)}});document.addEventListener('visibilitychange',()=>{if(document.hidden)pause()});
