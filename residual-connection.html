<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>残差连接：保留原表示，再加入新计算 · LLM Explain</title><style>*{box-sizing:border-box}body{margin:0;background:#fafbf9;color:#20313b;font-family:"Noto Sans CJK SC","Microsoft YaHei",sans-serif}main{max-width:1680px;margin:auto}.canvas{width:100%;overflow:auto}svg{display:block;width:100%;height:auto;min-width:720px}button,select{font:inherit;min-height:44px;padding:8px 15px;border:1px solid #d5dfd7;border-radius:6px;background:#fff;color:#137765;cursor:pointer}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #326a91;outline-offset:3px}.controls{display:flex;align-items:center;flex-wrap:wrap;gap:12px;padding:12px 20px;border-top:1px solid #d5dfd7}#seek{flex:1;min-width:140px;min-height:44px;accent-color:#137765}.note{padding:0 20px;margin:5px 0 18px;color:#596b72;font-size:13px;line-height:1.7}.scroll-hint{display:none}@media(max-width:720px){.scroll-hint{display:block;padding:10px 20px;margin:0;font-size:13px;color:#596b72}.controls{gap:8px}.controls label{display:inline-flex;align-items:center;gap:5px;min-height:44px}#seek{flex-basis:100%}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto}}</style></head><body><main><p class="scroll-hint">小屏可左右滑动图解；下方控件可暂停、拖动与倍速回看。</p><div class="canvas" aria-label="残差连接：保留原表示，再加入新计算"><svg xmlns="http://www.w3.org/2000/svg" width="1680" height="1080" viewBox="0 0 1680 1080" role="img" aria-labelledby="title"><title id="title">残差连接：保留原表示，再加入新计算</title><defs><marker id="ag" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#137765" /></marker><marker id="ab" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#326a91" /></marker><marker id="am" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#63767b" /></marker></defs><style>text{font-family:"Noto Sans CJK SC","Microsoft YaHei",sans-serif}*{box-sizing:border-box}</style><rect width="1680" height="1080" fill="#fafbf9" /><text x="80" y="42" font-size="17" fill="#137765" text-anchor="start" font-weight="400" id="e-4">第三部分 · Transformer 内部计算 / 动画 09 / 11</text><text x="80" y="100" font-size="38" fill="#20313b" text-anchor="start" font-weight="650" id="e-5">残差连接：保留原表示，再加入新计算</text><text x="80" y="148" font-size="24" fill="#63767b" text-anchor="start" font-weight="400" id="e-6">新结果不是“用 F(x) 替换 x”，而是 x 与 F(x) 相加；两路必须维度一致。</text><line x1="80" y1="177" x2="1600" y2="177" stroke="#d3dfd6" stroke-width="2" id="e-7" /><rect x="90" y="395" width="290" height="160" rx="10" fill="#edf5ef" stroke="#d3dfd6" stroke-width="1.8" id="e-8" /><text x="235" y="467" font-size="31" fill="#20313b" text-anchor="middle" font-weight="650" id="e-9">原表示 x</text><text x="235" y="501" font-size="31" fill="#20313b" text-anchor="middle" font-weight="400" id="e-10">[1, 2]</text><path d="M380 475 L455 475 L455 330 L590 330" fill="none" stroke="#137765" stroke-width="3" marker-end="url(#ag)" id="route-compute" data-reveal="split" opacity="0" data-from="x" data-to="F" /><rect x="600" y="245" width="420" height="170" rx="10" fill="white" stroke="#d3dfd6" stroke-width="1.8" id="e-12" data-reveal="compute" opacity="0" /><text x="810" y="322" font-size="30" fill="#137765" text-anchor="middle" font-weight="650" id="e-13" data-reveal="compute" opacity="0">本次子层计算 F(x)</text><text x="810" y="356" font-size="30" fill="#137765" text-anchor="middle" font-weight="400" id="e-14" data-reveal="compute" opacity="0">[0.5, −1]</text><path d="M1020 330 L1240 330 L1240 435" fill="none" stroke="#137765" stroke-width="3" marker-end="url(#ag)" id="route-update" data-reveal="compute" opacity="0" data-from="F" data-to="add" /><path d="M380 475 L420 475 L420 710 L1240 710 L1240 515" fill="none" stroke="#326a91" stroke-width="4" marker-end="url(#ab)" id="route-bypass" data-reveal="split" opacity="0" data-from="x" data-to="add" /><circle cx="1240" cy="475" r="34" fill="white" stroke="#137765" stroke-width="3" id="e-17" data-reveal="add" opacity="0" /><text x="1240" y="486" font-size="34" fill="#137765" text-anchor="middle" font-weight="650" id="e-18" data-reveal="add" opacity="0">+</text><path d="M1275 475 L1370 475" fill="none" stroke="#137765" stroke-width="3" marker-end="url(#ag)" id="route-output" data-reveal="output" opacity="0" data-from="add" data-to="new-representation" /><rect x="1380" y="385" width="235" height="180" rx="10" fill="#edf5ef" stroke="#d3dfd6" stroke-width="1.8" id="e-20" data-reveal="output" opacity="0" /><text x="1497.5" y="467" font-size="29" fill="#137765" text-anchor="middle" font-weight="650" id="e-21" data-reveal="output" opacity="0">新表示</text><text x="1497.5" y="501" font-size="29" fill="#137765" text-anchor="middle" font-weight="400" id="e-22" data-reveal="output" opacity="0">[1.5, 1]</text><text x="680" y="690" font-size="25" fill="#326a91" text-anchor="start" font-weight="400" id="e-23" data-reveal="split" opacity="0">原表示沿旁路保留，不被子层输出直接覆盖。</text><text x="120" y="825" font-size="33" fill="#20313b" text-anchor="start" font-weight="650" id="e-24" data-reveal="add" opacity="0">逐分量相加： [1, 2] + [0.5, −1] = [1.5, 1]</text><rect x="80" y="920" width="1520" height="60" rx="6" fill="#edf5ef" stroke="none" stroke-width="1.8" id="e-25" data-reveal="final" opacity="0" /><text x="105" y="959" font-size="26" fill="#137765" text-anchor="start" font-weight="650" id="e-26" data-reveal="final" opacity="0">残差连接描述的是表示相加，不是把参数加在一起，也不是更新模型权重。</text><text x="80" y="1014" font-size="18" fill="#63767b" text-anchor="start" font-weight="400" id="e-27">数值沿用上一张“花”的 MLP 示例；此图单独演示 x+F(x)，完整块的归一化位置见第 11 图。</text><text x="80" y="1044" font-size="18" fill="#63767b" text-anchor="start" font-weight="400" id="e-28">旁路也是可微计算路径；它有助于组织深层信息与梯度传递，但不保证任意深度都容易训练。</text><text id="stage-status" x="80" y="204" font-size="19" fill="#137765">原表示 x = [1, 2] 保持不变。</text><circle id="signal-0" r="7" fill="#137765" stroke="#fafbf9" stroke-width="2" opacity="0" data-signal="route-compute" cx="0" cy="0" /><circle id="signal-1" r="7" fill="#326a91" stroke="#fafbf9" stroke-width="2" opacity="0" data-signal="route-bypass" cx="0" cy="0" /><circle id="signal-2" r="7" fill="#137765" stroke="#fafbf9" stroke-width="2" opacity="0" data-signal="route-update" cx="0" cy="0" /><circle id="signal-3" r="7" fill="#137765" stroke="#fafbf9" stroke-width="2" opacity="0" data-signal="route-output" cx="0" cy="0" /></svg></div><div class="controls" aria-label="播放控制"><button id="play" type="button" aria-pressed="false">播放</button><button id="replay" type="button">重播</button><input id="seek" type="range" min="0" max="22" value="0" step="0.01" aria-label="动画时间"><span id="clock" aria-live="off">0 / 22 秒</span><label>倍速 <select id="speed" aria-label="播放速度"><option value="0.5">0.5×</option><option value="1" selected>1×</option><option value="1.5">1.5×</option><option value="2">2×</option></select></label></div><p class="note">固定教学参数与示意数据；路径信号只解释数据流，不代表真实张量执行时间。可暂停、拖动与重播。　单次播放后停止。<noscript>交互需启用 JavaScript；可打开同目录的 GIF 观看完整过程。</noscript></p></main><script>const LessonConfig={"id":"residual-connection","title":"残差连接：保留原表示，再加入新计算","width":1680,"height":1080,"duration":22,"caption":"固定教学参数与示意数据；路径信号只解释数据流，不代表真实张量执行时间。可暂停、拖动与重播。","snapshots":[0,4,8,12,16,22]};</script><script>(function(root,factory){if(typeof module==='object'&&module.exports)module.exports=factory();else root.LessonModel=factory();})(typeof window!=='undefined'?window:globalThis,function(){
'use strict';
const DURATION=22;
const DATA={"real_model":false,"convention":"row vectors: Q=H WQ; K=H WK; V=H WV","tokens":["这","朵","花","开"],"H":[[1,0],[0,1],[1,1],[2,1]],"WQ":[[1,0],[0,1]],"WK":[[1,0],[0,2]],"WV":[[1,1],[0,1]],"Q":[[1,0],[0,1],[1,1],[2,1]],"K":[[1,0],[0,2],[1,2],[2,2]],"V":[[1,1],[0,1],[1,2],[2,3]],"mask":[[true,false,false,false],[true,true,false,false],[true,true,true,false],[true,true,true,true]],"target_position":3,"single":{"raw":[0.7071067811865475,1.414213562373095,2.1213203435596424,2.82842712474619],"weights":[0.14002924504337802,0.28399540974126003,0.5759753452153619,0],"output":[0.7160045902587399,1.5759753452153618]},"matching":{"reverse":[0.575975345215362,0.28399540974126003,0.14002924504337802],"reverseOutput":[0.71600459025874,1.140029245043378]},"multi":{"heads":[{"wq":[1,0],"wk":[1,0],"wv":[1,0],"q":1,"k":[1,0,1],"v":[1,0,1],"weights":[0.4223187982515182,0.15536240349696362,0.4223187982515182],"output":0.8446375965030364,"head_dim":1},{"wq":[0,1],"wk":[0,2],"wv":[1,1],"q":1,"k":[0,2,2],"v":[1,1,2],"weights":[0.06337893833303762,0.4683105308334812,0.4683105308334812],"output":1.4683105308334812,"head_dim":1}],"concat":[0.8446375965030364,1.4683105308334812],"WO":[[1,0.5],[-0.5,1]],"output":[0.11048233108629579,1.8906293290849994]},"mlp":{"input":[1,2],"pre":[1,1,-1],"hidden":[1,1,0],"output":[0.5,-1],"W1":[[1,-1,0],[0,1,1]],"b1":[0,0,-3],"W2":[[0.5,0],[0,-1],[1,1]],"examples":[{"input":[1,0],"pre":[1,-1,-3],"hidden":[1,0,0],"output":[0.5,0]},{"input":[0,1],"pre":[0,1,-2],"hidden":[0,1,0],"output":[0,-1]},{"input":[1,2],"pre":[1,1,-1],"hidden":[1,1,0],"output":[0.5,-1]}]},"residual":{"input":[1,2],"update":[0.5,-1],"output":[1.5,1]},"norm":{"input":[1.5,1],"epsilon":1e-06,"gamma":[1,1],"rms":1.2747552706304062,"output":[1.1766964487687142,0.7844642991791427],"softmax":[0.6224593312018546,0.37754066879814546]},"block":{"type":"simplified decoder-only Pre-RMSNorm","residuals":[["h","add-attention"],["u","add-mlp"]],"equations":["u=h+Attention(RMSNorm(h))","h_next=u+MLP(RMSNorm(u))"]}};
const mul=(A,B)=>A.map(row=>B[0].map((_,j)=>row.reduce((s,v,k)=>s+v*B[k][j],0)));
const softmax=xs=>{const m=Math.max(...xs),e=xs.map(x=>Math.exp(x-m)),z=e.reduce((a,b)=>a+b,0);return e.map(x=>x/z)};
function calculate(){const input=[...DATA.residual.input],update=[...DATA.residual.update];return {input,branchInput:[...input],bypass:[...input],update,output:input.map((v,i)=>v+update[i]),parametersUpdated:false,endToEndNumeric:false};}
const STEPS=[[0, "input", "原表示 x = [1, 2] 保持不变。"], [3, "split", "同一个 x 分两路：一路进 F，另一路原样保留。"], [8, "compute", "固定参数算出 F(x) = [0.5, −1]；不是改写 x。"], [13, "add", "相同维度的两路逐分量相加；不拼接、不替换。"], [16, "output", "1+0.5=1.5；2+(−1)=1，得到新表示 [1.5, 1]。"], [19, "final", "完成：改变的是表示；没有更新任何模型权重。"]];
const REVEALS={"split": 3, "compute": 8, "add": 13, "output": 16, "final": 19};
const MOTIONS=[{"id": "signal-0", "path": "route-compute", "start": 3, "end": 8}, {"id": "signal-1", "path": "route-bypass", "start": 3, "end": 13}, {"id": "signal-2", "path": "route-update", "start": 8, "end": 13}, {"id": "signal-3", "path": "route-output", "start": 16, "end": 19}];
const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
function stateAt(value){let t=Number(value);t=Number.isFinite(t)?clamp(t,0,DURATION):0;
 let index=0;for(let i=0;i<STEPS.length;i++)if(t>=STEPS[i][0])index=i;
 const [start,stage,status]=STEPS[index],next=STEPS[index+1]?.[0]??start+1;
 const reveals=Object.fromEntries(Object.entries(REVEALS).map(([id,at])=>[id,t>=at]));
 const motions=MOTIONS.map(m=>({...m,progress:clamp((t-m.start)/(m.end-m.start),0,1),active:t>=m.start&&t<m.end}));
 return {time:t,stage,stageIndex:index,status,progress:clamp(t/STEPS.at(-1)[0],0,1),phase:stage==='final'?1:clamp((t-start)/(next-start),0,1),reveals,motions,math:JSON.parse(JSON.stringify(calculate()))};}
return {DURATION,stateAt};
});
</script><script>function renderScene(state){
 svg.setAttribute('data-stage',state.stage);svg.setAttribute('data-progress',String(state.progress));
 text('stage-status',state.status);
 for(const e of svg.querySelectorAll('[data-reveal]'))opacity(e.id,state.reveals[e.getAttribute('data-reveal')]?1:0);
 for(const m of state.motions){const route=$(m.path),point=route.getPointAtLength(route.getTotalLength()*m.progress),dot=$(m.id);dot.setAttribute('cx',point.x);dot.setAttribute('cy',point.y);opacity(m.id,m.active?1:0);}
 const vector=a=>'['+a.map(v=>String(v).replace('-','−')).join(', ')+']';
 text('e-10',vector(state.math.input));text('e-14',vector(state.math.update));text('e-22',vector(state.math.output));
 return {stage:state.stage,progress:state.progress,visible:Object.keys(state.reveals).filter(k=>state.reveals[k]),signals:state.motions.filter(m=>m.active).map(m=>m.id)};
}
</script><script>const svg=document.querySelector('svg'),$=id=>document.getElementById(id);
function text(id,value){const e=$(id);if(!e)throw Error('Missing SVG label '+id);e.textContent=String(value)}
function opacity(id,value){const e=$(id);if(!e)throw Error('Missing SVG group '+id);e.setAttribute('opacity',String(value))}
let currentTime=0,playing=false,rate=1,raf=0,lastTick=0;
function boundedTime(t){t=Number(t);return Number.isFinite(t)?Math.max(0,Math.min(LessonModel.DURATION,t)):0}
function renderFrame(t){currentTime=boundedTime(t);const state=LessonModel.stateAt(currentTime),scene=renderScene(state);$('seek').value=currentTime;$('clock').textContent=currentTime.toFixed(1)+' / '+LessonModel.DURATION+' 秒';window.frameDiagnostics={time:currentTime,model:state,scene};return window.frameDiagnostics}
function updateControls(){$('play').textContent=playing?'暂停':'播放';$('play').setAttribute('aria-pressed',String(playing))}
function pause(){playing=false;cancelAnimationFrame(raf);updateControls()}
function tick(now){if(!playing)return;const elapsed=Math.max(0,(now-lastTick)/1000);lastTick=now;renderFrame(currentTime+elapsed*rate);if(currentTime>=LessonModel.DURATION){pause();return}raf=requestAnimationFrame(tick)}
function play(){if(currentTime>=LessonModel.DURATION)renderFrame(0);if(playing)return;playing=true;lastTick=performance.now();updateControls();raf=requestAnimationFrame(tick)}
function seekTo(t){pause();return renderFrame(t)}
function playerState(){return {playing,current:currentTime,speed:rate,duration:LessonModel.DURATION,stage:window.frameDiagnostics?.model?.stage}}
function visibleTextBounds(){const r=svg.getBoundingClientRect();return [...svg.querySelectorAll('text')].filter(e=>{for(let n=e;n&&n!==svg.parentNode;n=n.parentElement){const c=getComputedStyle(n);if(c.display==='none'||c.visibility==='hidden'||Number(c.opacity)===0)return false}return !!e.textContent.trim()}).map(e=>{const b=e.getBBox(),m=e.getScreenCTM(),a=new DOMPoint(b.x,b.y).matrixTransform(m),z=new DOMPoint(b.x+b.width,b.y+b.height).matrixTransform(m);return {id:e.id,text:e.textContent,x:a.x-r.x,y:a.y-r.y,width:z.x-a.x,height:z.y-a.y,inside:a.x>=r.x-1&&a.y>=r.y-1&&z.x<=r.right+1&&z.y<=r.bottom+1}})}
async function exportPNG(t){pause();renderFrame(t);await document.fonts.ready;const clone=svg.cloneNode(true);clone.setAttribute('xmlns','http://www.w3.org/2000/svg');clone.setAttribute('width',String(LessonConfig.width));clone.setAttribute('height',String(LessonConfig.height));const xml=new XMLSerializer().serializeToString(clone),url=URL.createObjectURL(new Blob([xml],{type:'image/svg+xml;charset=utf-8'}));try{const image=new Image();await new Promise((resolve,reject)=>{image.onload=resolve;image.onerror=reject;image.src=url});const canvas=document.createElement('canvas');canvas.width=LessonConfig.width;canvas.height=LessonConfig.height;const ctx=canvas.getContext('2d');ctx.fillStyle='#fafbf9';ctx.fillRect(0,0,canvas.width,canvas.height);ctx.drawImage(image,0,0,canvas.width,canvas.height);return canvas.toDataURL('image/png')}finally{URL.revokeObjectURL(url)}}
$('play').onclick=()=>playing?pause():play();$('replay').onclick=()=>{pause();renderFrame(0);play()};$('seek').addEventListener('input',e=>seekTo(e.target.value));$('speed').onchange=e=>{rate=Number(e.target.value)};svg.addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();playing?pause():play()}if(e.code==='ArrowRight'){e.preventDefault();seekTo(currentTime+1)}if(e.code==='ArrowLeft'){e.preventDefault();seekTo(currentTime-1)}});document.addEventListener('visibilitychange',()=>{if(document.hidden)pause()});
const ready=(async()=>{await document.fonts.ready;renderFrame(0);updateControls();if(!new URLSearchParams(location.search).has('render')&&!matchMedia('(prefers-reduced-motion: reduce)').matches)play();return true})();
window.ready=ready;window.renderFrame=renderFrame;window.exportPNG=exportPNG;window.seekTo=seekTo;window.playerState=playerState;window.visibleTextBounds=visibleTextBounds;
</script></body></html>
