*{box-sizing:border-box}body{margin:0;background:#fafbf9;color:#20313b;font-family:"Noto Sans CJK SC","Microsoft YaHei",sans-serif}main{max-width:1440px;margin:10px auto 0}svg{display:block;width:100%;height:auto}nav{display:flex;align-items:center;gap:12px;flex-wrap:wrap;max-width:1100px;margin:8px auto 20px;padding:0 16px}button,select{min-height:44px;border:1px solid #b7c9c0;background:white;border-radius:8px;padding:8px 14px;font:inherit;color:#175d50;cursor:pointer}#play{background:#137765;color:white;min-width:105px}input{height:44px;flex:1;min-width:150px;accent-color:#137765}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #137765;outline-offset:3px}#clock{font:16px monospace;min-width:100px}body.render main{max-width:none;margin:0}body.render nav{display:none}</style></head><body><main>

<script>(function(root){
 const DURATION=21,parameters={w1:.5,w2:1,b1:0,v:.5,b2:0},coordinates={x1:[190,290],w1:[425,290],x2:[190,510],w2:[425,510],z:[690,400],b1:[690,245],h:[970,400],y:[1260,400],b2:[1260,245]};
 const clamp=(v,a=0,b=1)=>Math.min(b,Math.max(a,v));
 function stateAt(input){const time=clamp(Number.isFinite(input)?input:0,0,DURATION),stage=time<3?'single':time<6?'weighted':time<9?'activation':time<12?'output':time<18?'forward':'complete',visible=['x1','w1','z'];if(time>=3)visible.push('x2','w2','b1');if(time>=6)visible.push('h','hidden-boundary');if(time>=9)visible.push('y','b2');const x1=2,x2=1,c1=x1*parameters.w1,c2=x2*parameters.w2,z=time<3?c1:c1+c2+parameters.b1,h=time>=6?Math.max(0,z):null,y=time>=9?h*parameters.v+parameters.b2:null;const tracing=time>=12;return {time,stage,visible,parameters:{...parameters},coordinates,values:{x1,x2,c1,c2,z,h,y},revealed:{z:!tracing||time>=14.5,h:!tracing||time>=15.8,y:!tracing||time>=17.2},fade:{weighted:clamp((time-3)/.6),activation:clamp((time-6)/.6),output:clamp((time-9)/.6)},pulses:{inputs:tracing?clamp((time-12.5)/2):0,activation:tracing?clamp((time-14.5)/1.3):0,output:tracing?clamp((time-15.8)/1.4):0},parametersUpdated:false};}
 const model={DURATION,stateAt};if(typeof module==='object'&&module.exports)module.exports=model;else root.ForwardBuild=model;
})(typeof window==='object'?window:globalThis);
</script><script>const M=ForwardBuild,svg=document.querySelector('svg'),$=id=>document.getElementById(id);const renderMode=new URLSearchParams(location.search).has('render');if(renderMode)document.body.classList.add('render');let current=0,playing=false,last=null,speed=1,frameDiagnostics;
function text(id,value){$(id).textContent=String(value)}function opacity(id,n){$(id).setAttribute('opacity',String(n));$(id).setAttribute('aria-hidden',String(n===0))}
function drawSignal(id,paths,progress,value){const g=$(id),on=progress>0&&progress<1;g.setAttribute('opacity',on?'1':'0');let p;if(paths.length===2){const first=progress<.45,pct=first?progress/.45:(progress-.45)/.55;const route=$(paths[first?0:1]);p=route.getPointAtLength(route.getTotalLength()*pct)}else{const route=$(paths[0]);p=route.getPointAtLength(route.getTotalLength()*progress)}g.setAttribute('transform',`translate(${p.x} ${p.y})`);g.querySelector('text').textContent=String(value);return {visible:on,position:[p.x,p.y],value};}
function renderFrame(t){const s=M.stateAt(t);current=s.time;opacity('second-input',s.fade.weighted);opacity('activation',s.fade.activation);opacity('hidden-boundary',s.fade.activation);opacity('output',s.fade.output);text('input-name',s.stage==='single'?'输入 X':'输入 X₁');text('weight-name',s.stage==='single'?'× W=0.5':'× w₁=0.5');text('z-name',s.stage==='single'?'输出 Y':'加权和 z');const forward=s.time>=12,contributionsKnown=!forward||s.pulses.inputs>=.45;text('c1-value',contributionsKnown?s.values.c1:'—');text('c2-value',contributionsKnown?s.values.c2:'—');text('z-value',s.revealed.z?s.values.z:'—');text('h-value',s.revealed.h?'h='+s.values.h:'h=—');text('y-value',s.revealed.y?s.values.y:'—');text('sum-detail',s.revealed.z?'1 + 1 + 0 = 2':'汇合后再求和');
const subtitles={single:'01 / 05 · 单连接：输入先乘以一个权重',weighted:'02 / 05 · 加入第二个输入与偏置：两路贡献在这里汇合',activation:'03 / 05 · 接上 ReLU：加权求和与激活组成一个隐藏神经元',output:'04 / 05 · 接上输出层：上一层的输出，成为下一层的输入',forward:'05 / 05 · 正向传播：参数不变，沿完整计算图算出预测',complete:'05 / 05 · 正向传播完成：从输入到预测，保留完整计算结果'};text('step',subtitles[s.stage]);
let formula,explanation;if(s.stage==='single'){formula='Y = W*X = 0.5 × 2 = 1';explanation='从最简单的一条连接开始：权重决定输入的贡献。'}else if(s.stage==='weighted'){formula='z = w₁X₁ + w₂X₂ + b₁ = 0.5×2 + 1×1 + 0 = 2';explanation='保留原有连接，再加一条输入支路；中间结果现在称为加权和 z。'}else if(s.stage==='activation'){formula='h = ReLU(z) = max(0, 2) = 2';explanation='ReLU 让变换具有非线性；本例的 z 为正，因此保留原值。'}else if(s.stage==='output'){formula='ŷ = v h + b₂ = 0.5 × 2 + 0 = 1';explanation='隐藏输出 h 继续参与下一层计算，得到最终预测 ŷ。'}else if(s.time<14.5){formula='① 两路输入分别乘以各自的权重';explanation='2 × 0.5 = 1；1 × 1 = 1。输入保留在原位，计算信号向右传递。'}else if(s.time<15.8){formula='② 汇合并加偏置：z = 1 + 1 + 0 = 2';explanation='各条连接的贡献在同一个神经元汇合，然后送入激活函数。'}else if(s.time<17.2){formula='③ 激活输出：h = ReLU(2) = 2';explanation='h 成为下一层输入；再乘 v=0.5，并加上 b₂=0。'}else{formula='z = 2   →   h = ReLU(2) = 2   →   ŷ = 0.5×2 + 0 = 1';explanation='这就是一次正向传播：输入逐层变换，最终得到预测。'}text('formula',formula);text('explanation',explanation);text('scope-note',s.stage==='single'?'线性简化：此刻只演示一次乘法，暂时省略偏置与激活，不把它当作完整神经网络。':'参数始终保持固定；新增结构是教学展开，不是训练更新。Loss 与 BP 留在后续。');
for(const id of ['z','h','y']){$(id+'-shape').style.fill=forward&&s.revealed[id]?'#e0f0e5':'#f0f7f2';$(id+'-shape').style.stroke=forward&&s.revealed[id]?'#137765':'#cad6ce'}
const pulses=[drawSignal('signal-1',['route-x1','route-w1'],s.pulses.inputs,s.pulses.inputs<.45?2:1),drawSignal('signal-2',['route-x2','route-w2'],s.pulses.inputs,1),drawSignal('signal-h',['route-h'],s.pulses.activation,2),drawSignal('signal-y',['route-y'],s.pulses.output,2)];$('seek').value=String(Math.round(current*100));text('clock',current.toFixed(1)+' / '+M.DURATION+'s');$('play').textContent=playing?'暂停':current===M.DURATION?'演示结束':'播放';const ids=['x1','w1','z','x2','w2','b1','h','hidden-boundary','y','b2'],visible=ids.filter(id=>{let el=$(id);while(el&&el!==svg){if(el.getAttribute('opacity')==='0')return false;el=el.parentElement}return true});frameDiagnostics={stage:s.stage,time:s.time,visible,pulses,parameters:s.parameters,parametersUpdated:false,displayValues:{c1:$('c1-value').textContent,c2:$('c2-value').textContent,z:$('z-value').textContent,h:$('h-value').textContent,y:$('y-value').textContent},positions:{x1:[Number($('x1').querySelector('circle').getAttribute('cx')),Number($('x1').querySelector('circle').getAttribute('cy'))],z:[Number($('z-shape').getAttribute('cx')),Number($('z-shape').getAttribute('cy'))]},model:s};return frameDiagnostics;}
function textBoundaryFailures(){const r=svg.getBoundingClientRect();return [...svg.querySelectorAll('text')].filter(el=>{if(el.closest('.signal'))return false;let b=el.getBBox(),m=el.getScreenCTM();return [[b.x,b.y],[b.x+b.width,b.y],[b.x,b.y+b.height],[b.x+b.width,b.y+b.height]].some(([x,y])=>{const p=new DOMPoint(x,y).matrixTransform(m);return p.x<r.left-.5||p.x>r.right+.5||p.y<r.top-.5||p.y>r.bottom+.5})}).map(el=>el.textContent)}
async function exportPNG(t){renderFrame(t);const xml=new XMLSerializer().serializeToString(svg),url=URL.createObjectURL(new Blob([xml],{type:'image/svg+xml;charset=utf-8'})),im=new Image();try{im.src=url;await im.decode();const c=document.createElement('canvas');c.width=1440;c.height=860;c.getContext('2d').drawImage(im,0,0);return c.toDataURL('image/png').split(',')[1]}finally{URL.revokeObjectURL(url)}}
function seekTo(t){playing=false;last=null;renderFrame(t)}function playerState(){return {current,playing,speed,model:M.stateAt(current)}}
function tick(now){if(playing){if(last!==null)current=Math.min(M.DURATION,current+(now-last)/1000*speed);if(current>=M.DURATION)playing=false;renderFrame(current)}last=playing?now:null;requestAnimationFrame(tick)}
$('play').addEventListener('click',()=>{if(current===M.DURATION)current=0;playing=!playing;last=null;renderFrame(current)});$('replay').addEventListener('click',()=>{current=0;playing=true;last=null;renderFrame(current)});$('seek').addEventListener('input',e=>seekTo(Number(e.target.value)/100));$('speed').addEventListener('change',e=>{speed=Number(e.target.value);last=null});
const ready=document.fonts.ready.then(()=>{playing=!renderMode&&!matchMedia('(prefers-reduced-motion: reduce)').matches;renderFrame(0);requestAnimationFrame(tick)});
</script></body></html>
