<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MCP：动态接入外部工具 · LLM Explain</title><style>*{box-sizing:border-box}body{margin:0;background:#fafbf9;color:#20313b;font-family:"Noto Sans CJK SC","Microsoft YaHei",sans-serif}main{max-width:1680px;margin:auto}.canvas{width:100%;overflow:auto}svg{display:block;width:100%;height:auto;min-width:720px}button,select{font:inherit;min-height:44px;padding:8px 15px;border:1px solid #d5dfd7;border-radius:6px;background:#fff;color:#137765;cursor:pointer}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #326a91;outline-offset:3px}.controls{display:flex;align-items:center;flex-wrap:wrap;gap:12px;padding:12px 20px;border-top:1px solid #d5dfd7}#seek{flex:1;min-width:140px;min-height:44px;accent-color:#137765}.note{padding:0 20px;margin:5px 0 18px;color:#596b72;font-size:13px;line-height:1.7}.scroll-hint{display:none}@media(max-width:720px){.scroll-hint{display:block;padding:10px 20px;margin:0;font-size:13px;color:#596b72}.controls{gap:8px}.controls label{display:inline-flex;align-items:center;gap:5px;min-height:44px}#seek{flex-basis:100%}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto}}</style></head><body><main><p class="scroll-hint">小屏可左右滑动图解；下方控件可暂停、拖动与倍速回看。</p><div class="canvas" aria-label="MCP：动态接入外部工具"><svg xmlns="http://www.w3.org/2000/svg" width="1680" height="1080" viewBox="0 0 1680 1080" role="img"><title>MCP 动态扩展工具</title><defs><marker id="green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#137765"/></marker><marker id="blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#326a91"/></marker></defs><style>text{font-family:"Noto Sans CJK SC","Microsoft YaHei",sans-serif}</style><rect width="1680" height="1080" fill="#fafbf9"/><text  x="80" y="42" font-size="18" fill="#137765" font-weight="400">第四部分 · Agent Loop / 动图 04 · MCP 工具扩展</text><text  x="80" y="100" font-size="38" fill="#20313b" font-weight="650">MCP：工具不必都写在 Agent 程序里</text><text  x="80" y="148" font-size="24" fill="#63767b" font-weight="400">动态接入外部工具的标准协议：扩展可调用的能力，不改变模型参数。</text><rect  x="80" y="215" width="980" height="690" rx="9" fill="#f5f8f3" stroke="#d3dfd6" stroke-width="2"/><text  x="100" y="250" font-size="23" fill="#137765" font-weight="650">Agent 应用 · 原来的 Loop 保持不变</text><text  x="1170" y="225" font-size="22" fill="#326a91" font-weight="650">工具提供方 · 可本机，也可远程</text><path id="route-input" d="M500 365 H635" fill="none" stroke="#137765" stroke-width="3"  marker-end="url(#green)"/><path id="route-output" d="M835 440 V635" fill="none" stroke="#137765" stroke-width="3"  marker-end="url(#green)"/><path id="route-dispatch" d="M650 725 H515" fill="none" stroke="#137765" stroke-width="3"  marker-end="url(#green)"/><path id="route-result" d="M300 650 V485" fill="none" stroke="#326a91" stroke-width="3"  marker-end="url(#blue)"/><path d="M300 800 V865 H1140 V335" fill="none" stroke="#326a91" stroke-width="3" opacity=".35"/><path id="branch-file" d="M1140 335 H1225" stroke="#326a91" stroke-width="3" fill="none" opacity=".2" marker-end="url(#blue)"/><path id="branch-search" d="M1140 545 H1225" stroke="#326a91" stroke-width="3" fill="none" opacity=".2" marker-end="url(#blue)"/><path id="branch-business" d="M1140 755 H1225" stroke="#326a91" stroke-width="3" fill="none" opacity=".2" marker-end="url(#blue)"/><path id="route-plug-file" d="M300 800 V865 H1140 V335 H1225" fill="none" stroke="#326a91" stroke-width="3" opacity="0" marker-end="url(#blue)"/><path id="route-plug-search" d="M300 800 V865 H1140 V545 H1225" fill="none" stroke="#326a91" stroke-width="3" opacity="0" marker-end="url(#blue)"/><path id="route-plug-business" d="M300 800 V865 H1140 V755 H1225" fill="none" stroke="#326a91" stroke-width="3" opacity="0" marker-end="url(#blue)"/><path id="route-search-call" d="M300 800 V865 H1140 V545 H1225" fill="none" stroke="#326a91" stroke-width="3" opacity="0" marker-end="url(#blue)"/><path id="route-search-result" d="M1240 545 H1140 V865 H300 V815" fill="none" stroke="#326a91" stroke-width="3" opacity="0" marker-end="url(#blue)"/><rect id="component-context" x="100" y="270" width="400" height="200" rx="9" fill="white" stroke="#d3dfd6" stroke-width="2"/><text  x="122" y="308" font-size="26" fill="#20313b" font-weight="650">Context · 输入与工具说明</text><text  x="122" y="346" font-size="22" fill="#20313b" font-weight="400">本地：list_files</text><text id="tools-line1" x="122" y="378" font-size="21" fill="#63767b" font-weight="400">MCP：尚未接入</text><text id="tools-line2" x="122" y="407" font-size="21" fill="#326a91" font-weight="400"></text><text id="context-state" x="122" y="445" font-size="21" fill="#137765" font-weight="400">可用 Tools：1 项</text><rect id="component-model" x="650" y="290" width="370" height="150" rx="9" fill="white" stroke="#d3dfd6" stroke-width="2"/><text  x="672" y="328" font-size="27" fill="#20313b" font-weight="650">模型 · LLM</text><text  x="672" y="368" font-size="22" fill="#63767b" font-weight="400">固定参数，读取当前输入</text><text id="model-state" x="672" y="407" font-size="22" fill="#137765" font-weight="400">问题：查课程笔记</text><rect id="component-runtime" x="650" y="650" width="370" height="150" rx="9" fill="white" stroke="#d3dfd6" stroke-width="2"/><text  x="672" y="690" font-size="26" fill="#20313b" font-weight="650">Runtime · 循环控制</text><text id="runtime-state" x="672" y="730" font-size="22" fill="#63767b" font-weight="400">提出调用 → 分派执行</text><text  x="672" y="770" font-size="22" fill="#63767b" font-weight="400">接收结果，再交给模型</text><rect id="component-tools" x="100" y="650" width="400" height="150" rx="9" fill="white" stroke="#d3dfd6" stroke-width="2"/><text  x="122" y="690" font-size="27" fill="#20313b" font-weight="650">工具接入层</text><text  x="122" y="730" font-size="22" fill="#137765" font-weight="400">本地函数 + MCP 扩展工具</text><text  x="122" y="770" font-size="22" fill="#63767b" font-weight="400">按统一协议对接外部能力</text><text  x="430" y="530" font-size="30" fill="#137765" font-weight="650">Loop 不变</text><text  x="430" y="574" font-size="24" fill="#63767b" font-weight="400">工具来源可以扩展</text><text  x="590" y="848" font-size="23" fill="#326a91" font-weight="650">MCP · 标准工具扩展协议</text><g id="provider-file" opacity=".4"><rect id="provider-box-file" x="1240" y="260" width="360" height="150" rx="9" fill="white" stroke="#d3dfd6" stroke-width="2"/><text  x="1262" y="299" font-size="27" fill="#326a91" font-weight="650">文件工具</text><text  x="1262" y="339" font-size="24" fill="#20313b" font-weight="650">read_files</text><text id="provider-state-file" x="1262" y="380" font-size="21" fill="#63767b" font-weight="400">尚未接入</text></g><g id="provider-search" opacity=".4"><rect id="provider-box-search" x="1240" y="470" width="360" height="150" rx="9" fill="white" stroke="#d3dfd6" stroke-width="2"/><text  x="1262" y="509" font-size="27" fill="#326a91" font-weight="650">搜索工具</text><text  x="1262" y="549" font-size="24" fill="#20313b" font-weight="650">search_notes</text><text id="provider-state-search" x="1262" y="590" font-size="21" fill="#63767b" font-weight="400">尚未接入</text></g><g id="provider-business" opacity=".4"><rect id="provider-box-business" x="1240" y="680" width="360" height="150" rx="9" fill="white" stroke="#d3dfd6" stroke-width="2"/><text  x="1262" y="719" font-size="27" fill="#326a91" font-weight="650">业务工具</text><text  x="1262" y="759" font-size="24" fill="#20313b" font-weight="650">query_status</text><text id="provider-state-business" x="1262" y="800" font-size="21" fill="#63767b" font-weight="400">尚未接入</text></g><circle id="message-signal" r="9" fill="#137765" stroke="white" stroke-width="3" opacity="0"/><rect  x="80" y="925" width="1520" height="60" rx="9" fill="#edf5ef" stroke="#d3dfd6" stroke-width="2"/><text id="step-caption" x="102" y="964" font-size="24" fill="#137765" font-weight="650"></text><text  x="80" y="1017" font-size="18" fill="#63767b" font-weight="400">本课只讲工具扩展：连接、工具声明、请求和结果均为预设教学示意，未连接真实 MCP 服务或调用模型。</text><text  x="80" y="1047" font-size="18" fill="#63767b" font-weight="400">工具需由应用配置连接，并非自动接入；MCP 不等于 Agent Loop，也不只提供工具。本课不展开其他能力或协议细节。</text></svg></div><div class="controls" aria-label="播放控制"><button id="play" type="button" aria-pressed="false">播放</button><button id="replay" type="button">重播</button><input id="seek" type="range" min="0" max="28" value="0" step="0.01" aria-label="动画时间"><span id="clock" aria-live="off">0 / 28 秒</span><label>倍速 <select id="speed" aria-label="播放速度"><option value="0.5">0.5×</option><option value="1" selected>1×</option><option value="1.5">1.5×</option><option value="2">2×</option></select></label></div><p class="note">第四部分第 4 课：MCP 作为工具调用的延伸。所有连接与结果为预设示意，不连接真实服务，不调用真实模型。工具需应用配置，MCP 还支持工具以外的能力。　单次播放后停止。<noscript>交互需启用 JavaScript；可打开同目录的 GIF 观看完整过程。</noscript></p></main><script>const LessonConfig={"id":"mcp-tool-extension","title":"MCP：动态接入外部工具","width":1680,"height":1080,"duration":28,"snapshots":[4.8,6.8,8,10,12.5,15,18.5,20,21.5,22.5,25,26],"caption":"第四部分第 4 课：MCP 作为工具调用的延伸。所有连接与结果为预设示意，不连接真实服务，不调用真实模型。工具需应用配置，MCP 还支持工具以外的能力。"};</script><script>(function(root){const DURATION=28;const phases=[
[0,2,'local',null,'原来的 Agent Loop 已能调用本地工具；本例开始只有 list_files。'],
[2,4,'extend',null,'需要更多能力时，不必把所有工具实现都写进 Agent 应用。'],
[4,5.5,'connect-file','plug-file','应用先配置并建立连接，通过 MCP 接入外部文件工具。'],
[5.5,7,'discover-file',null,'获取文件工具说明，更新提供给模型的 Tools 声明。'],
[7,8.5,'connect-search','plug-search','再按相同协议连接搜索工具；原来的循环部件不变。'],
[8.5,9.5,'discover-search',null,'接入 search_notes：工具能力扩展，不是修改模型参数。'],
[9.5,11,'connect-business','plug-business','业务工具也可按相同接入方式提供能力。'],
[11,12,'discover-business',null,'应用获取业务工具说明；本例新增 query_status。'],
[12,13.5,'ready',null,'可用 Tools 已更新；下一次模型调用才能看到这些新能力。'],
[13.5,14.7,'model-input','input','应用把更新后的 Tools 与当前 Context 提供给模型。'],
[14.7,16,'choose',null,'模型为“查课程笔记”选择 search_notes，而不是自己连接工具。'],
[16,17,'model-output','output','模型向 Runtime 提出工具请求；原来的 Agent Loop 继续工作。'],
[17,18,'dispatch','dispatch','Runtime 将请求交给工具接入层，而不是让模型直接执行。'],
[18,19.3,'mcp-call','search-call','应用通过 MCP 调用已经接入的搜索能力。'],
[19.3,20.4,'provider-executes',null,'外部工具提供方处理搜索；具体执行发生在工具实现中。'],
[20.4,22,'mcp-result','search-result','搜索结果经接入层返回；MCP 标准化的是这段对接。'],
[22,23,'append-result','result','结果加入 Context，作为后续模型调用的依据。'],
[23,24,'next-model','input','模型再次读取包含搜索结果的 Context。'],
[24,26,'answer',null,'模型根据返回结果回答；Loop 不变，扩展的是可调用的工具来源。'],
[26,28,'done',null,'MCP：动态接入外部工具的标准协议；不是给模型安装新参数。']];
function stateAt(value){let t=Number(value);t=Number.isFinite(t)?Math.max(0,Math.min(DURATION,t)):0;const p=phases.find(x=>t>=x[0]&&t<x[1])||phases.at(-1);const availableTools=['list_files',...(t>=6.5?['read_files']:[]),...(t>=9.5?['search_notes']:[]),...(t>=12?['query_status']:[])];return {time:t,stage:p[2],caption:p[4],connected:{file:t>=5.5,search:t>=8.5,business:t>=11},availableTools,modelInputTools:t>=13.5?['list_files','read_files','search_notes','query_status']:['list_files'],selectedTool:t>=14.7?'search_notes':null,resultVisible:t>=22,contextHasResult:t>=23,answered:t>=24.8,modelCalls:t>=23?2:t>=13.5?1:0,modelParametersChanged:false,actualMcpConnection:false,signal:p[3]?{route:p[3],progress:(t-p[0])/(p[1]-p[0])}:null,done:t>=26}}
const model={DURATION,stateAt,phases};if(typeof module==='object'&&module.exports)module.exports=model;else root.LessonModel=model;})(typeof window==='object'?window:globalThis);
</script><script>const routes=['input','output','dispatch','result','plug-file','plug-search','plug-business','search-call','search-result'];
function renderScene(s){for(const key of ['file','search','business']){const connected=s.connected[key];opacity('provider-'+key,connected?1:.4);text('provider-state-'+key,connected?'已配置并连接':'尚未接入');$('provider-box-'+key).setAttribute('stroke',connected?'#326a91':'#d3dfd6');$('branch-'+key).setAttribute('opacity',connected?'.8':'.2')}
text('tools-line1',s.availableTools.includes('read_files')?'MCP：read_files':'MCP：尚未接入');text('tools-line2',s.availableTools.filter(x=>['search_notes','query_status'].includes(x)).join(' · '));text('context-state',s.contextHasResult?'已加入搜索结果，供模型读取':'可用 Tools：'+s.availableTools.length+' 项');text('model-state',s.answered?'查到：学习.md、预测.md':s.modelCalls===2?'读取搜索结果，生成回答':s.selectedTool?'选择：search_notes':'问题：查课程笔记');text('runtime-state',s.answered?'返回用户，结束本轮':s.stage==='mcp-call'?'交给已接入的 MCP 工具':s.resultVisible?'工具结果返回，再次循环':'提出调用 → 分派执行');text('step-caption',s.caption);
for(const name of routes){const active=s.signal?.route===name;opacity('route-'+name,active?1:name.startsWith('plug-')||name.startsWith('search-')?0:.35);$('route-'+name).setAttribute('stroke-width',active?'4':'3')}
for(const key of ['context','model','runtime','tools']){$('component-'+key).setAttribute('stroke','#d3dfd6');$('component-'+key).setAttribute('stroke-width','2')}const active=s.stage==='choose'||s.stage==='answer'||s.stage==='next-model'?'model':s.stage==='model-output'||s.stage==='dispatch'?'runtime':s.stage==='append-result'||s.stage==='model-input'||s.stage==='ready'?'context':'tools';$('component-'+active).setAttribute('stroke','#137765');$('component-'+active).setAttribute('stroke-width','4');
if(s.stage==='provider-executes'){$('provider-box-search').setAttribute('stroke','#137765');text('provider-state-search','正在查询课程笔记')}if(s.resultVisible){text('provider-state-search','返回：学习.md、预测.md')}
const dot=$('message-signal');if(s.signal){const p=$('route-'+s.signal.route),pt=p.getPointAtLength(p.getTotalLength()*s.signal.progress);dot.setAttribute('cx',pt.x);dot.setAttribute('cy',pt.y);dot.setAttribute('fill',s.signal.route.includes('result')?'#326a91':'#137765');opacity('message-signal',1)}else opacity('message-signal',0);return {availableTools:s.availableTools,loopUnchanged:true,modelParametersChanged:false,actualMcpConnection:false,answered:s.answered,resultVisible:s.resultVisible}}
</script><script>const svg=document.querySelector('svg'),$=id=>document.getElementById(id);
function text(id,value){const e=$(id);if(!e)throw Error('Missing SVG label '+id);e.textContent=String(value)}
function opacity(id,value){const e=$(id);if(!e)throw Error('Missing SVG group '+id);e.setAttribute('opacity',String(value))}
let currentTime=0,playing=false,rate=1,raf=0,lastTick=0;
function boundedTime(t){t=Number(t);return Number.isFinite(t)?Math.max(0,Math.min(LessonModel.DURATION,t)):0}
function renderFrame(t){currentTime=boundedTime(t);const state=LessonModel.stateAt(currentTime),scene=renderScene(state);$('seek').value=currentTime;$('clock').textContent=currentTime.toFixed(1)+' / '+LessonModel.DURATION+' 秒';window.frameDiagnostics={time:currentTime,model:state,scene};return window.frameDiagnostics}
function updateControls(){$('play').textContent=playing?'暂停':'播放';$('play').setAttribute('aria-pressed',String(playing))}
function pause(){playing=false;cancelAnimationFrame(raf);updateControls()}
function tick(now){if(!playing)return;const elapsed=Math.max(0,(now-lastTick)/1000);lastTick=now;renderFrame(currentTime+elapsed*rate);if(currentTime>=LessonModel.DURATION){pause();return}raf=requestAnimationFrame(tick)}
function play(){if(currentTime>=LessonModel.DURATION)renderFrame(0);if(playing)return;playing=true;lastTick=performance.now();updateControls();raf=requestAnimationFrame(tick)}
function seekTo(t){pause();return renderFrame(t)}
function playerState(){return {playing,current:currentTime,speed:rate,duration:LessonModel.DURATION,stage:window.frameDiagnostics?.model?.stage}}
function visibleTextBounds(){const r=svg.getBoundingClientRect();return [...svg.querySelectorAll('text')].filter(e=>{for(let n=e;n&&n!==svg.parentNode;n=n.parentElement){const c=getComputedStyle(n);if(c.display==='none'||c.visibility==='hidden'||Number(c.opacity)===0)return false}return !!e.textContent.trim()}).map(e=>{const b=e.getBBox(),m=e.getScreenCTM(),a=new DOMPoint(b.x,b.y).matrixTransform(m),z=new DOMPoint(b.x+b.width,b.y+b.height).matrixTransform(m);return {id:e.id,text:e.textContent,x:a.x-r.x,y:a.y-r.y,width:z.x-a.x,height:z.y-a.y,inside:a.x>=r.x-1&&a.y>=r.y-1&&z.x<=r.right+1&&z.y<=r.bottom+1}})}
async function exportPNG(t){pause();renderFrame(t);await document.fonts.ready;const clone=svg.cloneNode(true);clone.setAttribute('xmlns','http://www.w3.org/2000/svg');clone.setAttribute('width',String(LessonConfig.width));clone.setAttribute('height',String(LessonConfig.height));const xml=new XMLSerializer().serializeToString(clone),url=URL.createObjectURL(new Blob([xml],{type:'image/svg+xml;charset=utf-8'}));try{const image=new Image();await new Promise((resolve,reject)=>{image.onload=resolve;image.onerror=reject;image.src=url});const canvas=document.createElement('canvas');canvas.width=LessonConfig.width;canvas.height=LessonConfig.height;const ctx=canvas.getContext('2d');ctx.fillStyle='#fafbf9';ctx.fillRect(0,0,canvas.width,canvas.height);ctx.drawImage(image,0,0,canvas.width,canvas.height);return canvas.toDataURL('image/png')}finally{URL.revokeObjectURL(url)}}
$('play').onclick=()=>playing?pause():play();$('replay').onclick=()=>{pause();renderFrame(0);play()};$('seek').addEventListener('input',e=>seekTo(e.target.value));$('speed').onchange=e=>{rate=Number(e.target.value)};svg.addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();playing?pause():play()}if(e.code==='ArrowRight'){e.preventDefault();seekTo(currentTime+1)}if(e.code==='ArrowLeft'){e.preventDefault();seekTo(currentTime-1)}});document.addEventListener('visibilitychange',()=>{if(document.hidden)pause()});
const ready=(async()=>{await document.fonts.ready;renderFrame(0);updateControls();if(!new URLSearchParams(location.search).has('render')&&!matchMedia('(prefers-reduced-motion: reduce)').matches)play();return true})();
window.ready=ready;window.renderFrame=renderFrame;window.exportPNG=exportPNG;window.seekTo=seekTo;window.playerState=playerState;window.visibleTextBounds=visibleTextBounds;
</script></body></html>
