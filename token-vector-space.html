<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Token、向量与空间位置</title><style>*{box-sizing:border-box}body{margin:0;background:#fafbf9;color:#20313b;font-family:"Noto Sans CJK SC","Microsoft YaHei",sans-serif}main{max-width:1440px;margin:12px auto 0}canvas{display:block;width:100%;height:auto}nav{display:flex;gap:12px;align-items:center;flex-wrap:wrap;max-width:1050px;margin:8px auto;padding:0 22px}button,select{min-height:44px;border:1px solid #b7c9c0;background:white;border-radius:8px;padding:8px 14px;font:inherit;cursor:pointer;color:#175d50}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #137765;outline-offset:3px}#play{background:#137765;color:white;border-color:#137765;min-width:105px}input{flex:1;min-width:140px;height:44px;accent-color:#137765}#clock{min-width:80px;font:16px monospace}p{font-size:14px;color:#64737c;text-align:center;padding:0 16px}body.render main{margin:0;max-width:none}body.render nav,body.render p{display:none}</style></head><body><main><canvas id="scene" width="1440" height="780" aria-label="Token 对应示意向量，再由该向量坐标确定空间中的点。三维玩具示例，非真实模型数据。"></canvas></main><nav aria-label="播放控制"><button id="play">暂停</button><button id="replay">重新播放</button><input id="seek" type="range" min="0" max="1400" value="0" aria-label="动画进度"><select id="speed" aria-label="播放速度"><option value=".75">0.75×</option><option value="1" selected>1×</option><option value="1.5">1.5×</option><option value="2">2×</option></select><span id="clock"></span></nav><p>三维玩具向量示意，非真实模型数据。可暂停、拖动、重播或调速；手机建议横屏观看。</p><script>(function(root){
 const ITEMS=[{token:'锄',vector:[.12,-.34,.56],labelOffset:[14,15]},{token:'禾',vector:[-.28,.63,.18],labelOffset:[16,4]},{token:'耕',vector:[.42,-.25,.40],labelOffset:[16,12]},{token:'铲',vector:[-.12,-.60,.47],labelOffset:[14,0]},{token:'苗',vector:[-.44,.48,.30],labelOffset:[-44,-10]},{token:'稻',vector:[-.18,.80,.04],labelOffset:[-50,8]}];
 const LEAD=1,FIRST=2.5,REST=1.5,FINISH_START=LEAD+FIRST+(ITEMS.length-1)*REST,DURATION=FINISH_START+3;
 function project(v){const[x,y,z]=v;return [1020+200*(x-.6*y),443+200*(.3*x+.5*y-z)];}
 function coordinatePath(v){const[x,y,z]=v;return [project([0,0,0]),project([x,0,0]),project([x,y,0]),project([x,y,z])];}
 function getState(seconds){
  const t=Math.max(0,Math.min(DURATION,Number.isFinite(seconds)?seconds:0)),finished=t>=FINISH_START,elapsed=Math.max(0,t-LEAD);
  const index=finished?ITEMS.length-1:elapsed<FIRST?0:Math.min(ITEMS.length-1,1+Math.floor((elapsed-FIRST)/REST));
  const start=LEAD+(index===0?0:FIRST+(index-1)*REST),span=index===0?FIRST:REST,progress=t<LEAD?0:finished?1:Math.max(0,Math.min(1,(t-start)/span));
  const stage=t<LEAD?'ready':finished?'finished':progress<.2?'token':progress<.45?'vector':progress<.9?'locating':'placed';
  const {token,vector}=ITEMS[index];return {index,token,vector:vector.slice(),point:project(vector),stage,progress,finished,showVector:progress>=.2||finished,placedCount:finished?ITEMS.length:index+(progress>=.9?1:0)};
 }
 const api={ITEMS,LEAD,FIRST,REST,FINISH_START,DURATION,project,coordinatePath,getState};if(typeof module==='object'&&module.exports)module.exports=api;else root.EmbeddingModel=api;
})(typeof window==='object'?window:globalThis);
</script><script>
const cv=document.getElementById('scene'),ctx=cv.getContext('2d'),M=EmbeddingModel;
const F='"Noto Sans CJK SC","Microsoft YaHei",sans-serif',MONO='"DejaVu Sans Mono",monospace',INK='#20313b',MUTED='#64737c',GREEN='#137765',DIM='#c9d5cd';let clipped=[];
function txt(s,x,y,size=20,color=INK,align='left',weight=400,font=F){ctx.fillStyle=color;ctx.font=weight+' '+size+'px '+font;ctx.textAlign=align;ctx.textBaseline='middle';const m=ctx.measureText(s),left=align==='center'?x-m.width/2:align==='right'?x-m.width:x;if(left<0||left+m.width>1440||y-m.actualBoundingBoxAscent<0||y+m.actualBoundingBoxDescent>780)clipped.push(s);ctx.fillText(s,x,y);}
function box(x,y,w,h,fill,stroke,width=1.5,r=10){ctx.beginPath();ctx.roundRect(x,y,w,h,r);ctx.fillStyle=fill;ctx.fill();ctx.strokeStyle=stroke;ctx.lineWidth=width;ctx.stroke();}
function line(points,color=MUTED,width=2.2,arrow=false,dash=[]){ctx.save();ctx.beginPath();ctx.moveTo(...points[0]);points.slice(1).forEach(p=>ctx.lineTo(...p));ctx.strokeStyle=color;ctx.lineWidth=width;ctx.lineCap='round';ctx.lineJoin='round';ctx.setLineDash(dash);ctx.stroke();ctx.setLineDash([]);if(arrow){const e=points.at(-1),a=points.at(-2),ang=Math.atan2(e[1]-a[1],e[0]-a[0]);ctx.beginPath();for(const sign of [-1,1]){ctx.moveTo(e[0]-11*Math.cos(ang+sign*.5),e[1]-11*Math.sin(ang+sign*.5));ctx.lineTo(...e);}ctx.stroke();}ctx.restore();}
function dot(x,y,r=6,color=GREEN){ctx.beginPath();ctx.arc(x,y,r,0,2*Math.PI);ctx.fillStyle=color;ctx.fill();}
function mix(a,b,t){return [a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t]}
function format(v){return '['+v.map(n=>n.toFixed(2)).join(', ')+']'}
window.renderFrame=function(t){
 const s=M.getState(t);clipped=[];ctx.clearRect(0,0,1440,780);ctx.fillStyle='#fafbf9';ctx.fillRect(0,0,1440,780);
 txt('同一个 Token：一串数字，也是空间中的一个点',100,78,35,INK,'left',650);
 txt('Token → 向量 → 按坐标定位；向量和点，是同一表示的两种看法。',100,124,21,MUTED);
 txt('示例 token（逐字示意）',100,164,18,MUTED);
 M.ITEMS.forEach((item,i)=>{box(100+i*64,188,52,50,i===s.index?'#e6f5ef':'#edf1f3',i===s.index?GREEN:'#d6dfe3',i===s.index?2:1.3,8);txt(item.token,126+i*64,213,25,i===s.index?GREEN:INK,'center',500);});
 txt('Token',165,300,21,MUTED,'center');txt('向量（3维玩具示例）',495,300,21,MUTED,'center');
 box(115,330,100,90,'#edf1f3',s.stage==='token'?GREEN:'#c5d0d5',s.stage==='token'?2.5:1.5);txt(s.token,165,375,39,INK,'center',550);
 line([[240,375],[308,375]],s.stage==='vector'?GREEN:MUTED,2.4,true);txt('查表',274,445,17,MUTED,'center');
 box(335,330,320,90,s.showVector?'#e6f5ef':'#fff',s.showVector?GREEN:DIM,s.showVector?2:1.5);txt(s.showVector?format(s.vector):'…',495,375,22,s.showVector?GREEN:MUTED,'center',400,MONO);
 line([[680,375],[735,375]],s.stage==='locating'?GREEN:MUTED,2.4,true);txt('按坐标定位',700,445,16,MUTED,'center');
 box(755,185,585,390,'#fff',DIM,1.5,14);txt('向量空间 · 三维示意',780,215,21,MUTED);txt('斜投影显示，点位由左侧向量直接计算',780,246,16,'#89949a');
 const origin=M.project([0,0,0]),axes=[M.project([.9,0,0]),M.project([0,.9,0]),M.project([0,0,.85])];axes.forEach(e=>line([origin,e],'#d1d9d4',1.6,true));
 txt('0',1007,463,15,'#9aa8a0','center',400,MONO);txt('d₁',1220,505,18,MUTED,'center');txt('d₂',886,554,18,MUTED,'center');txt('d₃',994,264,18,MUTED,'center');
 if(s.finished){[[0,2],[0,3],[1,4],[1,5]].forEach(([a,b])=>line([M.project(M.ITEMS[a].vector),M.project(M.ITEMS[b].vector)],'#b4cbbf',1.5,false,[4,5]));}
 let locator=null;
 if(s.stage==='locating'||s.stage==='placed'){
  const points=M.coordinatePath(s.vector),q=s.stage==='placed'?1:(s.progress-.45)/.45;
  for(let i=0;i<3;i++){const f=Math.max(0,Math.min(1,q*3-i));if(f>0){const end=mix(points[i],points[i+1],f);line([points[i],end],GREEN,2,false,[4,4]);if(f<1||i===2)locator=end;}}
  if(s.stage==='locating'&&locator)dot(...locator,7);
 }
 for(let i=0;i<s.placedCount;i++){const item=M.ITEMS[i],point=M.project(item.vector),active=i===s.index;dot(...point,active?8:6,active?GREEN:'#6e9d86');txt(item.token,point[0]+item.labelOffset[0],point[1]+item.labelOffset[1],27,active?GREEN:INK,'left',active?600:400);}
 txt('已定位：'+s.placedCount+' / '+M.ITEMS.length,100,521,21,GREEN);
 const caption=s.stage==='ready'?'同一个 token，先查出向量，再把坐标画成空间中的点。':s.finished?'位置的意义在于与其他 token 的相对关系；本例点位为预设示意。':s.index>0?'连续映射其他 token：不同向量，对应空间中的不同位置。':s.stage==='token'?'先看「锄」：一个 token，对应一条嵌入向量。':s.stage==='vector'?'这串数字就是坐标；不是给这个字贴一个新的文字标签。':s.stage==='locating'?'用同一组坐标定位；这里不是在展示训练中向量的移动。':'「锄」的向量与这个点，是同一表示；继续看其他 token。';
 txt(caption,100,626,24,GREEN);txt('d₁、d₂、d₃ 只是坐标维度，不是预先命名的“农业轴”或“情绪轴”。',100,670,20,MUTED);
 txt('为看清映射，使用三维玩具向量；真实嵌入通常是高维。数字与相邻点均为预设教学示意，非真实模型数据。',100,720,15,'#89949a');
 txt('相关用法可形成相近的表示，但不等于字义相同；实际高维关系不能仅凭二维投影判断。',100,747,15,'#89949a');
 window.frameDiagnostics={clipped_text:clipped.slice(),current_point:s.point.slice(),placed_points:M.ITEMS.slice(0,s.placedCount).map(item=>({token:item.token,vector:item.vector.slice(),point:M.project(item.vector)}))};return s;
};
const renderMode=new URLSearchParams(location.search).has('render');if(renderMode)document.body.classList.add('render');
let current=0,playing=!renderMode&&!matchMedia('(prefers-reduced-motion: reduce)').matches,last=0;const btn=document.getElementById('play'),seek=document.getElementById('seek'),clock=document.getElementById('clock');
function show(){renderFrame(current);seek.value=Math.round(current*100);clock.textContent=current.toFixed(1)+' / '+M.DURATION+'s';btn.textContent=playing?'暂停':current>=M.DURATION?'演示结束':'播放';}
function replay(){current=0;playing=true;last=performance.now();show();}
btn.onclick=()=>{if(current>=M.DURATION)replay();else{playing=!playing;last=performance.now();show();}};document.getElementById('replay').onclick=replay;seek.oninput=()=>{current=Number(seek.value)/100;playing=false;show();};
window.playerState=()=>({current,playing,model:M.getState(current)});window.seekTo=t=>{current=Math.max(0,Math.min(M.DURATION,t));playing=false;show();};
function tick(now){if(playing){current=Math.min(M.DURATION,current+(now-last)/1000*Number(document.getElementById('speed').value));if(current>=M.DURATION)playing=false;show();}last=now;requestAnimationFrame(tick);}
window.ready=document.fonts.ready.then(()=>{show();last=performance.now();if(!renderMode)requestAnimationFrame(tick);return true;});
</script></body></html>
