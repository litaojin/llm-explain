ect x="1377" y="543" width="85" height="85" rx="4" fill="#eff1ef" stroke="#137765" stroke-width="1.8" id="e66" opacity="0" /><text x="1419" y="598" font-size="22" fill="#63767b" text-anchor="middle" font-weight="400" id="e67" opacity="0">遮挡</text><text x="1035" y="684" font-size="23" fill="#63767b" text-anchor="middle" font-weight="400" id="e68" opacity="0">4</text><rect x="1080" y="642" width="85" height="85" rx="4" fill="#edf5ef" stroke="#d3dfd6" stroke-width="1.8" id="e69" opacity="0" /><text x="1122" y="697" font-size="22" fill="#137765" text-anchor="middle" font-weight="650" id="e70" opacity="0">可见</text><rect x="1179" y="642" width="85" height="85" rx="4" fill="#edf5ef" stroke="#d3dfd6" stroke-width="1.8" id="e71" opacity="0" /><text x="1221" y="697" font-size="22" fill="#137765" text-anchor="middle" font-weight="650" id="e72" opacity="0">可见</text><rect x="1278" y="642" width="85" height="85" rx="4" fill="#edf5ef" stroke="#d3dfd6" stroke-width="1.8" id="e73" opacity="0" /><text x="1320" y="697" font-size="22" fill="#137765" text-anchor="middle" font-weight="650" id="e74" opacity="0">可见</text><rect x="1377" y="642" width="85" height="85" rx="4" fill="#edf5ef" stroke="#d3dfd6" stroke-width="1.8" id="e75" opacity="0" /><text x="1419" y="697" font-size="22" fill="#137765" text-anchor="middle" font-weight="650" id="e76" opacity="0">可见</text><text x="1040" y="805" font-size="23" fill="#137765" text-anchor="start" font-weight="400" id="e77" opacity="0">每一行包含自身与此前位置。</text><text x="100" y="825" font-size="23" fill="#63767b" text-anchor="start" font-weight="400" id="e78" opacity="0">原文训练可同时提供多个位置，但读取范围仍须遵守因果限制。</text><rect x="80" y="920" width="1520" height="60" rx="6" fill="#edf5ef" stroke="none" stroke-width="1.8" id="e79" opacity="0" /><text x="105" y="959" font-size="26" fill="#137765" text-anchor="start" font-weight="650" id="e80" opacity="0">“花”已在输入中；它的表示用于预测后续 token，不能借用未来答案。</text><text x="80" y="1014" font-size="18" fill="#63767b" text-anchor="start" font-weight="400" id="e81" opacity="1">切分为教学示意；矩阵行表示被计算的位置，列表示可读取的来源位置。</text><text x="80" y="1044" font-size="18" fill="#63767b" text-anchor="start" font-weight="400" id="e82" opacity="1">生成到第 3 位置时尚无第 4 位置输入；这里用原文并列展示，便于解释训练中的遮挡。</text><circle id="signal28" r="8" fill="#137765" stroke="#fafbf9" stroke-width="2" opacity="0" data-source-path="e28" data-kind="vector-information" /><circle id="signal29" r="8" fill="#137765" stroke="#fafbf9" stroke-width="2" opacity="0" data-source-path="e29" data-kind="vector-information" /><circle id="signal30" r="8" fill="#137765" stroke="#fafbf9" stroke-width="2" opacity="0" data-source-path="e30" data-kind="vector-information" /></svg></div><div class="controls" aria-label="播放控制"><button id="play" type="button" aria-pressed="false">播放</button><button id="replay" type="button">重播</button><input id="seek" type="range" min="0" max="22" value="0" step="0.01" aria-label="动画时间"><span id="clock" aria-live="off">0 / 22 秒</span><label>倍速 <select id="speed" aria-label="播放速度"><option value="0.5">0.5×</option><option value="1" selected>1×</option><option value="1.5">1.5×</option><option value="2">2×</option></select></label></div><p class="note">人工教学示意；信号沿来源→目标传递，字符与参数不移动。分步显露仅为教学节奏，并非真实张量执行调度。　单次播放后停止。<noscript>交互需启用 JavaScript；可打开同目录的 GIF 观看完整过程。</noscript></p></main><script>const LessonConfig={"id":"causal-visibility","title":"因果可见性：谁能读取谁？","width":1680,"height":1080,"duration":22,"caption":"人工教学示意；信号沿来源→目标传递，字符与参数不移动。分步显露仅为教学节奏，并非真实张量执行调度。","snapshots":[2,6,10,15,20]};</script><script>const DURATION=22;
const clamp=x=>Math.max(0,Math.min(1,x));
const bound=t=>Number.isFinite(Number(t))?Math.max(0,Math.min(DURATION,Number(t))):0;
const times={"e8": 8, "e9": 0, "e10": 0, "e11": 0, "e12": 8, "e13": 0, "e14": 0, "e15": 0, "e16": 8, "e17": 0, "e18": 0, "e19": 0, "e20": 8, "e21": 0, "e22": 0, "e23": 0, "e24": 8, "e25": 8, "e26": 8, "e27": 8, "e28": 8, "e29": 8, "e30": 8, "e31": 8, "e32": 8, "e33": 8, "e34": 8, "e35": 0, "e36": 0, "e37": 0, "e38": 0, "e39": 0, "e40": 0, "e41": 1, "e42": 1, "e43": 1, "e44": 1, "e45": 1, "e46": 1, "e47": 1, "e48": 1, "e49": 1, "e50": 4, "e51": 4, "e52": 4, "e53": 4, "e54": 4, "e55": 4, "e56": 4, "e57": 4, "e58": 4, "e59": 8, "e60": 8, "e61": 8, "e62": 8, "e63": 8, "e64": 8, "e65": 8, "e66": 8, "e67": 8, "e68": 14, "e69": 14, "e70": 14, "e71": 14, "e72": 14, "e73": 14, "e74": 14, "e75": 14, "e76": 14, "e77": 17, "e78": 17, "e79": 17, "e80": 17, "e81": -1, "e82": -1};
function stateAt(input){const time=bound(input),reveals={};for(const [id,start] of Object.entries(times))reveals[id]=clamp((time-start)/.7);

return {time,progress:time/DURATION,stage:time>=DURATION-2?'hold':stage,reveals,...extra};}

function renderFrame(t){currentTime=boundedTime(t);const state=LessonModel.stateAt(currentTime),scene=renderScene(state);$('seek').value=currentTime;$('clock').textContent=currentTime.toFixed(1)+' / '+LessonModel.DURATION+' 秒';window.frameDiagnostics={time:currentTime,model:state,scene};return window.frameDiagnostics}
function updateControls(){$('play').textContent=playing?'暂停':'播放';$('play').setAttribute('aria-pressed',String(playing))}

async function exportPNG(t){pause();renderFrame(t);await document.fonts.ready;const clone=svg.cloneNode(true);clone.setAttribute('xmlns','http://www.w3.org/2000/svg');clone.setAttribute('width',String(LessonConfig.width));clone.setAttribute('height',String(LessonConfig.height));const xml=new XMLSerializer().serializeToString(clone),url=URL.createObjectURL(new Blob([xml],{type:'image/svg+xml;charset=utf-8'}));try{const image=new Image();await new Promise((resolve,reject)=>{image.onload=resolve;image.onerror=reject;image.src=url});const canvas=document.createElement('canvas');canvas.width=LessonConfig.width;canvas.height=LessonConfig.height;const ctx=canvas.getContext('2d');ctx.fillStyle='#fafbf9';ctx.fillRect(0,0,canvas.width,canvas.height);ctx.drawImage(image,0,0,canvas.width,canvas.height);return canvas.toDataURL('image/png')}finally{URL.revokeObjectURL(url)}}
