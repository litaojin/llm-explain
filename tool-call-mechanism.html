<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>工具调用原理：模型请求与程序执行 · LLM Explain</title><style>*{box-sizing:border-box}body{margin:0;background:#fafbf9;color:#20313b;font-family:"Noto Sans CJK SC","Microsoft YaHei",sans-serif}main{max-width:1680px;margin:auto}.canvas{width:100%;overflow:auto}svg{display:block;width:100%;height:auto;min-width:720px}button,select{font:inherit;min-height:44px;padding:8px 15px;border:1px solid #d5dfd7;border-radius:6px;background:#fff;color:#137765;cursor:pointer}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #326a91;outline-offset:3px}.controls{display:flex;align-items:center;flex-wrap:wrap;gap:12px;padding:12px 20px;border-top:1px solid #d5dfd7}#seek{flex:1;min-width:140px;min-height:44px;accent-color:#137765}.note{padding:0 20px;margin:5px 0 18px;color:#596b72;font-size:13px;line-height:1.7}.scroll-hint{display:none}@media(max-width:720px){.scroll-hint{display:block;padding:10px 20px;margin:0;font-size:13px;color:#596b72}.controls{gap:8px}.controls label{display:inline-flex;align-items:center;gap:5px;min-height:44px}#seek{flex-basis:100%}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto}}</style></head><body><main><p class="scroll-hint">小屏可左右滑动图解；下方控件可暂停、拖动与倍速回看。</p><div class="canvas" aria-label="工具调用原理：模型请求与程序执行"><svg xmlns="http://www.w3.org/2000/svg" width="1680" height="1080" viewBox="0 0 1680 1080" role="img"><title>工具调用的原理与流程</title><defs><marker id="green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#137765"/></marker><marker id="blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#326a91"/></marker></defs><style>text{font-family:"Noto Sans CJK SC","Microsoft YaHei",sans-serif}</style><rect width="1680" height="1080" fill="#fafbf9"/><text  x="80" y="42" font-size="18" fill="#137765" font-weight="400">第四部分 · Agent Loop / 动图 03 · 工具调用的原理与流程</text><text  x="80" y="100" font-size="38" fill="#20313b" font-weight="650">模型提出请求，程序怎样真正调用工具？</text><text  x="80" y="148" font-size="24" fill="#63767b" font-weight="400">声明 → 结构化请求 → Runtime 解析与分派 → 执行函数 → Tool 结果 → 模型继续回答。</text><rect  x="80" y="215" width="480" height="190" rx="9" fill="#edf5ef" stroke="#d3dfd6" stroke-width="2"/><text  x="102" y="251" font-size="26" fill="#137765" font-weight="650">Tools 声明 · 提供给模型</text><text  x="102" y="290" font-size="24" fill="#20313b" font-weight="400">list_files(path: string)</text><text  x="102" y="325" font-size="23" fill="#20313b" font-weight="400">用途：列出目录中的文件。</text><text  x="102" y="370" font-size="21" fill="#63767b" font-weight="400">还有 read_files(paths)，本轮不选它。</text><rect id="component-model" x="80" y="480" width="480" height="150" rx="9" fill="white" stroke="#d3dfd6" stroke-width="2"/><text  x="102" y="517" font-size="27" fill="#20313b" font-weight="650">模型 · LLM</text><text id="model-line1" x="102" y="557" font-size="22" fill="#20313b" font-weight="400">问题：课程目录有哪些文件？</text><text id="model-line2" x="102" y="595" font-size="22" fill="#63767b" font-weight="400">不执行文件操作，只生成请求。</text><g id="request" opacity="0"><rect  x="80" y="675" width="480" height="170" rx="9" fill="#edf5ef" stroke="#d3dfd6" stroke-width="2"/><text  x="102" y="713" font-size="25" fill="#137765" font-weight="650">结构化调用请求</text><text  x="102" y="751" font-size="23" fill="#20313b" font-weight="400">id: "call-1"</text><text  x="102" y="788" font-size="23" fill="#20313b" font-weight="400">name: "list_files"</text><g id="request-args" opacity="0"><text  x="102" y="825" font-size="23" fill="#20313b" font-weight="400">arguments: {"path":"课程/"}</text></g></g><rect id="component-runtime" x="640" y="215" width="470" height="425" rx="9" fill="white" stroke="#d3dfd6" stroke-width="2"/><text  x="662" y="255" font-size="27" fill="#20313b" font-weight="650">Runtime · 运行程序</text><g id="parsed-fields" opacity="0"><text  x="662" y="300" font-size="23" fill="#20313b" font-weight="400">调用标识：call-1</text><text  x="662" y="335" font-size="23" fill="#20313b" font-weight="400">工具名称：list_files</text><text  x="662" y="370" font-size="23" fill="#20313b" font-weight="400">参数对象：{path: "课程/"}</text></g><text id="validation-state" x="662" y="414" font-size="22" fill="#63767b" font-weight="400">等待参数格式检查</text><text  x="662" y="459" font-size="23" fill="#137765" font-weight="650">工具注册表 · 名称 → 程序函数</text><rect id="registry-selection" x="655" y="476" width="440" height="43" rx="9" fill="#edf5ef" stroke="#d3dfd6" stroke-width="2"/><text  x="670" y="505" font-size="23" fill="#137765" font-weight="650">list_files  →  listFiles(args)</text><text  x="670" y="550" font-size="23" fill="#63767b" font-weight="400">read_files  →  readFiles(args)</text><text id="runtime-status" x="662" y="610" font-size="22" fill="#63767b" font-weight="400">等待请求 / 解析字段</text><rect id="component-tool" x="1190" y="310" width="410" height="200" rx="9" fill="white" stroke="#d3dfd6" stroke-width="2"/><text  x="1212" y="348" font-size="26" fill="#326a91" font-weight="650">工具实现 · listFiles()</text><text  x="1212" y="387" font-size="23" fill="#20313b" font-weight="400">fs.readdirSync(...).sort()</text><text  x="1212" y="425" font-size="22" fill="#20313b" font-weight="400">访问：隔离样例目录 课程/</text><text id="function-state" x="1212" y="470" font-size="21" fill="#63767b" font-weight="400">等待 Runtime 传入参数</text><g id="file-results" opacity="0"><text  x="1190" y="560" font-size="23" fill="#326a91" font-weight="650">函数返回：</text><text  x="1190" y="600" font-size="23" fill="#326a91" font-weight="400">["学习.md","预测.md"]</text></g><rect id="component-context" x="640" y="700" width="960" height="170" rx="9" fill="#edf3f7" stroke="#d3dfd6" stroke-width="2"/><text  x="662" y="738" font-size="25" fill="#326a91" font-weight="650">Context · 保存对应调用与工具返回结果</text><g id="tool-message" opacity="0"><text  x="662" y="778" font-size="23" fill="#326a91" font-weight="650">role: "tool"     tool_call_id: "call-1"</text><text  x="662" y="816" font-size="23" fill="#20313b" font-weight="400">content: ["学习.md","预测.md"]</text><text  x="662" y="850" font-size="22" fill="#63767b" font-weight="400">助手请求 call-1 与 Tool 结果配对，再提供给下一次模型调用。</text></g><path id="route-declaration" d="M320 405 V465" fill="none" stroke="#137765" stroke-width="3" marker-end="url(#green)"/><path id="route-generated" d="M320 630 V660" fill="none" stroke="#137765" stroke-width="3" marker-end="url(#green)"/><path id="route-request" d="M560 750 H610 V350 H625" fill="none" stroke="#137765" stroke-width="3" marker-end="url(#green)"/><path id="route-invoke" d="M1110 498 H1145 V410 H1175" fill="none" stroke="#137765" stroke-width="3" marker-end="url(#green)"/><path id="route-result" d="M1600 420 H1630 V660 H1395 V685" fill="none" stroke="#326a91" stroke-width="3" marker-end="url(#blue)"/><path id="route-context" d="M640 790 H590 V557 H575" fill="none" stroke="#326a91" stroke-width="3" marker-end="url(#blue)"/><text  x="1180" y="257" font-size="22" fill="#326a91" font-weight="650">真正的 I/O 发生在函数实现中</text><text id="loop-summary" x="665" y="900" font-size="21" fill="#63767b" font-weight="400">模型调用 0 次 · 函数执行 0 次</text><circle id="message-signal" cx="0" cy="0" r="9" fill="#137765" stroke="white" stroke-width="3" opacity="0"/><rect  x="80" y="920" width="1520" height="60" rx="9" fill="#edf5ef" stroke="#d3dfd6" stroke-width="2"/><text id="step-caption" x="105" y="960" font-size="25" fill="#137765" font-weight="650">工具声明不会自动执行程序。</text><text  x="80" y="1015" font-size="18" fill="#63767b" font-weight="400">模型请求为预设示例；构建时 listFiles 已真实读取隔离样例目录，网页按记录回放，未调用真实 LLM。</text><text  x="80" y="1044" font-size="18" fill="#63767b" font-weight="400">字段是便于理解的简化表示，不同 API 格式可能不同；本课不展开权限、MCP 或外部服务接入。</text></svg></div><div class="controls" aria-label="播放控制"><button id="play" type="button" aria-pressed="false">播放</button><button id="replay" type="button">重播</button><input id="seek" type="range" min="0" max="26" value="0" step="0.01" aria-label="动画时间"><span id="clock" aria-live="off">0 / 26 秒</span><label>倍速 <select id="speed" aria-label="播放速度"><option value="0.5">0.5×</option><option value="1" selected>1×</option><option value="1.5">1.5×</option><option value="2">2×</option></select></label></div><p class="note">第四部分第 3 课。模型请求预设；工具实现真实读取隔离样例目录后录制回放，不调用真实 LLM 或外部服务。　单次播放后停止。<noscript>交互需启用 JavaScript；可打开同目录的 GIF 观看完整过程。</noscript></p></main><script>const LessonConfig={"id":"tool-call-mechanism","title":"工具调用原理：模型请求与程序执行","width":1680,"height":1080,"duration":26,"snapshots":[4,6,8,9,10.5,12,14.5,16.3,19,21.5,24],"caption":"第四部分第 3 课。模型请求预设；工具实现真实读取隔离样例目录后录制回放，不调用真实 LLM 或外部服务。"};</script><script>window.ToolExecutionData={"request":{"id":"call-1","name":"list_files","arguments":{"path":"课程/"}},"result":["学习.md","预测.md"],"resolvedFunction":"listFiles","toolMessage":{"role":"tool","tool_call_id":"call-1","content":"[\"学习.md\",\"预测.md\"]"},"model_request_source":"preset teaching request; no LLM called","tool_execution":"real Node fs.readdirSync on isolated fixtures","fixture_directory":"fixtures/课程/"};
(function(root){const data=typeof module==='object'&&module.exports?require('./runtime.cjs').runExample():root.ToolExecutionData;const DURATION=26;const phases=[
[0,2,'declaration','declaration','工具声明描述名称、参数与用途；它本身不会执行任何文件操作。'],
[2,4,'decide',null,'模型结合用户问题与工具说明，选择 list_files，并生成结构化请求。'],
[4,5.5,'generated','generated','模型输出的是调用名称、具体参数与调用标识，不是目录查询结果。'],
[5.5,7,'send','request','请求交给 Runtime；程序才是实际调用工具的执行者。'],
[7,8.8,'parse',null,'Runtime 解析结构化字段：id、name、arguments。'],
[8.8,10,'validate',null,'检查参数格式：这里的 path 必须是字符串。'],
[10,11.5,'resolve',null,'按注册表查找：list_files 对应程序里的 listFiles 函数。'],
[11.5,13,'invoke','invoke','Runtime 把 path="课程/" 传给已注册的函数实现。'],
[13,14.5,'execute',null,'函数执行实际目录读取；模型输出文字不等于完成这一步。'],
[14.5,16.3,'return','result','函数返回文件名列表；返回内容来自执行，而不是模型猜测。'],
[16.3,18,'wrap',null,'Runtime 封装 Tool 消息，用 tool_call_id 对应原来的 call-1。'],
[18,20,'context','context','助手调用与 Tool 结果保留在 Context，提供给下一次模型调用。'],
[20,21.5,'read-result',null,'模型再次被调用，这一次输入中已经有工具返回的文件名。'],
[21.5,24,'answer',null,'模型依据工具结果回答用户；需要更多信息时也可以再提出工具请求。'],
[24,26,'done',null,'声明告诉模型“能用什么”；注册表与函数实现让程序“真正执行”。']];
function stateAt(value){let t=Number(value);t=Number.isFinite(t)?Math.max(0,Math.min(DURATION,t)):0;const p=phases.find(p=>t>=p[0]&&t<p[1])||phases.at(-1);return {time:t,stage:p[2],caption:p[4],data:JSON.parse(JSON.stringify(data)),requestVisible:t>=4,argsVisible:t>=4.8,parsed:t>=7,validated:t>=8.8,registrySelected:t>=10,executed:t>=14.5,toolMessageVisible:t>=16.3,nextModelHasResult:t>=20,answered:t>=21.5,modelCalls:t>=20?2:t>=2?1:0,toolExecutions:t>=14.5?1:0,signal:p[3]?{route:p[3],progress:(t-p[0])/(p[1]-p[0])}:null,done:t>=24}}
const M={DURATION,stateAt,phases};if(typeof module==='object'&&module.exports)module.exports=M;else root.LessonModel=M;})(typeof window==='object'?window:globalThis);
</script><script>const routeIds={declaration:'route-declaration',generated:'route-generated',request:'route-request',invoke:'route-invoke',result:'route-result',context:'route-context'};
function renderScene(s){opacity('request',s.requestVisible?1:0);opacity('request-args',s.argsVisible?1:0);opacity('parsed-fields',s.parsed?1:0);opacity('tool-message',s.toolMessageVisible?1:0);opacity('file-results',s.executed?1:0);text('validation-state',s.validated?'格式检查通过：path 是字符串':'等待参数格式检查');$('registry-selection').setAttribute('stroke',s.registrySelected?'#137765':'#d3dfd6');$('registry-selection').setAttribute('stroke-width',s.registrySelected?'4':'1');text('runtime-status',s.registrySelected?'已解析名称 → listFiles(args)':'等待请求 / 解析字段');
text('model-line1',s.answered?'根据 Tool 结果回答用户':s.nextModelHasResult?'第 2 次调用：已取得文件名':s.requestVisible?'第 1 次输出：工具请求':'问题：课程目录有哪些文件？');text('model-line2',s.answered?'目录有：'+s.data.result.join('、'):s.nextModelHasResult?'读取结果，再生成回答。':'不执行文件操作，只生成请求。');
text('function-state',s.executed?'已执行：真实样例目录读取':s.stage==='execute'?'正在执行 fs.readdirSync(...)':'等待 Runtime 传入参数');text('step-caption',s.caption);text('loop-summary','模型调用 '+s.modelCalls+' 次 · 函数执行 '+s.toolExecutions+' 次');
for(const [name,id] of Object.entries(routeIds)){$(id).setAttribute('opacity',s.signal?.route===name?'1':'.2');$(id).setAttribute('stroke-width',s.signal?.route===name?'4':'2')}
for(const id of ['model','runtime','tool','context']){$('component-'+id).setAttribute('stroke','#d3dfd6');$('component-'+id).setAttribute('stroke-width','2')}const active=s.stage==='execute'||s.stage==='return'?'tool':s.stage==='wrap'||s.stage==='context'?'context':['parse','validate','resolve','invoke'].includes(s.stage)?'runtime':'model';$('component-'+active).setAttribute('stroke','#137765');$('component-'+active).setAttribute('stroke-width','4');
const dot=$('message-signal');if(s.signal){const p=$(routeIds[s.signal.route]),pt=p.getPointAtLength(p.getTotalLength()*s.signal.progress);dot.setAttribute('cx',pt.x);dot.setAttribute('cy',pt.y);dot.setAttribute('fill',['result','context'].includes(s.signal.route)?'#326a91':'#137765');dot.setAttribute('opacity','1')}else dot.setAttribute('opacity','0');return {answered:s.answered,executed:s.executed,requestId:s.data.request.id,resultId:s.data.toolMessage.tool_call_id,realFixtureResult:s.data.result};}
</script><script>const svg=document.querySelector('svg'),$=id=>document.getElementById(id);
function text(id,value){const e=$(id);if(!e)throw Error('Missing SVG label '+id);e.textContent=String(value)}
function opacity(id,value){const e=$(id);if(!e)throw Error('Missing SVG group '+id);e.setAttribute('opacity',String(value))}
let currentTime=0,playing=false,rate=1,raf=0,lastTick=0;
function boundedTime(t){t=Number(t);return Number.isFinite(t)?Math.max(0,Math.min(LessonModel.DURATION,t)):0}
function renderFrame(t){currentTime=boundedTime(t);const state=LessonModel.stateAt(currentTime),scene=renderScene(state);$('seek').value=currentTime;$('clock').textContent=currentTime.toFixed(1)+' / '+LessonModel.DURATION+' 秒';window.frameDiagnostics={time:currentTime,model:state,scene};return window.frameDiagnostics}
function updateControls(){$('play').textContent=playing?'暂停':'播放';$('play').setAttribute('aria-pressed',String(playing))}
function pause(){playing=false;cancelAnimationFrame(raf);updateControls()}
function tick(now){if(!playing)return;const elapsed=Math.max(0,(now-lastTick)/1000);lastTick=now;renderFrame(currentTime+elapsed*rate);if(currentTime>=LessonModel.DURATION){pause();return}raf=requestAnimationFrame(tick)}
function play(){if(currentTime>=LessonModel.DURATION)renderFrame(0);if(playing)return;playing=true;lastTick=performance.now();updateControls();raf=requestAnimationFrame(tick)}
function seekTo(t){pause();return renderFrame(t)}
function playerState(){return {playing,current:currentTime,speed:rate,duration:LessonModel.DURATION,stage:window.frameDiagnostics?.model?.stage}}
function visibleTextBounds(){const r=svg.getBoundingClientRect();return [...svg.querySelectorAll('text')].filter(e=>{for(let n=e;n&&n!==svg.parentNode;n=n.parentElement){const c=getComputedStyle(n);if(c.display==='none'||c.visibility==='hidden'||Number(c.opacity)===0)return false}return !!e.textContent.trim()}).map(e=>{const b=e.getBBox(),m=e.getScreenCTM(),a=new DOMPoint(b.x,b.y).matrixTransform(m),z=new DOMPoint(b.x+b.width,b.y+b.height).matrixTransform(m);return {id:e.id,text:e.textContent,x:a.x-r.x,y:a.y-r.y,width:z.x-a.x,height:z.y-a.y,inside:a.x>=r.x-1&&a.y>=r.y-1&&z.x<=r.right+1&&z.y<=r.bottom+1}})}
async function exportPNG(t){pause();renderFrame(t);await document.fonts.ready;const clone=svg.cloneNode(true);clone.setAttribute('xmlns','http://www.w3.org/2000/svg');clone.setAttribute('width',String(LessonConfig.width));clone.setAttribute('height',String(LessonConfig.height));const xml=new XMLSerializer().serializeToString(clone),url=URL.createObjectURL(new Blob([xml],{type:'image/svg+xml;charset=utf-8'}));try{const image=new Image();await new Promise((resolve,reject)=>{image.onload=resolve;image.onerror=reject;image.src=url});const canvas=document.createElement('canvas');canvas.width=LessonConfig.width;canvas.height=LessonConfig.height;const ctx=canvas.getContext('2d');ctx.fillStyle='#fafbf9';ctx.fillRect(0,0,canvas.width,canvas.height);ctx.drawImage(image,0,0,canvas.width,canvas.height);return canvas.toDataURL('image/png')}finally{URL.revokeObjectURL(url)}}
$('play').onclick=()=>playing?pause():play();$('replay').onclick=()=>{pause();renderFrame(0);play()};$('seek').addEventListener('input',e=>seekTo(e.target.value));$('speed').onchange=e=>{rate=Number(e.target.value)};svg.addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();playing?pause():play()}if(e.code==='ArrowRight'){e.preventDefault();seekTo(currentTime+1)}if(e.code==='ArrowLeft'){e.preventDefault();seekTo(currentTime-1)}});document.addEventListener('visibilitychange',()=>{if(document.hidden)pause()});
const ready=(async()=>{await document.fonts.ready;renderFrame(0);updateControls();if(!new URLSearchParams(location.search).has('render')&&!matchMedia('(prefers-reduced-motion: reduce)').matches)play();return true})();
window.ready=ready;window.renderFrame=renderFrame;window.exportPNG=exportPNG;window.seekTo=seekTo;window.playerState=playerState;window.visibleTextBounds=visibleTextBounds;
</script></body></html>
