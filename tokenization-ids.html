  'use strict';
  const DURATION = 16;
  const toyVocab = Object.freeze({'我':17,'爱':8,'北京':42,'，':3});
  function tokenize(input) {
    const result = [], keys = Object.keys(toyVocab).sort((a,b)=>b.length-a.length);
    let offset = 0;
    while (offset < input.length) {
      const piece = keys.find(k => input.startsWith(k, offset));
      if (!piece) throw new Error('字符不在教学词表中：' + input.slice(offset));
      result.push(piece); offset += piece.length;
    }
    return result;
  }
  function stateAt(t) {
    const number = Number(t);
    const time = Math.max(0,Math.min(DURATION,Number.isNaN(number)?0:number));
    const input = '我爱北京，我爱北京', tokens = tokenize(input);
    const pieceCount = time < 2 ? 0 : Math.min(7,1+Math.floor((time-2)/0.55+1e-9));
    const idCount = time < 6.8 ? 0 : Math.min(7,1+Math.floor((time-6.8)/0.8+1e-9));
    const lookupIndex = time >= 6 && time < 11.6 ? Math.min(6,Math.floor((time-6)/0.8+1e-9)) : -1;
    const lookupProgress = lookupIndex < 0 ? 0 : Math.max(0,Math.min(1,((time-6)/0.8)-lookupIndex));
    const stage = time < 2 ? 'text' : time < 6 ? 'pieces' : time < 12 ? 'lookup' : 'summary';
    const messages = {text:'① 先看原文：文字还没有变成编号。',pieces:'② 按玩具规则切分：“北京”是一个片段，不是两个。',lookup:'③ 每个片段查同一张教学词表，依次取出 ID。',summary:'④ 完成：7 个 token → 7 个 ID；重复 token 的 ID 一致。'};
    return {time,stage,input,tokens,ids:tokens.map(p=>toyVocab[p]),vocab:{...toyVocab},pieceCount,idCount,lookupIndex,lookupProgress,
      message:messages[stage],showVocab:time>=6,summary:time>=12,
      activeToken:lookupIndex<0?null:tokens[lookupIndex],
      takeaway:time>=12?'ID 是词表索引，不是词义，也不是向量。':'先确定片段边界，再按词表把片段换成编号。'};
  }
  return {DURATION,stateAt,tokenize};
});
</script><script>'use strict';
function renderScene(s) {

  text('tk-lookup-caption',s.lookupIndex>=0?'正在查：'+s.activeToken+' → '+s.ids[s.lookupIndex]:'按 token 查词表，保持原来顺序');
  for (let tkI=0;tkI<7;tkI++) {
    opacity('tk-piece-'+tkI,tkI<s.pieceCount?1:0);
    opacity('tk-id-'+tkI,tkI<s.idCount?1:0);

  }
  const tkKeys=['我','爱','北京','，'];

    text('tk-vocab-text-'+tkI,tkKeys[tkI]+' → '+s.vocab[tkKeys[tkI]]);

    $('tk-vocab-box-'+tkI).setAttribute('stroke',tkKeys[tkI]===s.activeToken?'#137765':'#cad6ce');
  }

  opacity('tk-lookup-in',tkActive?1:0); opacity('tk-lookup-out',tkActive?1:0); opacity('tk-signal',tkActive?1:0);
  if (tkActive) {

    $('tk-lookup-out').setAttribute('d','M'+tkTableX+' 506 C'+tkTableX+' 550 '+tkX+' 530 '+tkX+' 569');

  } else {

}

function visibleTextBounds(){const r=svg.getBoundingClientRect();return [...svg.querySelectorAll('text')].filter(e=>{for(let n=e;n&&n!==svg.parentNode;n=n.parentElement){const c=getComputedStyle(n);if(c.display==='none'||c.visibility==='hidden'||Number(c.opacity)===0)return false}return !!e.textContent.trim()}).map(e=>{const b=e.getBBox(),m=e.getScreenCTM(),a=new DOMPoint(b.x,b.y).matrixTransform(m),z=new DOMPoint(b.x+b.width,b.y+b.height).matrixTransform(m);return {id:e.id,text:e.textContent,x:a.x-r.x,y:a.y-r.y,width:z.x-a.x,height:z.y-a.y,inside:a.x>=r.x-1&&a.y>=r.y-1&&z.x<=r.right+1&&z.y<=r.bottom+1}})}
async function exportPNG(t){pause();renderFrame(t);await document.fonts.ready;const clone=svg.cloneNode(true);clone.setAttribute('xmlns','http://www.w3.org/2000/svg');clone.setAttribute('width',String(LessonConfig.width));clone.setAttribute('height',String(LessonConfig.height));const xml=new XMLSerializer().serializeToString(clone),url=URL.createObjectURL(new Blob([xml],{type:'image/svg+xml;charset=utf-8'}));try{const image=new Image();await new Promise((resolve,reject)=>{image.onload=resolve;image.onerror=reject;image.src=url});const canvas=document.createElement('canvas');canvas.width=LessonConfig.width;canvas.height=LessonConfig.height;const ctx=canvas.getContext('2d');ctx.fillStyle='#fafbf9';ctx.fillRect(0,0,canvas.width,canvas.height);ctx.drawImage(image,0,0,canvas.width,canvas.height);return canvas.toDataURL('image/png')}finally{URL.revokeObjectURL(url)}}
$('play').onclick=()=>playing?pause():play();$('replay').onclick=()=>{pause();renderFrame(0);play()};$('seek').addEventListener('input',e=>seekTo(e.target.value));$('speed').onchange=e=>{rate=Number(e.target.value)};svg.addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();playing?pause():play()}if(e.code==='ArrowRight'){e.preventDefault();seekTo(currentTime+1)}if(e.code==='ArrowLeft'){e.preventDefault();seekTo(currentTime-1)}});document.addEventListener('visibilitychange',()=>{if(document.hidden)pause()});
