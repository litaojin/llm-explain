<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>指令微调：学习按要求回答</title><style>*{box-sizing:border-box}body{margin:0;background:#fafbf9;color:#20313b;font-family:"Noto Sans CJK SC","Microsoft YaHei",sans-serif}main{max-width:1440px;margin:12px auto 0}svg{display:block;width:100%;height:auto}nav{display:flex;gap:12px;align-items:center;flex-wrap:wrap;max-width:1050px;margin:8px auto;padding:0 22px}button{min-height:44px;border:1px solid #b7c9c0;background:white;border-radius:8px;padding:8px 18px;font:inherit;cursor:pointer;color:#175d50}button:focus-visible,input:focus-visible{outline:3px solid #137765;outline-offset:3px}#play{background:#137765;color:white;border-color:#137765;min-width:105px}input{flex:1;min-width:140px;height:44px;accent-color:#137765}#clock{min-width:80px;font:16px monospace}p{font-size:14px;color:#64737c;text-align:center;padding:0 16px}body.render main{margin:0;max-width:none}body.render nav,body.render p{display:none}</style></head><body><main><svg xmlns="http://www.w3.org/2000/svg" width="1440" height="810" viewBox="0 0 1440 810" role="img" aria-labelledby="title desc">
<title id="title">指令微调：用示范回答，学习按要求回答</title>
<desc id="desc">训练样本由指令和示范回答组成。指令为把锄禾日当午翻译成白话。示范回答为农民在正午的烈日下锄禾。图示回答第一个 token 的训练：LLM 接收指令，示意预测为汗；从示范回答取出的目标 token 为农。依据目标 token 的预测概率计算误差，将误差信号反馈至模型参数。此图不是对预训练和微调能力的硬性划分，也不是真实模型运行。</desc>

<text x="990" y="405" class="token">汗</text>

</svg>
</main><nav aria-label="播放控制"><button id="play">暂停</button><button id="replay">重新播放</button><input id="seek" type="range" min="0" max="1500" value="0" aria-label="动画进度"><select id="speed" aria-label="播放速度" style="min-height:44px;font:inherit;border:1px solid #b7c9c0;border-radius:8px;background:white;padding:6px"><option value=".75">0.75×</option><option value="1" selected>1×</option><option value="1.5">1.5×</option><option value="2">2×</option></select><span id="clock"></span></nav><p>预设教学示意，非真实训练。可暂停、拖动或重新播放；手机建议横屏观看。</p><script>(function(root){
 const ANSWER='农民在正午的烈日下锄禾。',TOKENS=Array.from(ANSWER),PREDICTIONS=Array.from('汗民是正午的炎日下种禾。');
 const LEAD=1.5,FIRST=2.8,REST=.5,AGGREGATE_START=LEAD+FIRST+(TOKENS.length-1)*REST,UPDATE_START=AGGREGATE_START+1,FINISH_START=UPDATE_START+1.8,DURATION=15;
 function getState(seconds){
  const t=Math.max(0,Math.min(DURATION,Number.isFinite(seconds)?seconds:0)),elapsed=Math.max(0,t-LEAD);
  const phase=t<LEAD?'ready':t<AGGREGATE_START?'position':t<UPDATE_START?'aggregate':t<FINISH_START?'update':'finished';
  const index=phase==='ready'?0:phase!=='position'?TOKENS.length-1:elapsed<FIRST?0:Math.min(TOKENS.length-1,1+Math.floor((elapsed-FIRST)/REST));
  const start=LEAD+(index===0?0:FIRST+(index-1)*REST),span=index===0?FIRST:REST;
  const progress=phase==='ready'?0:phase==='position'?Math.min(1,(t-start)/span):phase==='aggregate'?(t-AGGREGATE_START):phase==='update'?(t-UPDATE_START)/1.8:1;
  const stage=phase!=='position'?phase:progress<.18?'input':progress<.35?'predict':progress<.62?'reveal':'error';
  const lossCount=phase==='ready'?0:phase==='position'?index+(progress>=(index===0?.8:.5)?1:0):TOKENS.length;
  return {phase,stage,index,progress,target:TOKENS[index],prediction:PREDICTIONS[index],answerPrefix:TOKENS.slice(0,index).join(''),lossCount,predictionVisible:phase!=='ready'&&(index>0||progress>=.18||phase!=='position'),targetVisible:phase!=='ready'&&(index>0||progress>=.35||phase!=='position'),errorVisible:lossCount>0||stage==='error',updating:phase==='update',updated:phase==='finished',finished:phase==='finished',updateCount:phase==='finished'?1:0};
 }
 const api={ANSWER,TOKENS,LEAD,FIRST,REST,AGGREGATE_START,UPDATE_START,FINISH_START,DURATION,getState};if(typeof module==='object'&&module.exports)module.exports=api;else root.SFTFastModel=api;
})(typeof window==='object'?window:globalThis);
</script><script>
const M=SFTFastModel,svg=document.querySelector('svg'),NS='http://www.w3.org/2000/svg';
const findText=s=>[...svg.querySelectorAll('text')].find(e=>e.textContent===s);
const pred=findText('汗'),target=findText('农'),sourceAnswer=svg.querySelector('text[x="236"][y="236"]');
const caption=findText('学的是：看到这样的指令，应当怎样回答。'),loss=findText('计算预测误差'),updateLabel=findText('根据误差，更新参数');
const inputBox=svg.querySelector('rect[x="110"][y="350"]'),modelBox=svg.querySelector('rect[x="630"]'),targetBox=svg.querySelector('rect[x="1190"]');
const flow=[...svg.querySelectorAll('path.flow')],sourcePath=flow[0],inputPath=flow[1],outputPath=flow[2],lossPath=flow[3],feedback=svg.querySelector('path.update'),branches=svg.querySelector('path.link');
findText('训练回路不变，样本换成「指令—示范回答」。').textContent='用整句示范回答计算 loss，汇总后更新参数。';
findText('输入指令').textContent='输入：指令＋正确回答前缀';
findText('示范回答的下一个 token').textContent='当前示范 token';
const instruction=svg.querySelector('text[x="134"][y="394"]'),prefixLine=svg.querySelector('text[x="134"][y="434"]');instruction.setAttribute('font-size','22');instruction.textContent='把“锄禾日当午”翻译成白话。';prefixLine.setAttribute('font-size','20');

const chars=M.TOKENS.map(c=>{const e=document.createElementNS(NS,'tspan');e.textContent=c;sourceAnswer.appendChild(e);return e;});
const bars=M.TOKENS.map((c,i)=>{const r=document.createElementNS(NS,'rect');for(const [k,v]of Object.entries({x:238+i*27,y:248,width:21,height:4,rx:2,fill:'#d3dcd7'}))r.setAttribute(k,v);svg.appendChild(r);return r;});
const counter=document.createElementNS(NS,'text');counter.setAttribute('x','110');counter.setAttribute('y','285');counter.setAttribute('font-size','20');counter.setAttribute('fill','#137765');svg.appendChild(counter);
const footer=[...svg.querySelectorAll('text')].find(e=>e.getAttribute('y')==='778');footer.setAttribute('y','765');footer.textContent='逐字 token、预测与参数变化为预设教学示意，未调用真实模型；省略结束标记。';
const footer2=footer.cloneNode(true);footer2.setAttribute('y','791');footer2.textContent='逐个亮起仅为展示节奏；实际训练通常并行计算多个位置的 loss，汇总后更新参数。';footer.after(footer2);
function branch(d){const el=document.createElementNS(NS,'path');el.setAttribute('d',d);svg.querySelector('defs').appendChild(el);return el;}
const leftBranch=branch('M990 466 V500 H1115'),rightBranch=branch('M1240 466 V500 H1115');
const dots=Array.from({length:6},()=>{const e=document.createElementNS(NS,'circle');e.setAttribute('r','6');e.setAttribute('fill','#137765');e.style.display='none';svg.appendChild(e);return e;});
function moveDot(index,path,p,on){const e=dots[index];e.style.display=on?'':'none';if(on){const pt=path.getPointAtLength(path.getTotalLength()*Math.max(0,Math.min(1,p)));e.setAttribute('cx',pt.x);e.setAttribute('cy',pt.y);}}
window.renderFrame=function(t){
 const s=M.getState(t),active=s.updating||s.updated,pos=s.phase==='position';
 pred.textContent=s.predictionVisible?s.prediction:'…';target.textContent=s.targetVisible?s.target:'…';
 prefixLine.textContent='前缀：'+(s.answerPrefix||'（空）');
 chars.forEach((el,i)=>{el.style.fill=i<s.lossCount||(i===s.index&&s.targetVisible)?'#137765':'#20313b';el.style.fontWeight=i===s.index&&s.targetVisible?'650':'400';});
 bars.forEach((r,i)=>r.setAttribute('fill',i<s.lossCount?'#137765':'#d3dcd7'));
 counter.textContent='已计算 loss：'+s.lossCount+' / '+M.TOKENS.length+' 个位置';
 inputBox.style.stroke=pos?'#137765':'#d6dfe3';inputBox.style.strokeWidth=pos?'2':'1.5';
 targetBox.style.fill=s.targetVisible?'#e6f5ef':'#fff';targetBox.style.stroke=s.targetVisible?'#137765':'#d3dcd7';target.style.fill=s.targetVisible?'#137765':'#89949a';
 sourcePath.style.stroke=s.targetVisible?'#64757d':'#d3dcd7';inputPath.style.stroke=pos&&s.stage==='input'?'#137765':'#64757d';outputPath.style.stroke=pos&&s.stage==='predict'?'#137765':'#64757d';
 branches.style.stroke=s.errorVisible?'#64757d':'#d3dcd7';lossPath.style.stroke=s.errorVisible?'#64757d':'#d3dcd7';loss.style.fill=s.errorVisible?'#20313b':'#a8b3ad';
 loss.textContent=s.phase==='aggregate'||active?'整句 loss（汇总）':'当前位置 loss';
 feedback.style.stroke=active?'#137765':'#d3dcd7';feedback.style.strokeWidth=s.updating?'3.2':'2.8';feedback.style.opacity=active?'1':'.35';updateLabel.style.fill=active?'#137765':'#89949a';
 modelBox.style.fill=s.updated?'#e6f5ef':'#fff';modelBox.style.stroke=active?'#137765':'#8b9aa3';modelBox.style.strokeWidth=active?'3':'1.8';
 moveDot(0,inputPath,s.progress/.18,pos&&s.stage==='input');moveDot(1,outputPath,(s.progress-.18)/.17,pos&&s.stage==='predict');moveDot(2,sourcePath,(s.progress-.35)/.27,pos&&s.stage==='reveal');
 moveDot(3,leftBranch,(s.progress-.62)/.38,pos&&s.stage==='error');moveDot(4,rightBranch,(s.progress-.62)/.38,pos&&s.stage==='error');moveDot(5,feedback,s.progress,s.updating);dots[5].setAttribute('r','7');
 caption.textContent=s.phase==='ready'?'同一条指令，对整句示范回答进行训练。':s.phase==='aggregate'?'汇总整句 '+M.TOKENS.length+' 个回答位置的 loss，再更新参数。':s.phase==='update'?'汇总整句 loss，回传误差信号，更新模型参数。':s.finished?'整句参与训练：学习看到这样的指令，应当怎样回答。':s.index>0?'连续处理后续位置；输入始终使用正确的回答前缀。':s.stage==='input'?'先看首个位置：用指令预测回答的第一个 token。':s.stage==='predict'?'预测「汗」（示意），目标来自示范回答。':s.stage==='reveal'?'示范目标是「农」：据其预测概率计算 loss。':'首个位置的 loss 计入，继续处理后续位置。';
 const vb=svg.getBoundingClientRect();const clipped=[...svg.querySelectorAll('text')].filter(el=>{const b=el.getBBox(),m=el.getScreenCTM();return [[b.x,b.y],[b.x+b.width,b.y],[b.x,b.y+b.height],[b.x+b.width,b.y+b.height]].some(([x,y])=>{const p=new DOMPoint(x,y).matrixTransform(m);return p.x<vb.left-.1||p.x>vb.right+.1||p.y<vb.top-.1||p.y>vb.bottom+.1})}).map(el=>el.textContent);
 window.frameDiagnostics={clipped_text:clipped};return s;
};
window.exportPNG=async(t)=>{renderFrame(t);if(frameDiagnostics.clipped_text.length)throw Error(JSON.stringify(frameDiagnostics));const source=new XMLSerializer().serializeToString(svg),img=new Image();img.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(source);await img.decode();const c=document.createElement('canvas');c.width=1440;c.height=810;c.getContext('2d').drawImage(img,0,0);return c.toDataURL('image/png').split(',')[1];};
const renderMode=new URLSearchParams(location.search).has('render');if(renderMode)document.body.classList.add('render');
let current=0,playing=!renderMode&&!matchMedia('(prefers-reduced-motion: reduce)').matches,last=0;
const btn=document.getElementById('play'),seek=document.getElementById('seek'),clock=document.getElementById('clock');
function show(){renderFrame(current);seek.value=Math.round(current*100);clock.textContent=current.toFixed(1)+' / '+M.DURATION+'s';btn.textContent=playing?'暂停':current>=M.DURATION?'演示结束':'播放';}
function replay(){current=0;playing=true;last=performance.now();show();}
btn.onclick=()=>{if(current>=M.DURATION)replay();else{playing=!playing;last=performance.now();show();}};document.getElementById('replay').onclick=replay;
seek.oninput=()=>{current=Number(seek.value)/100;playing=false;show();};
window.playerState=()=>({current,playing,model:M.getState(current)});window.seekTo=t=>{current=Math.max(0,Math.min(M.DURATION,t));playing=false;show();};
function tick(now){if(playing){current=Math.min(M.DURATION,current+(now-last)/1000*Number(document.getElementById('speed').value));if(current>=M.DURATION)playing=false;show();}last=now;requestAnimationFrame(tick);}
window.ready=document.fonts.ready.then(()=>{show();last=performance.now();if(!renderMode)requestAnimationFrame(tick);return true;});
</script></body></html>
